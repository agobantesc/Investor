<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INVERSOR 2.0 — Portfolio Intelligence</title>
<script>try{if(localStorage.getItem('inv_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
  :root{
    color-scheme:light;
    /* Fondos / superficies estratificadas (3 niveles) */
    --bg:#EEF2F8; --surface:#F5F8FC; --card:#FFFFFF; --card2:#FBFCFE;
    --soft:#F3F7FD; --soft2:#E8F0FB;
    /* Tinta */
    --ink:#0C2240; --navy:#0F2E63; --muted:#566A8C; --faint:#8A9DBD;
    /* Líneas */
    --line:#E3EAF4; --line2:#CDD9EA; --line3:#F0F4FA;
    /* Acento primario + rampa */
    --accent:#1E5FD1; --accent2:#4F9BEF; --indigo:#1E5FD1;
    --a-50:#EAF1FD; --a-100:#D4E3FB; --a-200:#A9C6F6; --a-300:#7CA8F0;
    --a-400:#4F8AEA; --a-500:#1E5FD1; --a-600:#1A4FAE; --a-700:#163F89;
    /* Acento de datos (cian de marca) */
    --data:#0E8F86; --data-2:#22D3EE; --data-bg:#E2F5F3;
    --brand-cyan:#22D3EE; --brand-blue:#3B82F6;
    --brand-grad:linear-gradient(135deg,#3B82F6 0%,#22D3EE 100%);
    /* Semánticos */
    --green:#0B8457; --greenbg:#E2F4EC; --green-line:#9FDCC2;
    --red:#CE2F3B; --redbg:#FBE9EA; --red-line:#F0B6BB;
    --amber:#A8700C; --amberbg:#FAF0D9; --amber-line:#EAD09A;
    --violet:#6D54D8; --violet-bg:#EDE9FC;
    /* Sombras en capas */
    --sh-xs:0 1px 2px rgba(14,28,54,.05);
    --sh:0 1px 1px rgba(14,28,54,.04), 0 2px 6px rgba(14,28,54,.05);
    --sh-md:0 1px 2px rgba(14,28,54,.05), 0 8px 22px rgba(14,28,54,.09);
    --sh-lg:0 2px 4px rgba(14,28,54,.06), 0 18px 44px rgba(14,28,54,.14);
    --shL:0 16px 44px rgba(14,28,54,.16);
    --ring:0 0 0 3px rgba(30,95,209,.20);
    /* Charts (tematizables vía JS) */
    --chart-grid:#EAF0F8; --chart-axis:#CBD5E6; --chart-zero:#C2CEDF;
    /* Forma */
    --r:14px; --r-lg:16px; --r-sm:9px; --r-xs:6px; --r-pill:999px;
    /* Glass + sidebar + movimiento */
    --glass:rgba(255,255,255,.72);
    --side-grad:linear-gradient(168deg,#0A1E3D 0%,#123769 62%,#16407A 100%);
    --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,'Cascadia Mono',Menlo,monospace;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0A1220; --surface:#0E1828; --card:#121E32; --card2:#16243B;
    --soft:#16243C; --soft2:#1B2C49;
    --ink:#E7EEF9; --navy:#F2F6FD; --muted:#93A6C4; --faint:#6B7E9E;
    --line:#1E2D47; --line2:#2A3C5C; --line3:#172339;
    --accent:#3D8BFF; --accent2:#5EA3FF; --indigo:#3D8BFF;
    --a-50:#15233C; --a-100:#1A2E4E; --a-200:#234071; --a-300:#2E558F;
    --a-400:#3D8BFF; --a-500:#5EA3FF; --a-600:#86BCFF; --a-700:#B4D6FF;
    --data:#3FD0C8; --data-2:#3FE0F0; --data-bg:#10322F;
    --brand-cyan:#3FE0F0; --brand-blue:#5C92F2;
    --brand-grad:linear-gradient(135deg,#5C92F2 0%,#3FE0F0 100%);
    --green:#34C98A; --greenbg:#0F3327; --green-line:#1F6B4E;
    --red:#F0606B; --redbg:#3A1A1E; --red-line:#7A2C32;
    --amber:#E0A93C; --amberbg:#352910; --amber-line:#6E561E;
    --violet:#9B86F0; --violet-bg:#1F1A3A;
    --sh-xs:0 1px 2px rgba(0,0,0,.34);
    --sh:0 1px 1px rgba(0,0,0,.30), 0 2px 8px rgba(0,0,0,.34);
    --sh-md:0 2px 6px rgba(0,0,0,.36), 0 10px 26px rgba(0,0,0,.40);
    --sh-lg:0 4px 10px rgba(0,0,0,.42), 0 22px 50px rgba(0,0,0,.52);
    --shL:0 22px 50px rgba(0,0,0,.55);
    --ring:0 0 0 3px rgba(61,139,255,.30);
    --chart-grid:#1E2D47; --chart-axis:#33486B; --chart-zero:#3C5078;
    --glass:rgba(15,30,56,.66);
    --side-grad:linear-gradient(168deg,#070E1A 0%,#0C1A30 60%,#102542 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;}
  #app{display:flex;height:100vh;overflow:hidden;}
  .tnum{font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-thumb{background:#CAD5E5;border-radius:7px;border:3px solid var(--bg);}

  /* ===== SIDEBAR (navy) ===== */
  aside{width:258px;flex-shrink:0;background:linear-gradient(168deg,#0B2143 0%,#143A77 100%);color:#AEC2DC;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:12px;padding:1.5rem 1.3rem;border-bottom:1px solid rgba(255,255,255,.09);}
  .brand .bar{width:4px;align-self:stretch;border-radius:3px;background:linear-gradient(180deg,#4F9BEF,#7FD0E8);}
  .beye{font-size:8.5px;letter-spacing:2px;color:#7FD0E8;font-weight:800;text-transform:uppercase;margin-bottom:6px;}
  .bt{font-weight:800;font-size:25px;line-height:1.15;color:#FFFFFF;letter-spacing:-.4px;text-shadow:0 1px 4px rgba(0,0,0,.3);}
  .snav{flex:1;overflow-y:auto;padding:1rem .8rem;}
  .sgroup{font-size:8.5px;letter-spacing:1.9px;color:#6F88AE;font-weight:800;text-transform:uppercase;padding:.5rem .65rem .35rem;margin-top:.5rem;}
  .modbtn{display:flex;align-items:center;gap:11px;width:100%;padding:.68rem .7rem;border:1px solid transparent;background:rgba(255,255,255,.035);border-radius:11px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;color:#C4D4E8;transition:all .14s;margin-bottom:6px;text-align:left;}
  .modbtn:hover{background:rgba(255,255,255,.09);color:#fff;}
  .modbtn.on{background:linear-gradient(135deg,rgba(79,155,239,.34),rgba(127,208,232,.16));color:#fff;border-color:rgba(127,176,242,.45);box-shadow:0 5px 16px rgba(8,24,53,.45);}
  .modbtn .mi{width:31px;height:31px;border-radius:9px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#7FB0F2;}
  .modbtn.on .mi{background:rgba(255,255,255,.18);color:#fff;}
  .modbtn .lk{margin-left:auto;font-size:11px;opacity:.5;}
  .tab{display:flex;align-items:center;gap:10px;width:100%;padding:.55rem .7rem;border:none;background:transparent;border-radius:9px;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:600;color:#9DB2CE;transition:all .12s;margin-bottom:2px;border-left:3px solid transparent;text-align:left;}
  .tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .tab.on{background:rgba(79,155,239,.18);color:#fff;border-left:3px solid #5CA6F2;font-weight:700;}
  .tab .num{width:19px;height:19px;border-radius:6px;background:rgba(255,255,255,.09);color:#9DB2CE;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tab.on .num{background:#5CA6F2;color:#fff;}
  .sfoot{padding:.95rem 1.15rem;border-top:1px solid rgba(255,255,255,.09);font-size:9.5px;color:#6F88AE;line-height:1.85;}
  .sfoot b{color:#AEC2DC;font-weight:700;}
  .tbar{width:4px;height:34px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));flex-shrink:0;}

  /* ===== TOPBAR ===== */
  .topbar{height:62px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 1.6rem;box-shadow:var(--sh);z-index:5;}
  .crumb{font-size:9px;letter-spacing:1.4px;color:var(--indigo);font-weight:800;text-transform:uppercase;margin-bottom:4px;}
  .ptitle{font-weight:800;font-size:17px;letter-spacing:-.3px;line-height:1;color:var(--navy);}
  .spacer{flex:1;}
  .hstats{display:flex;align-items:center;gap:18px;}
  .hstat .l{font-size:8px;letter-spacing:1.1px;color:var(--faint);font-weight:700;text-transform:uppercase;}
  .hstat .v{font-size:14px;font-weight:800;line-height:1.2;}
  .hsep{width:1px;height:30px;background:var(--line);}

  /* ===== CONTENT ===== */
  .mainwrap{flex:1;display:flex;flex-direction:column;min-width:0;}
  #main{flex:1;overflow-y:auto;padding:1.4rem 1.5rem;}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .grid{display:grid;gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
  /* ===== refinamiento profesional ===== */
  .card{transition:box-shadow .2s ease,border-color .2s ease;}
  .card:hover{box-shadow:0 1px 2px rgba(20,30,54,.05),0 14px 34px rgba(20,30,54,.11);border-color:var(--line2);}
  .ct{font-weight:800;font-size:14px;}
  .cs{font-size:11.5px;}
  .tile{transition:transform .15s ease,box-shadow .15s ease;}
  .tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,30,54,.13);}
  .pbtn{transition:all .14s ease;}
  .altchip{transition:transform .12s ease;} .altchip:hover{transform:translateY(-1px);}
  .wbtn{transition:background .12s ease,color .12s ease;}
  .btn{transition:transform .13s ease,box-shadow .13s ease,background .13s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-pri{box-shadow:0 2px 9px rgba(30,95,209,.28);}
  .btn-pri:hover{box-shadow:0 5px 16px rgba(30,95,209,.34);}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,209,.16);}
  .tw table tbody tr{transition:background .1s ease;} .tw table tbody tr:hover{background:var(--soft);}
  .tile .tv,.kv{letter-spacing:-.3px;}
  .cs{line-height:1.4;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--muted);font-weight:600;align-items:center;}
  .legend .lgdot{box-shadow:0 0 0 2px #fff,0 1px 2px rgba(20,30,54,.18);}
  .chart{max-width:940px;}
  .heat .cell{border-radius:7px;transition:transform .1s ease;} .heat .cell:hover{transform:scale(1.08);}
  .altm{transition:background .12s ease;}
  svg text{font-family:var(--font);}
  .card>.hd{padding:1rem 1.3rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .card .ct{font-weight:800;font-size:15px;color:var(--navy);letter-spacing:-.2px;}
  .card .cs{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .card .bd{padding:1.2rem 1.3rem;}
  .card .bd.flush{padding:0;}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .lgdot{width:9px;height:9px;border-radius:3px;}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.95rem 1.05rem .95rem 1.15rem;position:relative;overflow:hidden;box-shadow:var(--sh);}
  .tile .edge{position:absolute;left:0;top:0;bottom:0;width:3px;}
  .tile .l{font-size:9.5px;letter-spacing:.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:7px;line-height:1.3;}
  .tile .v{font-size:1.4rem;font-weight:800;line-height:1.08;letter-spacing:-.4px;}
  .tile .s{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.35;}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{padding:.7rem .9rem;text-align:left;font-size:9.5px;letter-spacing:.6px;color:var(--muted);font-weight:700;
           text-transform:uppercase;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--soft);}
  tbody td{padding:.72rem .9rem;border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--soft);}
  .tw{overflow-x:auto;}
  .chip{border-radius:6px;padding:.16rem .5rem;font-size:11px;font-weight:700;display:inline-block;}
  .badge{border-radius:6px;padding:.12rem .5rem;font-size:10px;font-weight:600;display:inline-block;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .tk{display:flex;align-items:center;gap:8px;font-weight:700;}

  /* selector */
  .sel{display:flex;gap:8px;flex-wrap:wrap;}
  .selb{display:flex;align-items:center;gap:7px;padding:.5rem .85rem;border-radius:10px;border:1px solid var(--line2);
        background:var(--card);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700;color:var(--muted);box-shadow:var(--sh);transition:all .12s;}
  .selb:hover{border-color:var(--indigo);color:var(--ink);}
  .selb.on{color:#fff;border-color:transparent;}

  /* heatmap */
  .heat{border-collapse:separate;border-spacing:4px;width:auto;}
  .heat .cell{width:62px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;}
  .heat .hh{font-size:10px;font-weight:800;text-align:center;padding:3px;}
  .heat .rh{font-size:10px;font-weight:800;text-align:right;padding-right:9px;white-space:nowrap;}

  /* svg chart */
  .chart{width:100%;height:auto;display:block;max-width:880px;margin:0 auto;}
  .chart text{font-family:var(--font);}

  /* locked */
  .locked{background:linear-gradient(180deg,#fff,var(--soft));border:1.5px dashed var(--line2);border-radius:var(--r);
          padding:3.2rem 2rem;text-align:center;box-shadow:var(--sh);}
  .lbadge{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,var(--indigo),var(--accent2));
          display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 26px rgba(79,70,229,.32);}
  .tag{display:inline-block;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:.25rem .6rem;font-size:10.5px;font-weight:600;color:var(--muted);}
  .note{font-size:12px;color:var(--muted);line-height:1.6;}
  .footer{flex-shrink:0;border-top:1px solid var(--line);padding:.5rem 1.6rem;display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);background:var(--card);letter-spacing:.3px;}
  /* market tiles + refinamientos */
  .mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .mstat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:.8rem .95rem;box-shadow:var(--sh);position:relative;overflow:hidden;}
  .mstat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
  .ml{font-size:9.5px;letter-spacing:1.1px;color:var(--faint);font-weight:800;text-transform:uppercase;}
  .mv{font-size:1.5rem;font-weight:800;line-height:1.05;margin-top:6px;letter-spacing:-.5px;}
  .ms{font-size:10.5px;color:var(--muted);margin-top:6px;}
  .card>.hd{background:linear-gradient(180deg,#fff,var(--soft));}
  @media(max-width:820px){.mstats{grid-template-columns:1fr;}}
  /* simulación + subtabs + título */
  .subtabs{margin:1px 0 10px 15px;padding-left:11px;border-left:1px solid rgba(255,255,255,.13);display:flex;flex-direction:column;}
  .btn{padding:.5rem .9rem;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--indigo);font-weight:700;font-size:12px;cursor:pointer;box-shadow:var(--sh);font-family:var(--font);}
  .btn:hover{background:var(--soft2);}
  .simhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .simamt .l{font-size:9px;letter-spacing:1px;color:var(--faint);font-weight:800;text-transform:uppercase;display:block;margin-bottom:6px;}
  .amtwrap{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:.45rem .8rem;background:var(--soft);}
  .amtwrap input{border:none;background:transparent;font-family:var(--font);font-size:17px;font-weight:800;color:var(--ink);width:150px;outline:none;}
  .amtwrap>span{color:var(--muted);font-weight:800;}
  .simlist{display:flex;flex-direction:column;gap:7px;}
  .simrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;padding:.55rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--soft);}
  .simrow.on{background:#fff;border-color:var(--line2);box-shadow:var(--sh);}
  .simchk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;}
  .simchk input{width:16px;height:16px;accent-color:var(--indigo);cursor:pointer;}
  .simsec{font-size:10px;color:var(--faint);font-weight:600;}
  .simw{display:flex;align-items:center;gap:5px;min-width:90px;justify-content:flex-end;}
  .winp{width:64px;border:1px solid var(--line2);border-radius:8px;padding:.35rem .5rem;font-family:var(--font);font-size:13px;font-weight:800;text-align:right;color:var(--ink);outline:none;}
  .winp:focus{border-color:var(--indigo);}
  .simw>span{color:var(--muted);font-weight:700;font-size:12px;}
  .simoff{color:var(--faint);font-size:11px;}
  .simb{font-size:11px;color:var(--muted);font-weight:600;min-width:130px;text-align:right;}
  .simsum{margin-top:13px;font-size:12.5px;color:var(--muted);}
  .simwarn{color:var(--amber);font-size:11px;font-weight:600;}
  .genrow{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;}
  .genl{font-size:10px;letter-spacing:.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:8px;line-height:1.3;}
  .pbtns{display:flex;gap:6px;}
  .pbtn,.nbtn{padding:.48rem .85rem;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font);}
  .nbtn{padding:.48rem .75rem;min-width:38px;}
  .pbtn:hover,.nbtn:hover{border-color:var(--indigo);color:var(--ink);}
  .pbtn.on,.nbtn.on{background:var(--indigo);color:#fff;border-color:transparent;}
  .btn-pri{background:var(--indigo);color:#fff;border-color:transparent;}
  .btn-pri:hover{background:#1A52B8;}
  .genhint{margin-top:13px;font-size:11.5px;color:var(--muted);}
  .altchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px;}
  .altchip{border:1px solid;border-radius:7px;padding:.22rem .6rem;font-size:11px;font-weight:800;background:#fff;}
  .altmets{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;}
  .altm{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.72rem .55rem;text-align:center;}
  .altml{font-size:10px;letter-spacing:.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:6px;}
  .altmv{font-size:1.42rem;font-weight:800;color:var(--ink);line-height:1.05;letter-spacing:-.3px;}
  .charttip{position:fixed;z-index:200;background:#fff;border:1px solid var(--line2);border-radius:9px;padding:.5rem .75rem;font-size:13.5px;font-weight:800;color:var(--ink);box-shadow:var(--shL);pointer-events:none;display:none;line-height:1.45;}
  .charttip b{display:block;color:var(--faint);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
  #projsvg{cursor:crosshair;}
  .projctrl{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:15px;}
  .ttr{display:block;color:var(--muted);font-weight:600;font-size:10.5px;margin-top:3px;}
  .pinp{width:118px;border:1px solid var(--line2);border-radius:8px;padding:.4rem .6rem;font-family:var(--font);font-size:13px;font-weight:700;text-align:right;color:var(--ink);outline:none;}
  .pinp:focus{border-color:var(--indigo);}
  input[type=date]{border:1px solid var(--line2);border-radius:9px;padding:.45rem .7rem;font-family:var(--font);font-size:13px;color:var(--ink);outline:none;}
  #wipsa{border:none;background:transparent;font-family:var(--font);font-size:15px;font-weight:800;color:var(--ink);outline:none;}
  .wbtn{border:1px solid var(--line2);background:#fff;border-radius:6px;width:25px;height:25px;cursor:pointer;font-size:12px;color:var(--muted);line-height:1;}
  .wbtn:hover{border-color:var(--indigo);color:var(--indigo);}
  .wbtn.del:hover{border-color:var(--red);color:var(--red);}

  /* ════════════════ INVERSOR 2.0 · SISTEMA DE DISEÑO ════════════════ */
  body{background:var(--bg);color:var(--ink);
    font-feature-settings:"cv05" 1,"ss01" 1,"zero" 1;text-rendering:optimizeLegibility;}
  .tnum,table td,table th,.tile .v,.kv,.hstat .v,.metric-hero,.amtwrap input,.winp,.pinp{
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 1;}
  .mono{font-family:var(--mono);letter-spacing:-.2px;}

  /* ── Sidebar ── */
  aside{background:var(--side-grad);border-right:1px solid rgba(255,255,255,.06);
    box-shadow:inset -1px 0 0 rgba(0,0,0,.25);}
  .brand{display:flex;align-items:center;gap:12px;padding:1.35rem 1.2rem;
    border-bottom:1px solid rgba(255,255,255,.08);}
  .brand-mark{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(127,176,242,.22);border-radius:12px;flex-shrink:0;}
  .logomark{color:#fff;}
  .beye{font-size:8px;letter-spacing:1.9px;color:var(--brand-cyan);font-weight:800;text-transform:uppercase;margin-bottom:5px;}
  .bt{font:800 22px var(--font);line-height:1.05;color:#FFFFFF;letter-spacing:-.5px;display:flex;align-items:center;}
  .wm-dot{width:6px;height:6px;border-radius:50%;margin-left:5px;align-self:flex-end;margin-bottom:3px;
    background:var(--brand-grad);box-shadow:0 0 0 3px rgba(34,211,238,.18);}
  .modbtn{background:transparent;border:1px solid transparent;padding:.64rem .68rem;
    transition:background .16s var(--ease),color .16s,box-shadow .16s,transform .12s;}
  .modbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .modbtn:active{transform:translateY(.5px);}
  .modbtn.on{position:relative;color:#fff;
    background:linear-gradient(135deg,rgba(61,139,255,.30),rgba(34,211,238,.12));
    border-color:rgba(120,170,246,.40);
    box-shadow:0 6px 18px rgba(6,18,40,.5),inset 0 0 0 1px rgba(255,255,255,.04);}
  .modbtn.on::before{content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:3px;background:var(--brand-grad);box-shadow:0 0 10px rgba(34,211,238,.5);}
  .modbtn .mi{transition:background .16s,color .16s;}
  .modbtn.on .mi{background:rgba(34,211,238,.20);color:#9CF0E8;}
  .tab.on{background:rgba(61,139,255,.16);color:#fff;border-left:2px solid var(--brand-cyan);font-weight:700;}
  .tab.on .num{background:var(--brand-grad);color:#06231F;}

  /* ── Topbar (glass + live-dot + theme toggle) ── */
  .topbar{height:60px;background:var(--glass);
    -webkit-backdrop-filter:saturate(150%) blur(12px);backdrop-filter:saturate(150%) blur(12px);
    border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(14,28,54,.03),var(--sh-xs);}
  .tbar{width:3px;height:32px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--brand-cyan));}
  .crumb{color:var(--accent);}
  .ptitle{color:var(--navy);}
  .hstat .v.up{color:var(--green);} .hstat .v.down{color:var(--red);}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);position:relative;display:inline-block;}
  .live-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--green);
    opacity:.4;animation:livePulse 1.8s var(--ease-out) infinite;}
  @keyframes livePulse{0%{transform:scale(1);opacity:.45;}70%,100%{transform:scale(2.4);opacity:0;}}
  .mkpill{display:flex;align-items:center;gap:7px;padding:.32rem .65rem;border-radius:var(--r-pill);
    background:var(--card2);border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--muted);}
  .iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.15s var(--ease);box-shadow:var(--sh-xs);}
  .iconbtn:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px);}
  .iconbtn:active{transform:translateY(0);}

  /* ── Cards ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
    transition:box-shadow .2s var(--ease),border-color .2s ease;}
  .card:hover{box-shadow:var(--sh-md);border-color:var(--line2);}
  .card.feature{position:relative;}
  .card.feature::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--brand-grad);opacity:.9;z-index:1;}
  .card>.hd{padding:.95rem 1.25rem;background:linear-gradient(180deg,var(--card2),var(--card));border-bottom:1px solid var(--line);}
  .card .ct{font:800 15px var(--font);color:var(--navy);letter-spacing:-.2px;}
  .card .cs{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .card.term{background:var(--surface);} .card.term>.hd{background:var(--surface);}

  /* ── KPI Tiles ── */
  .tile{border-radius:12px;box-shadow:var(--sh-xs);background:var(--card);border:1px solid var(--line);
    transition:transform .16s var(--ease),box-shadow .16s ease,border-color .16s ease;position:relative;overflow:hidden;}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--line2);}
  .tile .edge{border-radius:0 3px 3px 0;}
  .tile.pos .edge{background:linear-gradient(180deg,var(--green),#0A6E49);}
  .tile.neg .edge{background:linear-gradient(180deg,var(--red),#B42727);}
  .tile.neu .edge,.tile.info .edge{background:var(--brand-grad);}
  .tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    background:radial-gradient(circle,rgba(46,111,224,.06),transparent 70%);opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .tile:hover::after{opacity:1;}

  /* ── Badges / Chips / dots ── */
  .chip{border-radius:var(--r-xs);padding:.16rem .5rem;font:700 11px var(--font);
    display:inline-flex;align-items:center;gap:5px;line-height:1.4;border:1px solid transparent;}
  .badge{border-radius:var(--r-xs);padding:.14rem .5rem;font:700 10px var(--font);letter-spacing:.2px;
    display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;}
  .badge.pos,.chip.pos{color:var(--green);background:var(--greenbg);border-color:var(--green-line);}
  .badge.neg,.chip.neg{color:var(--red);background:var(--redbg);border-color:var(--red-line);}
  .badge.warn,.chip.warn{color:var(--amber);background:var(--amberbg);border-color:var(--amber-line);}
  .badge.neu,.chip.neu{color:var(--data);background:var(--data-bg);border-color:transparent;}
  .badge.info,.chip.info{color:var(--a-600);background:var(--a-50);border-color:var(--a-100);}
  .badge.vio,.chip.vio{color:var(--violet);background:var(--violet-bg);border-color:transparent;}
  .lgdot{box-shadow:0 0 0 2px var(--card),0 1px 2px rgba(14,28,54,.18);}

  /* ── Tablas (terminal-grade) ── */
  .tw{overflow:auto;border-radius:var(--r-sm);}
  table{border-collapse:separate;border-spacing:0;}
  thead th{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--muted);
    border-bottom:1px solid var(--line2);box-shadow:0 1px 0 var(--line2);}
  thead th.num,tbody td.num{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td{border-bottom:1px solid var(--line);color:var(--ink);}
  tbody tr:nth-child(even) td{background:var(--line3);}
  tbody tr{transition:background .1s ease;}
  tbody tr:hover td{background:var(--soft2);}
  tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--accent);}
  tbody tr:last-child td{border-bottom:none;}
  td.pos{color:var(--green);font-weight:700;} td.neg{color:var(--red);font-weight:700;}

  /* ── Inputs ── */
  input,select,textarea{background:var(--card2);color:var(--ink);border:1px solid var(--line2);
    border-radius:var(--r-sm);transition:border-color .14s,box-shadow .14s,background .14s;}
  input::placeholder,textarea::placeholder{color:var(--faint);}
  input:hover,select:hover{border-color:var(--a-200);}
  input:focus,select:focus,textarea:focus,.winp:focus,.pinp:focus{
    background:var(--card);border-color:var(--accent);box-shadow:var(--ring);outline:none;}
  .amtwrap{background:var(--card2);border:1px solid var(--line2);transition:border-color .15s,box-shadow .15s,background .15s;}
  .amtwrap:focus-within{border-color:var(--accent);box-shadow:var(--ring);background:var(--card);}
  .amtwrap input{border:none;background:transparent;box-shadow:none;}
  .amtwrap input:focus{box-shadow:none;}

  /* ── Botones ── */
  .btn{border-radius:var(--r-sm);font:700 12.5px var(--font);border:1px solid var(--line2);
    background:var(--card);color:var(--accent);box-shadow:var(--sh-xs);display:inline-flex;align-items:center;gap:7px;
    transition:transform .13s var(--ease),box-shadow .13s,background .13s,border-color .13s;}
  .btn:hover{background:var(--soft2);transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.985);}
  .btn-pri{color:#fff;border:none;background:linear-gradient(135deg,var(--a-400),var(--accent));
    box-shadow:0 2px 8px rgba(30,95,209,.32),inset 0 1px 0 rgba(255,255,255,.18);}
  .btn-pri:hover{transform:translateY(-1px);background:linear-gradient(135deg,var(--a-400),var(--accent));
    box-shadow:0 6px 18px rgba(30,95,209,.40),inset 0 1px 0 rgba(255,255,255,.22);}
  .btn-pri:active{transform:translateY(0);box-shadow:0 2px 6px rgba(30,95,209,.30);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none;}
  .btn-ghost:hover{background:var(--soft2);color:var(--ink);transform:none;}
  .selb{background:var(--card);color:var(--muted);border:1px solid var(--line2);box-shadow:var(--sh-xs);transition:.14s;}
  .selb:hover{border-color:var(--a-200);color:var(--ink);}
  .selb.on{color:#fff;border-color:transparent;background:linear-gradient(180deg,var(--a-400),var(--accent));box-shadow:0 2px 9px rgba(30,95,209,.28);}
  .pbtn,.nbtn{background:var(--card);color:var(--muted);border:1px solid var(--line2);transition:.13s var(--ease);}
  .pbtn:hover,.nbtn:hover{border-color:var(--accent);color:var(--ink);}
  .pbtn.on,.nbtn.on{background:linear-gradient(180deg,var(--a-400),var(--accent));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(30,95,209,.26);}

  /* ── Heatmap / charts / tooltip ── */
  .heat .cell{font-variant-numeric:tabular-nums;transition:transform .1s ease,box-shadow .1s ease,filter .1s ease;}
  .heat .cell:hover{transform:scale(1.06);box-shadow:var(--sh-md);filter:brightness(1.05);z-index:2;}
  .charttip{background:var(--card);border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--ink);
    box-shadow:var(--shL);font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .note{color:var(--muted);}
  .locked{background:linear-gradient(180deg,var(--card),var(--surface));border:1.5px dashed var(--line2);}
  .footer{background:var(--card);border-top:1px solid var(--line);color:var(--faint);}
  .tag{background:var(--surface);border:1px solid var(--line);color:var(--muted);}

  /* ── Microinteracciones ── */
  :where(button,a,input,select,[tabindex]):focus-visible{outline:none;box-shadow:var(--ring);}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .wrap>.card,.wrap>.grid,.wrap>.tiles,.wrap>.mf-grid{animation:riseIn .40s var(--ease-out) both;}
  .wrap>*:nth-child(2){animation-delay:.04s;} .wrap>*:nth-child(3){animation-delay:.08s;}
  .wrap>*:nth-child(4){animation-delay:.12s;} .wrap>*:nth-child(5){animation-delay:.15s;}
  ::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint);}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

  /* ════════════════ MULTIFACTOR ════════════════ */
  .mf-grid{display:grid;gap:16px;}
  .mfdisc{display:flex;gap:11px;align-items:flex-start;padding:.85rem 1.1rem;border-radius:var(--r-sm);
    background:var(--amberbg);border:1px solid var(--amber-line);color:var(--amber);font-size:11.5px;line-height:1.5;font-weight:600;}
  .mfdisc b{color:var(--amber);}
  .factbar{display:flex;flex-wrap:wrap;gap:8px;}
  .factchip{display:flex;align-items:center;gap:7px;padding:.4rem .7rem;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);font-size:11px;font-weight:700;color:var(--muted);}
  .factchip .fd{width:9px;height:9px;border-radius:3px;}
  .zc{display:inline-block;min-width:42px;text-align:center;border-radius:var(--r-xs);padding:.14rem .4rem;
    font:800 11.5px var(--font);font-variant-numeric:tabular-nums;}
  .stylebadges{display:flex;flex-wrap:wrap;gap:6px;}
  .radarwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .attrbar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface);}
  .attrseg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;}
  .attrleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:9px;font-size:10.5px;color:var(--muted);font-weight:600;}
  .attrleg span{display:flex;align-items:center;gap:5px;}
  .attrleg i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* ════════════════ PRO / ROADMAP ════════════════ */
  .hero-pro{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:1.7rem 1.8rem;color:#fff;
    background:linear-gradient(125deg,#0A1E3D 0%,#15407F 55%,#1E5FD1 100%);box-shadow:var(--sh-lg);}
  .hero-pro::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,.28),transparent 65%);pointer-events:none;}
  .hero-pro h1{font:800 25px var(--font);letter-spacing:-.5px;margin-bottom:8px;position:relative;}
  .hero-pro p{font-size:13px;opacity:.9;max-width:680px;line-height:1.6;position:relative;}
  .hero-pro .ku{position:relative;display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;}
  .hero-pro .ku .l{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;opacity:.7;font-weight:800;}
  .hero-pro .ku .v{font-size:18px;font-weight:800;margin-top:3px;}
  .diff{display:inline-flex;align-items:center;gap:6px;padding:.2rem .6rem;border-radius:var(--r-pill);font-size:10.5px;font-weight:800;letter-spacing:.3px;}
  .diff.low{background:var(--greenbg);color:var(--green);border:1px solid var(--green-line);}
  .diff.med{background:var(--amberbg);color:var(--amber);border:1px solid var(--amber-line);}
  .diff.high{background:var(--redbg);color:var(--red);border:1px solid var(--red-line);}
  .phase{display:flex;gap:14px;align-items:flex-start;padding:.9rem 0;border-bottom:1px solid var(--line);}
  .phase:last-child{border-bottom:none;}
  .phase .pn{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--brand-grad);color:#06231F;
    font:800 13px var(--font);display:flex;align-items:center;justify-content:center;}
  .phase .pt{font-weight:800;color:var(--navy);font-size:13px;}
  .phase .peta{font-size:10.5px;color:var(--data);font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
  .phase .pd{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .stack{display:grid;gap:9px;}
  /* mock cotizaciones en vivo */
  .qrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;
    padding:.6rem .85rem;border:1px solid var(--line);border-radius:10px;background:var(--card2);}
  .qrow .qt{font-weight:800;color:var(--ink);} .qrow .qn{font-size:10.5px;color:var(--faint);}
  .qrow .qp{font-weight:800;font-variant-numeric:tabular-nums;}
  .delaytag{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--amber);
    background:var(--amberbg);padding:.1rem .4rem;border-radius:var(--r-xs);border:1px solid var(--amber-line);}
  /* mock copiloto IA */
  .chatbox{display:flex;flex-direction:column;gap:11px;max-height:420px;overflow-y:auto;padding:.4rem;}
  .msg{max-width:82%;padding:.7rem .9rem;border-radius:14px;font-size:12.5px;line-height:1.55;}
  .msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--a-400),var(--accent));color:#fff;border-bottom-right-radius:5px;}
  .msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px;}
  .msg.a .who{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--data);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
  .msg.a code{font-family:var(--mono);font-size:11px;background:var(--card2);padding:.05rem .3rem;border-radius:4px;border:1px solid var(--line);}
  .chatin{display:flex;gap:8px;margin-top:12px;}
  .chatin input{flex:1;padding:.6rem .85rem;}
  .toollog{font-family:var(--mono);font-size:10.5px;color:var(--data);background:var(--data-bg);
    border:1px dashed var(--data);border-radius:8px;padding:.4rem .6rem;margin:4px 0;display:inline-block;}
  .codeblk{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:.8rem 1rem;overflow-x:auto;color:var(--ink);line-height:1.6;white-space:pre;}
  .codeblk .cm{color:var(--faint);} .codeblk .kw{color:var(--accent);font-weight:700;} .codeblk .st{color:var(--green);}
  .srcs{font-size:10.5px;color:var(--muted);line-height:1.7;}
  .srcs a{color:var(--accent);text-decoration:none;} .srcs a:hover{text-decoration:underline;}
  .prov{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .provc{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:var(--card2);}
  .provc .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;}
  .provc .pname{font-weight:800;color:var(--navy);font-size:13px;}
  .provc .pmeta{font-size:11px;color:var(--muted);line-height:1.6;}
  .provc .pmeta b{color:var(--ink);}


  /* ════════════════ COPILOTO IA (BYOK) ════════════════ */
  .cp-fab{position:fixed;right:22px;bottom:22px;z-index:300;display:flex;align-items:center;gap:10px;
    padding:.7rem .95rem .7rem .8rem;border-radius:var(--r-pill);border:none;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,#1E5FD1,#22D3EE);box-shadow:0 8px 26px rgba(30,95,209,.42),inset 0 1px 0 rgba(255,255,255,.25);
    font:800 13px var(--font);transition:transform .16s var(--ease),box-shadow .16s;}
  .cp-fab:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(30,95,209,.5);}
  .cp-fab:active{transform:translateY(0);}
  .cp-fab .spark{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;}
  .cp-fab .spark::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#22D3EE;opacity:.35;animation:livePulse 2.2s var(--ease-out) infinite;}
  .cp-fab.hide{display:none;}

  .cp-panel{position:fixed;top:0;right:0;bottom:0;width:436px;max-width:96vw;z-index:320;display:flex;flex-direction:column;
    background:var(--card);border-left:1px solid var(--line2);box-shadow:-18px 0 50px rgba(14,28,54,.20);
    transform:translateX(102%);transition:transform .32s var(--ease-out);}
  .cp-panel.open{transform:translateX(0);}
  :root[data-theme="dark"] .cp-panel{box-shadow:-18px 0 50px rgba(0,0,0,.5);}
  .cp-head{flex-shrink:0;display:flex;align-items:center;gap:11px;padding:.9rem 1rem;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--card2),var(--card));}
  .cp-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1E5FD1,#22D3EE);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(30,95,209,.4);}

  .cp-sel{margin-left:auto;font:700 11px var(--font);color:var(--muted);background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:.32rem .5rem;cursor:pointer;}
  .cp-x{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.14s;}

  .cp-foot{flex-shrink:0;border-top:1px solid var(--line);padding:.75rem .85rem;background:var(--card2);}

  .cp-msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px;}
  .cp-msg.a .who{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--data);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .cp-msg.a strong{color:var(--navy);font-weight:800;} :root[data-theme="dark"] .cp-msg.a strong{color:#fff;}
  .cp-msg.a code{font-family:var(--mono);font-size:11px;background:var(--card2);padding:.03rem .3rem;border-radius:4px;border:1px solid var(--line);color:var(--accent);}

  .cp-setup p{font-size:12px;color:var(--muted);line-height:1.6;}

function corrCard(){
  const N=STOCKS.length;
  const cz=N<=6?56:N<=8?46:N<=10?38:32,ch=Math.round(cz*0.74),fs=N<=8?12:N<=10?10.5:9.5,hf=N<=8?10:9;
  let h='<div class="tw" style="display:flex;justify-content:flex-start"><table class="heat"><tr><td></td>'+STOCKS.map(s=>`<td class="hh" style="color:${s.c};font-size:${hf}px;width:${cz}px">${s.t}</td>`).join("")+'</tr>';
  for(let i=0;i<N;i++){h+=`<tr><td class="rh" style="color:${STOCKS[i].c};font-size:${hf}px">${STOCKS[i].t}</td>`;
    for(let j=0;j<N;j++){const v=CORR[i][j];h+=`<td><div class="cell" style="width:${cz}px;height:${ch}px;font-size:${fs}px;background:${i===j?'#10306A':heat(v)};color:${i===j?'#fff':(Math.abs(v)>0.5?'#fff':ink)}">${v.toFixed(2)}</div></td>`;}
    h+='</tr>';}
  h+='</table></div>';
  const pr=[];for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)pr.push([CORR[i][j],STOCKS[i].t,STOCKS[j].t]);
  pr.sort((a,b)=>a[0]-b[0]);
  h+=`<div class="note" style="margin-top:13px"><b>Diversificación:</b> menor correlación = mejor combinación para reducir riesgo. Mejores pares: ${pr.slice(0,3).map(p=>`<span class="tag">${p[1]} + ${p[2]} = ${p[0].toFixed(2)}</span>`).join(" ")}</div>`;
  return card("Matriz de correlación","Correlación de retornos mensuales · verde = baja (diversifica), rojo = alta",h);
}

function viewCAPM(){
  const bmax=Math.max(...STOCKS.map(s=>s.b))*1.18;
  const yb=niceBounds([RF,...STOCKS.map(s=>s.a24.ret)],0.14);
  const pts=STOCKS.map(s=>({x:s.b,y:s.a24.ret,c:s.c,label:s.t}));
  const line=[{x1:0,y1:RF,x2:bmax,y2:RF+bmax*PRIMA,c:indigo,dash:true}];
  const chart=card("Security Market Line (SML)","Línea = retorno exigido por β · puntos sobre la línea batieron al CAPM (α+)",svgScatter({pts,lines:line,xmin:0,xmax:bmax,ymin:yb.min,ymax:yb.max,xlab:"β (riesgo sistemático)",ylab:"Retorno real anual (%)",fx:v=>v.toFixed(2),fy:v=>v.toFixed(0)+"%",h:330}));
  const byJ=[...STOCKS].sort((a,b)=>b.a24.jensen-a.a24.jensen);
  const rows=byJ.map(s=>{const a=s.a24;const sg=a.jensen>1?"SUBVALORADA":a.jensen<-1?"SOBREVALORADA":"EQUILIBRIO",sc=a.jensen>1?green:a.jensen<-1?red:muted;
    return `<tr><td>${tk(s)}</td><td class="tnum" style="color:${accentT};font-weight:700">${s.b.toFixed(2)}</td>
    <td class="tnum" style="color:${indigo};font-weight:600">${p0(a.er)}</td><td>${chip(a.ret)}</td><td>${chip(a.jensen)}</td><td>${badge(sg,sc)}</td></tr>`;}).join("");
  const tbl=card("Valoración CAPM","E(R) exigido = Rf + β × prima · α de Jensen = retorno real − exigido",{html:`<div class="tw"><table><thead><tr>${["Acción","β","E(R) CAPM","Retorno real","α Jensen","Señal"].map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`,flush:true});
  const note=notecard(`La <b>SML</b> muestra el retorno que el CAPM exige según el β (Rf ${p0(RF)}, prima ${p0(PRIMA)}). Un punto <b>sobre</b> la línea rindió más de lo exigido por su riesgo sistemático (α positivo); <b>bajo</b>, menos. Ojo: la ventana fue un mercado muy alcista, por eso varios retornos reales superan ampliamente lo exigido.`);
  return chart+tbl+note;
}

function scaleAll100(){const k=Object.keys(simState.sel);if(!k.length)return;const s=k.reduce((a,x)=>a+(+simState.sel[x]||0),0)||1;k.forEach(x=>simState.sel[x]=+((+simState.sel[x]||0)*100/s).toFixed(1));fix100();}
function forceWeight(t,v){v=Math.max(0,Math.min(100,v));const others=Object.keys(simState.sel).filter(k=>k!==t);const os=others.reduce((a,k)=>a+(+simState.sel[k]||0),0);const rem=100-v;simState.sel[t]=+v.toFixed(1);if(others.length){if(os>0)others.forEach(k=>simState.sel[k]=+((+simState.sel[k]||0)*rem/os).toFixed(1));else others.forEach(k=>simState.sel[k]=+(rem/others.length).toFixed(1));}fix100();}
function propose(){const n=simState.nstocks,p=simState.profile;let pool=[...STOCKS],chosen,w;
  if(p==="conservador"){chosen=pool.sort((a,b)=>a.a24.sig-b.a24.sig).slice(0,n);const inv=chosen.map(s=>1/s.a24.sig);const t=inv.reduce((a,b)=>a+b,0);w=inv.map(x=>x/t*100);}
  else if(p==="riesgoso"){chosen=pool.sort((a,b)=>b.a24.ret-a.a24.ret).slice(0,n);const r=chosen.map(s=>Math.max(3,s.a24.ret));const t=r.reduce((a,b)=>a+b,0);w=r.map(x=>x/t*100);}
  else{chosen=pool.sort((a,b)=>b.a24.sharpe-a.a24.sharpe).slice(0,n);w=chosen.map(()=>100/n);}
  simState.sel={};chosen.forEach((s,i)=>simState.sel[s.t]=+w[i].toFixed(1));fix100();}
function profHint(p){return p==="conservador"?"Conservador: minimiza volatilidad y β (excluye las más agresivas), reparte en más acciones (4–6) con ponderación inversa al riesgo.":p==="riesgoso"?"Riesgoso: prioriza retorno y α de Jensen (tolera β y σ altos), carteras más concentradas (2–4) con más peso a las de mejor rendimiento.":"Moderado: maximiza la relación riesgo-retorno (Sharpe + α), equilibrio en 3–5 acciones con pesos mezcla Sharpe/equiponderado.";}
function simMetrics(){return pMetrics(simState.sel);}
function pMetrics(sel){
  const inc=STOCKS.filter(s=>sel[s.t]!=null);
  const raw=inc.map(s=>Math.max(0,+sel[s.t]||0));const tot=raw.reduce((a,b)=>a+b,0)||1;
  const ws=inc.map((s,i)=>({s,w:raw[i]/tot,pct:raw[i]}));
  const bp=ws.reduce((a,x)=>a+x.w*x.s.b,0);
  const erCapm=RF+bp*PRIMA;
  const erM=(Math.pow(1+erCapm/100,1/12)-1)*100, erW=(Math.pow(1+erCapm/100,1/52)-1)*100;
  const retH=ws.reduce((a,x)=>a+x.w*x.s.a24.ret,0);
  let varp=0;ws.forEach(xi=>ws.forEach(xj=>{const i=TICK.indexOf(xi.s.t),j=TICK.indexOf(xj.s.t);varp+=xi.w*xj.w*xi.s.a24.sig*xj.s.a24.sig*CORR[i][j];}));
  const sig=Math.sqrt(Math.max(0,varp));const wavgSig=ws.reduce((a,x)=>a+x.w*x.s.a24.sig,0);
  const sharpe=sig>0?(retH-RF)/sig:0;
  const port=DATA.labels.map((_,k)=>ws.reduce((a,x)=>a+x.w*x.s.rets[k],0));
  const mr=MKT.rets,mp=port.reduce((a,b)=>a+b,0)/port.length,mm=mr.reduce((a,b)=>a+b,0)/mr.length;
  let cpm=0,vpp=0,vmm=0;for(let k=0;k<port.length;k++){cpm+=(port[k]-mp)*(mr[k]-mm);vpp+=(port[k]-mp)**2;vmm+=(mr[k]-mm)**2;}
  const corrI=(vpp>0&&vmm>0)?cpm/Math.sqrt(vpp*vmm):0;
  let cs=0,cc=0;for(let a=0;a<ws.length;a++)for(let b2=a+1;b2<ws.length;b2++){cs+=CORR[TICK.indexOf(ws[a].s.t)][TICK.indexOf(ws[b2].s.t)];cc++;}
  const corrAvg=cc>0?cs/cc:0;
  return {ws,bp,erCapm,erM,erW,retH,sig,wavgSig,sharpe,corrI,corrAvg};
}
function saveScenario(){
  const M=simMetrics();

  const def="Escenario "+(SCEN.length+1);
  const name=window.prompt("Nombre del escenario:",def);
  if(name===null)return;
  const nm=(name||def).trim()||def;
  const comp=M.ws.map(x=>({t:x.s.t,w:+(x.w*100).toFixed(1),c:x.s.c}));
  SCEN.push({id:Date.now(),name:nm,amount:simState.amount,sel:Object.assign({},simState.sel),
    m:{bp:M.bp,erCapm:M.erCapm,retH:M.retH,sig:M.sig,sharpe:M.sharpe,corrAvg:M.corrAvg},comp});
  lsSet("pf_scenarios_v1",SCEN);

}
function updateScenario(){
  const M=simMetrics();
  if(!M.ws.length){window.alert("Selecciona al menos una acción.");return;}
  const sc=SCEN.find(s=>s.id===scenEditId);
  if(!sc){scenEditId=null;return saveScenario();}
  sc.sel=Object.assign({},simState.sel);sc.amount=simState.amount;
  sc.m={bp:M.bp,erCapm:M.erCapm,retH:M.retH,sig:M.sig,sharpe:M.sharpe,corrAvg:M.corrAvg};

function attachMultiHover(id){

function corrCardSim(M){
  const ws=M.ws,N=ws.length;if(N<2)return "";
  const idx=ws.map(x=>TICK.indexOf(x.s.t));
  const cz=N<=4?70:N<=6?58:N<=8?48:40,ch=Math.round(cz*0.74),fs=N<=6?13:N<=8?11.5:10,hf=N<=8?11:9.5;
  let h='<div class="tw" style="display:flex;justify-content:flex-start"><table class="heat"><tr><td></td>'+ws.map(x=>`<td class="hh" style="color:${x.s.c};font-size:${hf}px;width:${cz}px">${x.s.t}</td>`).join("")+'</tr>';
  for(let i=0;i<N;i++){h+=`<tr><td class="rh" style="color:${ws[i].s.c};font-size:${hf}px">${ws[i].s.t}</td>`;
    for(let j=0;j<N;j++){const v=CORR[idx[i]][idx[j]];h+=`<td><div class="cell" style="width:${cz}px;height:${ch}px;font-size:${fs}px;background:${i===j?'#10306A':heat(v)};color:${i===j?'#fff':(Math.abs(v)>0.5?'#fff':ink)}">${v.toFixed(2)}</div></td>`;}
    h+='</tr>';}
  h+='</table></div>';
  const pr=[];for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)pr.push([CORR[idx[i]][idx[j]],ws[i].s.t,ws[j].s.t]);
  pr.sort((a,b)=>a[0]-b[0]);const hi=pr[pr.length-1];
  h+=`<div class="note" style="margin-top:13px"><b>Correlación media de la cartera: ${M.corrAvg.toFixed(2)}.</b> Menor = mejor diversificación. Par más diversificador: <span class="tag">${pr[0][1]} + ${pr[0][2]} = ${pr[0][0].toFixed(2)}</span> · par más correlacionado: <span class="tag">${hi[1]} + ${hi[2]} = ${hi[0].toFixed(2)}</span></div>`;
  return card("Matriz de correlación del portafolio","Correlación de retornos mensuales entre tus acciones · verde = baja (diversifica), rojo = alta",h);
}

function efficientStocks(){return STOCKS.filter(s=>s.a24.jensen>=0);}
function zscores(a){const m=a.reduce((x,y)=>x+y,0)/a.length;const sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)||1;return a.map(x=>(x-m)/sd);}
function scoreStocks(list,profile){
  const zr=zscores(list.map(s=>s.a24.ret)),zs=zscores(list.map(s=>s.a24.sig)),zh=zscores(list.map(s=>s.a24.sharpe)),zj=zscores(list.map(s=>s.a24.jensen)),zb=zscores(list.map(s=>s.b));
  return list.map((s,i)=>{let sc;
    if(profile==="conservador")sc=-0.9*zs[i]-0.5*zb[i]+0.45*zh[i]+0.2*zj[i];
    else if(profile==="riesgoso")sc=0.8*zr[i]+0.55*zj[i]+0.35*zb[i]-0.1*zs[i];
    else sc=1.0*zh[i]+0.4*zj[i]-0.2*zs[i]-0.1*Math.abs(zb[i]);
    return {s,sc};});
}
function pickBySector(scored,N,mx){
  const out=[],cnt={};
  for(const o of scored){const k=o.s.s;if((cnt[k]||0)>=mx)continue;out.push(o.s);cnt[k]=(cnt[k]||0)+1;if(out.length>=N)break;}
  if(out.length<N){for(const o of scored){if(out.indexOf(o.s)>=0)continue;out.push(o.s);if(out.length>=N)break;}}
  return out;
}
function altWeights(list,profile){
  let w;const n=list.length;
  if(profile==="conservador"){const inv=list.map(s=>1/Math.max(1,s.a24.sig));const t=inv.reduce((a,b)=>a+b,0);w=inv.map(x=>x/t*100);}
  else if(profile==="riesgoso"){const r=list.map(s=>Math.max(2,s.a24.ret));const t=r.reduce((a,b)=>a+b,0);w=r.map(x=>x/t*100);}
  else{const sh=list.map(s=>Math.max(0.1,s.a24.sharpe));const t=sh.reduce((a,b)=>a+b,0);const eq=100/n;w=sh.map(x=>0.55*(x/t*100)+0.45*eq);}
  const cap=profile==="riesgoso"?50:profile==="conservador"?32:40;
  for(let it=0;it<4;it++){let ex=0,room=0;w=w.map(x=>{if(x>cap){ex+=x-cap;return cap;}return x;});w.forEach(x=>{if(x<cap)room+=cap-x;});if(ex<=0.01||room<=0)break;w=w.map(x=>x<cap?x+ex*((cap-x)/room):x);}
  const tot=w.reduce((a,b)=>a+b,0);w=w.map(x=>x/tot*100);
  const sel={};list.forEach((s,i)=>sel[s.t]=+w[i].toFixed(1));
  const k=Object.keys(sel);if(k.length){let s2=k.reduce((a,x)=>a+sel[x],0);sel[k[0]]=+(sel[k[0]]+(100-s2)).toFixed(1);}

function genAlternatives(profile){

  const wlbl=profile==="conservador"?"ponderación inversa a la volatilidad":profile==="riesgoso"?"ponderación por retorno":"mezcla Sharpe + equiponderada";
  let sizes=[6,5,4,3,2].filter(k=>k<=scored.length);
  if(!sizes.length)sizes=[scored.length];
  return sizes.map(k=>{const picks=pickBySector(scored,k,2);return {name:names[k]||(k+" acciones"),desc:k+" acciones · máx 2 por sector · "+wlbl,sel:altWeights(picks,profile)};});
}

function applyScenario(id){const sc=SCEN.find(s=>s.id===id);if(!sc)return;simState.sel=Object.assign({},sc.sel);simState.amount=sc.amount;applyInvestment(sc.name);}
function applyInvestment(defName){
  const M=simMetrics();
  if(!M.ws.length){alert("Selecciona acciones y define sus pesos antes de aplicar la inversión.");return;}
  if(!simState.amount||simState.amount<=0){alert("Ingresa el monto a invertir en el Constructor.");return;}
  const nm=window.prompt("Nombre del proyecto de inversión:",defName||("Proyecto "+(PROJECTS.length+1)));
  if(nm===null)return;
  const proj={id:Date.now(),name:(nm||("Proyecto "+(PROJECTS.length+1))).trim(),date:new Date().toLocaleDateString("es-CL"),amount:simState.amount,bp:M.bp,erCapm:M.erCapm,sig:M.sig,sharpe:M.sharpe,corrAvg:M.corrAvg,
      freq:"diario",origSim:{sel:Object.assign({},simState.sel),amount:simState.amount},holdings:M.ws.map(x=>({t:x.s.t,n:x.s.n,s:x.s.s,c:x.s.c,b:x.s.b,w:x.w,monto:simState.amount*x.w})),weeks:[]};
  PROJECTS.push(proj);activeId=proj.id;editIdx=null;saveProjects();syncProj();
  modulo="inv";page="ingreso";render();
}
function periodKey(ds,freq){
  const d=new Date(ds+"T00:00:00");
  if(freq==="mensual")return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(freq==="semanal"){const t=new Date(d);const day=(t.getDay()||7);t.setDate(t.getDate()+4-day);const ys=new Date(t.getFullYear(),0,1);const wk=Math.ceil((((t-ys)/86400000)+1)/7);return t.getFullYear()+"-W"+String(wk).padStart(2,"0");}
  return ds;
}
function resampleWeeks(newFreq){
  if(WEEKS.length<=1)return 0;
  const last={};WEEKS.forEach((w,i)=>{if(i===0)return;last[periodKey(w.date,newFreq)]=i;});
  const keep=new Set([0]);WEEKS.forEach((w,i)=>{if(w.ev)keep.add(i);});
  Object.values(last).forEach(i=>keep.add(i));
  const idx=[...keep].sort((a,b)=>a-b);const removed=WEEKS.length-idx.length;
  const nw=idx.map(i=>WEEKS[i]);WEEKS.length=0;nw.forEach(w=>WEEKS.push(w));
  return removed;
}
function changeFreq(nf){
  const p=curProj();if(!p||p.freq===nf)return;
  const ord={diario:0,semanal:1,mensual:2},coarser=ord[nf]>ord[p.freq];
  const um={semanal:"semana",mensual:"mes",diario:"día"}[nf];
  const msg=coarser?("Cambiar a "+nf.toUpperCase()+" reorganizará tus registros: se conserva el ÚLTIMO registro de cada "+um+" (más los eventos de inyección/rebalanceo) y se eliminan los intermedios. El valor y la rentabilidad se mantienen. ¿Continuar?"):("Cambiar la periodicidad a "+nf.toUpperCase()+". Se conservan todos los registros; solo cambian las etiquetas y la anualización de riesgo. ¿Continuar?");
  if(!window.confirm(msg))return;
  if(coarser){
    if(WEEKS.length>1&&window.confirm("¿Descargar el respaldo Excel con tus datos actuales antes de reorganizar? (Esto es irreversible.)\n\nAceptar = descargar respaldo y luego reorganizar\nCancelar = reorganizar sin respaldo")){exportInvCSV();}
    resampleWeeks(nf);
  }
  p.freq=nf;editIdx=null;saveProjects();render();
}
function buildDemo(cfg){
  const hold=cfg.pick.map(t=>STOCKS.find(s=>s.t===t)).filter(Boolean);
  if(hold.length<2)return null;
  const w=cfg.w.slice(0,hold.length),ws=w.reduce((a,b)=>a+b,0);const wn=w.map(x=>x/ws);
  const holdings=hold.map((s,i)=>({t:s.t,n:s.n,s:s.s,c:s.c,b:s.b,w:wn[i],monto:+(cfg.amount*wn[i]).toFixed(0)}));
  const bp=holdings.reduce((a,hh,i)=>a+hh.w*hold[i].b,0);
  const retH=holdings.reduce((a,hh,i)=>a+hh.w*hold[i].a24.ret,0);
  const sig=holdings.reduce((a,hh,i)=>a+hh.w*hold[i].a24.sig,0);
  const erCapm=RF+bp*PRIMA,sharpe=(retH-RF)/sig,corrAvg=0.4;
  let s=cfg.seed;const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff-0.5;};
  const N=cfg.n,weeks=[],px={};hold.forEach(hh=>px[hh.t]=hh.prices[hh.prices.length-1]);let ipsa=10788.19;
  const stepDays=cfg.freq==="semanal"?7:cfg.freq==="mensual"?30:1;
  const start=new Date();start.setDate(start.getDate()-(N-1)*stepDays);
  for(let i=0;i<N;i++){const d=new Date(start);d.setDate(start.getDate()+i*stepDays);
    const prices={};hold.forEach(hh=>prices[hh.t]=+px[hh.t].toFixed(2));
    weeks.push({date:d.toISOString().slice(0,10),ipsa:+ipsa.toFixed(2),prices});
    const mkt=rnd()*cfg.vol*2+cfg.drift;ipsa*=(1+mkt);hold.forEach(hh=>{px[hh.t]=px[hh.t]*(1+hh.b*mkt+rnd()*cfg.vol);});}
  const oSel={};holdings.forEach(hd=>{oSel[hd.t]=+(hd.w*100).toFixed(1);});
  return {id:Date.now()+Math.floor(Math.random()*100000),name:cfg.name,date:new Date().toLocaleDateString("es-CL"),amount:cfg.amount,bp,erCapm,sig,sharpe,corrAvg,freq:cfg.freq,origSim:{sel:oSel,amount:cfg.amount},holdings,weeks};
}

    {name:"Demo semanal · balanceado",pick:["CHILE","FALABELLA","ENELCHILE","LATAM"],w:[0.3,0.25,0.25,0.2],amount:8000000,freq:"semanal",n:24,seed:50021,drift:0.0035,vol:0.022},
    {name:"Demo mensual · gran capital",pick:["CHILE","BCI","ENELCHILE","SANTANDER","FALABELLA"],w:[0.25,0.2,0.2,0.2,0.15],amount:50000000,freq:"mensual",n:18,seed:71449,drift:0.007,vol:0.028}
  ];

function invMetrics(){
  if(!PF||!WEEKS.length)return null;
  const base=WEEKS[0],sh={},cost={},b0={};PF.holdings.forEach(hd=>{let bp=base.prices[hd.t];if(bp==null){const fw=WEEKS.find(w=>w.prices[hd.t]!=null);bp=fw?fw.prices[hd.t]:0;}b0[hd.t]=bp||1;const inB=base.prices[hd.t]!=null;if(base.qty&&base.qty[hd.t]!=null){sh[hd.t]=base.qty[hd.t];cost[hd.t]=base.qty[hd.t]*(base.prices[hd.t]||b0[hd.t]);}else{sh[hd.t]=inB?hd.monto/base.prices[hd.t]:0;cost[hd.t]=inB?hd.monto:0;}});
  const t0=new Date(base.date).getTime();
  const addD=(WEEKS.length>1&&WEEKS[1].date===WEEKS[0].date)?864e5:0;
  let aport=base.qty?PF.holdings.reduce((a,hd)=>a+(sh[hd.t]||0)*(base.prices[hd.t]||0),0):PF.amount;
  let twr=1,prevVal=null;const series=[],pr=[],mr=[];
  WEEKS.forEach((w,i)=>{
    let inflow=0;

  const sumW=allT.reduce((a,t)=>a+(parseFloat(injState.weights[t])||0),0);

  const injCard=card("Inyectar capital nuevo","Compra de nuevas acciones · sugerencia para mantener los pesos objetivo",injBody);
  return projbar+summary+rebCard+injCard;
}

/* Pesos de factor por perfil (Σ=1) */
const PROFILE_W={
  conservador:{momentum:0.05,lowvol:0.35,value:0.15,quality:0.25,size:0.05,yield:0.15},
  moderado:{momentum:0.20,lowvol:0.15,value:0.20,quality:0.25,size:0.10,yield:0.10},
  riesgoso:{momentum:0.35,lowvol:0.00,value:0.15,quality:0.20,size:0.20,yield:0.00}
};
/* Primas de factor anuales asumidas (modelo tipo APT) */
const LAMBDA={mkt:6.0,momentum:3.0,value:2.5,size:2.0,quality:1.5,lowvol:1.5,yield:1.0};
const MFSTYLE=["momentum","lowvol","value","quality","size","yield"];
const MFLABEL={momentum:"Momentum",lowvol:"Low-Vol",value:"Value",quality:"Quality",size:"Size",yield:"Dividend Yield"};
const MFSHORT={momentum:"Momentum",lowvol:"Low-Vol",value:"Value",quality:"Quality",size:"Size",yield:"Yield"};
const MFCOL={momentum:"#DB2777",lowvol:"#0B8457",value:"#6D54D8",quality:"#0E8F86",size:"#0EA5E9",yield:"#A8700C"};

const FACTORS=[
  {key:"momentum",name:"Momentum (12-1m)",cat:"De precios",desc:"Retorno acumulado de t-12 a t-1 (salta el último mes). Lo que viene subiendo tiende a seguir (Carhart UMD)."},
  {key:"lowvol",name:"Low-Volatility",cat:"De retornos",desc:"Menor volatilidad anual → mejor retorno ajustado por riesgo (anomalía BAB / AQR)."},
  {key:"value",name:"Value (HML)",cat:"Fundamental",desc:"Barata por libros y utilidad (P/B y P/E bajos). Value supera a growth en el largo plazo."},
  {key:"quality",name:"Quality (QMJ)",cat:"Fundamental",desc:"Rentable (ROE, margen), poco apalancada y con crecimiento. Calidad sobre basura."},
  {key:"size",name:"Size (SMB)",cat:"Fundamental",desc:"Menor capitalización → premio small-cap por mayor riesgo/iliquidez."},
  {key:"yield",name:"Dividend Yield",cat:"Fundamental",desc:"Mayor rendimiento por dividendo: carry/income y disciplina de caja."}
];

function clampz(z,c){c=c||2.5;return Math.max(-c,Math.min(c,z));}
function computeFactors(list){
  const raw={mom:[],sig:[],idio:[],lnmc:[],pb:[],pe:[],roe:[],nm:[],de:[],eg:[],dy:[]};
  list.forEach(s=>{
    const f=FUND[s.t]||{},p=s.prices,n=p.length;
    const mom=(n>=14)?(p[n-2]/p[n-14]-1)*100:(p[n-1]/p[0]-1)*100;
    raw.mom.push(mom);
    raw.sig.push(s.a24.sig);
    raw.idio.push(s.a24.sig*Math.sqrt(Math.max(0,1-s.a24.r2)));
    raw.lnmc.push(Math.log(f.mcap||1000));
    raw.pb.push(f.pb||1); raw.pe.push(f.pe||12);
    raw.roe.push(f.roe||8); raw.nm.push(f.nm||5);
    raw.de.push((f.de||0)/(1+(f.de||0))); raw.eg.push(f.eg||0); raw.dy.push(f.dy||0);
  });
  const Z={};Object.keys(raw).forEach(k=>Z[k]=zscores(raw[k]));
  const z={},er={},comp={},attrib={},raws={};
  list.forEach((s,i)=>{
    const zf={
      momentum:clampz(Z.mom[i]),
      lowvol:clampz(-Z.sig[i]),
      specific:clampz(-Z.idio[i]),
      market:s.b,
      size:clampz(-Z.lnmc[i]),
      value:clampz(0.6*(-Z.pb[i])+0.4*(-Z.pe[i])),
      quality:clampz(0.40*Z.roe[i]+0.25*Z.nm[i]+0.20*(-Z.de[i])+0.15*Z.eg[i]),
      yield:clampz(Z.dy[i])
    };
    z[s.t]=zf;
    comp[s.t]=MFSTYLE.reduce((a,k)=>a+zf[k],0)/MFSTYLE.length;
    const base=RF+s.b*PRIMA;
    const tilt={momentum:zf.momentum*LAMBDA.momentum,value:zf.value*LAMBDA.value,size:zf.size*LAMBDA.size,
                quality:zf.quality*LAMBDA.quality,lowvol:zf.lowvol*LAMBDA.lowvol,yield:zf.yield*LAMBDA.yield};
    const tsum=MFSTYLE.reduce((a,k)=>a+tilt[k],0);
    er[s.t]=base+tsum;
    attrib[s.t]={rf:RF,market:s.b*PRIMA,base,tilt,total:base+tsum};
    raws[s.t]={mom:raw.mom[i],idio:raw.idio[i]};
  });
  return {z,er,comp,attrib,raws};
}
const MF=computeFactors(STOCKS);

function compositeOf(t,prof){
  if(prof==="equal")return MF.comp[t];
  const w=PROFILE_W[prof];return Object.keys(w).reduce((a,k)=>a+w[k]*MF.z[t][k],0);
}
function zcell(z){
  const v=clampz(z);let bg,fg;
  if(v>=0.05){const a=0.12+0.5*Math.min(1,v/2.5);bg=`rgba(11,132,87,${a.toFixed(2)})`;fg=v>1.2?"#fff":"var(--green)";}
  else if(v<=-0.05){const a=0.12+0.5*Math.min(1,-v/2.5);bg=`rgba(206,47,59,${a.toFixed(2)})`;fg=v<-1.2?"#fff":"var(--red)";}
  else{bg="var(--surface)";fg="var(--muted)";}
  return `<span class="zc" style="background:${bg};color:${fg}">${(z>=0?"+":"")+z.toFixed(2)}</span>`;
}
function styleBadges(t){
  const z=MF.z[t],s=stk(t),out=[];
  if(z.value>0.5)out.push(["Value","#6D54D8"]);else if(z.value<-0.5)out.push(["Growth","#D9730D"]);else out.push(["Blend","#566A8C"]);
  if(s.b<0.85&&z.lowvol>0)out.push(["Defensiva","#0B8457"]);else if(s.b>1.1)out.push(["Agresiva","#CE2F3B"]);
  if(z.quality>0.5)out.push(["Alta calidad","#0E8F86"]);else if(z.quality<-0.5)out.push(["Baja calidad","#A8700C"]);
  if(z.yield>0.6)out.push(["Alto dividendo","#1E5FD1"]);
  if(z.momentum>0.7)out.push(["Momentum","#DB2777"]);
  return out.map(b=>badge(b[0],b[1])).join(" ");
}

/* ---- Radar SVG ---- */
function svgRadar(o){
  const W=o.w||380,H=o.h||340,cx=W/2,cy=H/2+4,R=o.R||110,ax=o.axes,n=ax.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let g="";
  for(let k=1;k<=4;k++){const rr=R*k/4;let p="";for(let i=0;i<n;i++){const q=pt(i,rr);p+=(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);}p+="Z";
    g+=`<path d="${p}" fill="none" stroke="${GC}" stroke-width="1"/>`;}
  for(let i=0;i<n;i++){const q=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${GC}" stroke-width="1"/>`;
    const l=pt(i,R+22),anc=Math.abs(l[0]-cx)<10?"middle":(l[0]>cx?"start":"end");
    g+=`<text x="${l[0].toFixed(1)}" y="${(l[1]+3).toFixed(1)}" text-anchor="${anc}" font-size="10.5" font-weight="800" fill="${muted}">${ax[i]}</text>`;}
  (o.series||[]).forEach(s=>{let p="";const ps=[];for(let i=0;i<n;i++){const r=R*Math.max(0,Math.min(100,s.vals[i]))/100,q=pt(i,r);ps.push(q);p+=(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);}p+="Z";
    g+=`<path d="${p}" fill="${s.c}" fill-opacity="${s.fill!=null?s.fill:0.16}" stroke="${s.c}" stroke-width="${s.w||2.2}" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':""}/>`;
    if(s.dot!==false)ps.forEach(q=>{g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3" fill="${s.c}" stroke="#ffffff" stroke-width="1.4"/>`;});});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" style="max-width:${W}px" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
const zToPct=z=>Math.max(2,Math.min(100,50+20*z));

/* ---- Slopegraph ranking ---- */
function svgSlope(rows,labL,labR){
  const W=860,rowH=23,top=40,H=top+rows.length*rowH+16,xL=250,xR=W-250;
  let g=`<text x="${xL}" y="22" text-anchor="end" font-size="11.5" font-weight="800" fill="${muted}">${labL}</text>`+
        `<text x="${xR}" y="22" text-anchor="start" font-size="11.5" font-weight="800" fill="${muted}">${labR}</text>`;
  const yOf=r=>top+(r-1)*rowH;
  rows.forEach(r=>{const yl=yOf(r.rankL),yr=yOf(r.rankR);
    g+=`<line x1="${xL}" y1="${yl}" x2="${xR}" y2="${yr}" stroke="${r.c}" stroke-width="2" opacity="0.45"/>`;
    g+=`<circle cx="${xL}" cy="${yl}" r="4" fill="${r.c}"/><circle cx="${xR}" cy="${yr}" r="4" fill="${r.c}"/>`;
    g+=`<text x="${xL-12}" y="${(yl+3.5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="${ink}">${r.rankL}. ${r.t}</text>`;
    g+=`<text x="${xR+12}" y="${(yr+3.5).toFixed(1)}" text-anchor="start" font-size="11" font-weight="700" fill="${ink}">${r.t} · ${r.rankR}</text>`;
    const mv=r.rankL-r.rankR;if(mv!==0){const mc=mv>0?green:red;g+=`<text x="${(xL+xR)/2}" y="${((yl+yr)/2-4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="${mc}">${mv>0?"▲":"▼"}${Math.abs(mv)}</text>`;}});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

/* ---- Atribución de E(R) multifactor ---- */
function attribView(t){
  const a=MF.attrib[t],capm=stk(t).a24.er,mf=a.total,d=mf-capm;
  const maxAbs=Math.max(...MFSTYLE.map(k=>Math.abs(a.tilt[k])),0.3);
  const bars=MFSTYLE.map(k=>{const v=a.tilt[k],w=Math.abs(v)/maxAbs*46,pos=v>=0;
    return `<div style="display:grid;grid-template-columns:118px 1fr 56px;align-items:center;gap:10px;padding:.16rem 0">
      <span style="font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:2px;background:${MFCOL[k]};display:inline-block"></i>${MFLABEL[k]}</span>
      <div style="position:relative;height:13px"><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)"></div>
        <div style="position:absolute;${pos?"left:50%":"right:50%"};top:1.5px;height:10px;width:${w.toFixed(1)}%;background:${pos?"var(--green)":"var(--red)"};border-radius:3px;opacity:.85"></div></div>
      <span class="tnum" style="font-size:11.5px;font-weight:800;text-align:right;color:${v>=0?"var(--green)":"var(--red)"}">${(v>=0?"+":"")+v.toFixed(2)}</span></div>`;}).join("");
  return `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <div><div class="genl" style="margin:0">E(R) CAPM</div><div class="tnum" style="font-size:20px;font-weight:800;color:var(--accent)">${p0(capm)}</div></div>
      <div style="font-size:20px;color:var(--faint);font-weight:800">→</div>
      <div><div class="genl" style="margin:0">E(R) Multifactor</div><div class="tnum" style="font-size:20px;font-weight:800;color:${col(mf-capm)}">${p0(mf)}</div></div>
      <div style="margin-left:auto"><div class="genl" style="margin:0">Δ vs CAPM</div><div class="tnum" style="font-size:20px;font-weight:800;color:${col(d)}">${pc(d)}</div></div>
    </div>
    <div class="genl">Atribución del retorno esperado · contribución de cada factor (puntos %)</div>
    <div style="margin-top:6px">${bars}</div>
    <div class="note" style="margin-top:10px">Sobre la base CAPM (Rf ${p0(RF)} + β·prima = <b>${p0(capm)}</b>), cada factor suma o resta prima según la exposición de ${t}. Total multifactor = <b>${p0(mf)}</b>.</div>`;
}

let mfSel=STOCKS[0].t, mfProfile="moderado";

  const intro=card("Análisis multifactor","Por qué una sola métrica (β) no basta · 6 factores de estilo + retorno esperado multifactor",{html:disc+introBody},`<div class="pbtns" id="mfprofbtns">`+[["conservador","Conservador"],["moderado","Moderado"],["riesgoso","Riesgoso"]].map(p=>`<button class="pbtn ${prof===p[0]?"on":""}" data-mfprof="${p[0]}">${p[1]}</button>`).join("")+`</div>`);

  // selector + radar + atribución de la acción seleccionada
  const s=stk(mfSel),z=MF.z[mfSel];
  const selbar=`<div class="sel">${STOCKS.map(x=>`<button class="selb ${x.t===mfSel?"on":""}" data-mfsel="${x.t}" style="${x.t===mfSel?`background:${x.c};border-color:${x.c}`:""}"><span class="dot" style="background:${x.t===mfSel?"#fff":x.c}"></span>${x.t}</button>`).join("")}</div>`;
  const pcts=MFSTYLE.map(k=>zToPct(z[k]));
  const radar=svgRadar({axes:MFSTYLE.map(k=>MFSHORT[k]),series:[
    {label:"IPSA",c:muted,vals:[50,50,50,50,50,50],fill:0.05,dot:false,dash:true,w:1.5},
    {label:s.t,c:s.c,vals:pcts,fill:0.18}
  ]});
  const radarLeg=`<div class="legend" style="justify-content:center"><span><span class="lgdot" style="background:${s.c}"></span>${s.t}</span><span><span class="lgdot" style="background:${muted}"></span>Neutral mercado (z=0)</span></div><div class="note" style="text-align:center;margin-top:4px">Más afuera = mejor en ese factor (z transversal de las 14 acciones)</div>`;
  const radarCard=card("Perfil de estilo · "+s.t,`${s.n} · ${s.s} · <span class="stylebadges" style="display:inline-flex;gap:5px;vertical-align:middle">${styleBadges(mfSel)}</span>`,`<div class="radarwrap"><div>${radar}${radarLeg}</div></div>`);
  const attrCard=card("Retorno esperado multifactor · "+s.t,"Descomposición CAPM → multifactor por factor",attribView(mfSel));

  // tabla de factores
  const ranked=[...STOCKS].sort((a,b)=>compositeOf(b.t,prof)-compositeOf(a.t,prof));

    return `<tr><td><div style="display:flex;align-items:center;gap:7px">${tk(x)}</div></td>

  // slopegraph CAPM vs multifactor
  const capmRank=[...STOCKS].sort((a,b)=>b.a24.jensen-a.a24.jensen);

  let pfCard="";

  return intro+selbar+`<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)">${radarCard}${attrCard}</div>`+tbl+slope+pfCard+note;
}

function cpStockBrief(s){const z=MF.z[s.t];return {ticker:s.t,empresa:s.n,sector:s.s,beta:s.b,retorno24m:s.a24.ret,sigma:s.a24.sig,sharpe:s.a24.sharpe,alphaJensen:s.a24.jensen,erCAPM:+s.a24.er.toFixed(2),erMultifactor:+MF.er[s.t].toFixed(2),compositeMF:+MF.comp[s.t].toFixed(2),estilo:cpStyleOf(s.t)};}
function cpExposure(sel){const PM=pMetrics(sel);const Z={};MFSTYLE.forEach(k=>Z[k]=+(PM.ws.reduce((a,x)=>a+x.w*MF.z[x.s.t][k],0)).toFixed(2));const erMF=+(PM.ws.reduce((a,x)=>a+x.w*MF.er[x.s.t],0)).toFixed(2);return {PM,Z,erMF};}

/* ---- formato de mensajes (markdown mínimo, escapado) ---- */
function cpEsc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cpFormat(t){
  let s=cpEsc(t);
  s=s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  const lines=s.split(/\n/);let html="",inList=false;
  lines.forEach(ln=>{
    if(/^\s*[-•]\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+ln.replace(/^\s*[-•]\s+/,"")+"</li>";}
    else{if(inList){html+="</ul>";inList=false;}if(ln.trim()==="")html+="";else html+="<p>"+ln+"</p>";}
  });
  if(inList)html+="</ul>";
  return html;
}
function cpApiMessages(){return cpMsgs.map(m=>({role:m.role,content:m.content}));}

/* ---- render ---- */
function cpRenderHead(){
  const opts=CP_MODELS.map(m=>`<option value="${m[0]}" ${m[0]===cpModel?"selected":""}>${m[1]}</option>`).join("");
  return `<div class="cp-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"/><circle cx="18" cy="17.5" r="1.6"/><circle cx="6" cy="17" r="1.2"/></svg></div>
    <div><div class="cp-htitle">INVERSOR Copilot</div><div class="cp-hsub"><span class="live-dot"></span>Claude · tus datos</div></div>
    <select class="cp-sel" id="cpModelSel">${opts}</select>
    <button class="cp-x" id="cpClose" title="Cerrar">✕</button>`;
}
function cpRenderBody(){
  const body=document.getElementById("cpbody");if(!body)return;
  if(!cpKey){
    body.innerHTML=`<div class="cp-setup">
      <div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h3>Conecta tu copiloto IA</h3>
      <p>El copiloto usa la <b>API de Claude (Anthropic)</b> con <b>tu propia clave</b>. Se guarda <b>solo en este navegador</b> (localStorage) y las llamadas van directo desde tu equipo a Anthropic — sin servidores intermedios.</p>
      <div><label>Clave API de Anthropic</label><input type="password" id="cpKeyInput" placeholder="sk-ant-..." autocomplete="off"></div>
      <button class="cp-setbtn" id="cpKeySave">Activar copiloto</button>
      <div class="cp-warn"><b>⚠ Seguridad:</b> una clave en el navegador queda accesible a scripts de esta página. Úsala solo en tu equipo personal, ponle <b>límite de gasto</b> en la consola de Anthropic y no publiques este archivo con la clave incrustada.</div>
      <p style="text-align:center">¿No tienes clave? Créala en <a class="cp-link" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>. El uso se factura a tu cuenta (~1–3 ¢ por consulta).</p>
    </div>`;
    const inp=document.getElementById("cpKeyInput"),sv=document.getElementById("cpKeySave");
    if(sv)sv.onclick=()=>{const v=(inp.value||"").trim();if(v.length<10){inp.style.borderColor="var(--red)";return;}cpKey=v;lsSet("inv_anthropic_key",v);cpRenderBody();cpRenderFoot();};
    if(inp)inp.onkeydown=e=>{if(e.key==="Enter")sv.click();};
    return;
  }
  let h="";
  cpMsgs.forEach(m=>{
    if(m.role==="user"){
      if(typeof m.content==="string")h+=`<div class="cp-msg u">${cpEsc(m.content)}</div>`;
      // tool_result user messages: no se muestran
    } else if(m.role==="assistant"){
      (m.content||[]).forEach(b=>{
        if(b.type==="text"&&b.text.trim())h+=`<div class="cp-msg a"><div class="who"><span class="live-dot"></span>Copilot</div>${cpFormat(b.text)}</div>`;
        else if(b.type==="tool_use")h+=`<div class="cp-tool"><span class="dotp"></span>consultando <code>${cpEsc(b.name)}</code></div>`;
      });
    }
  });
  if(cpBusy)h+=`<div class="cp-typing"><i></i><i></i><i></i></div>`;
  if(cpMsgs.length===0){
    const sugs=["¿Cómo está diversificada mi cartera y cómo voy contra el IPSA?","Analiza mis posiciones con el modelo multifactor.","Propón un rebalanceo para bajar el riesgo manteniendo retorno.","¿Qué acción del IPSA luce mejor por calidad y valor?"];
    h+=`<div class="cp-msg a"><div class="who"><span class="live-dot"></span>Copilot</div>${cpFormat("¡Hola! Soy tu copiloto de inversiones. Puedo leer **tu portafolio real**, las métricas **CAPM** y **multifactor** de las 14 acciones del IPSA, tus escenarios y la cartera del Constructor. Pregúntame o prueba una de estas:")}</div><div class="cp-sugs">${sugs.map(s=>`<button class="cp-sug" data-cpsug="${cpEsc(s)}">${cpEsc(s)}</button>`).join("")}</div>`;
  }
  body.innerHTML=h;
  body.querySelectorAll("[data-cpsug]").forEach(b=>b.onclick=()=>cpSend(b.dataset.cpsug));
  body.scrollTop=body.scrollHeight;
}
function cpRenderFoot(){
  const foot=document.getElementById("cpfoot");if(!foot)return;
  if(!cpKey){foot.innerHTML="";return;}
  foot.innerHTML=`<div class="cp-inwrap"><textarea class="cp-in" id="cpInput" rows="1" placeholder="Pregúntale a tu copiloto…" ${cpBusy?"disabled":""}></textarea>
    <button class="cp-send" id="cpSendBtn" ${cpBusy?"disabled":""} title="Enviar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button></div>
    <div class="cp-disc">Información educativa, no asesoría financiera · clave guardada solo en tu navegador · <a class="cp-link" id="cpForget" style="cursor:pointer">cambiar clave</a></div>`;
  const inp=document.getElementById("cpInput"),btn=document.getElementById("cpSendBtn");
  if(inp){inp.oninput=()=>{inp.style.height="auto";inp.style.height=Math.min(120,inp.scrollHeight)+"px";};
    inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!cpBusy)cpSend(inp.value);}};inp.focus();}
  if(btn)btn.onclick=()=>{if(!cpBusy)cpSend(document.getElementById("cpInput").value);};
  const fg=document.getElementById("cpForget");if(fg)fg.onclick=()=>{if(confirm("¿Borrar la clave guardada en este navegador?")){cpKey="";lsSet("inv_anthropic_key","");cpMsgs=[];cpRenderBody();cpRenderFoot();}};
}

/* ---- loop agéntico ---- */
async function cpSend(text){
  text=(text||"").trim();if(!text||cpBusy||!cpKey)return;
  cpMsgs.push({role:"user",content:text});cpBusy=true;cpRenderBody();cpRenderFoot();
  try{
    let guard=0;
    while(guard++<8){
      const body={model:cpModel,max_tokens:2048,system:CP_SYSTEM,tools:COPILOT_TOOLS,messages:cpApiMessages()};
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
        "content-type":"application/json","x-api-key":cpKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});
      if(!res.ok){
        let msg="Error "+res.status;try{const e=await res.json();msg=(e.error&&e.error.message)||msg;}catch(_){}
        if(res.status===401)msg="Clave inválida o sin crédito. Revisa tu clave de Anthropic.";
        cpMsgs.push({role:"assistant",content:[{type:"text",text:"⚠ "+msg}]});break;
      }
      const data=await res.json();
      cpMsgs.push({role:"assistant",content:data.content});cpRenderBody();
      if(data.stop_reason==="tool_use"){
        const results=(data.content||[]).filter(b=>b.type==="tool_use").map(b=>({type:"tool_result",tool_use_id:b.id,content:cpRunTool(b.name,b.input)}));
        cpMsgs.push({role:"user",content:results});cpRenderBody();continue;
      }
      break;
    }
  }catch(err){cpMsgs.push({role:"assistant",content:[{type:"text",text:"⚠ No se pudo conectar con Anthropic: "+err.message+". Si ves un error de CORS, revisa que tu clave sea válida."}]});}
  cpBusy=false;cpRenderBody();cpRenderFoot();
}

/* ---- panel / FAB ---- */
function cpEnsureDOM(){
  if(document.getElementById("cpPanel"))return;
  const fab=document.createElement("button");fab.className="cp-fab";fab.id="cpFab";
  fab.innerHTML=`<span class="spark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z"/></svg></span><span class="lbl">Copiloto IA</span>`;
  document.body.appendChild(fab);
  const p=document.createElement("div");p.className="cp-panel";p.id="cpPanel";
  p.innerHTML=`<div class="cp-head" id="cphead"></div><div class="cp-body" id="cpbody"></div><div class="cp-foot" id="cpfoot"></div>`;
  document.body.appendChild(p);
  document.getElementById("cphead").innerHTML=cpRenderHead();
  fab.onclick=cpToggle;
  document.getElementById("cpClose").onclick=cpToggle;
  document.getElementById("cpModelSel").onchange=e=>{cpModel=e.target.value;lsSet("inv_cp_model",cpModel);};
  document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-opencopilot]");if(t){e.preventDefault();cpOpenPanel();}});
}
function cpOpenPanel(){cpEnsureDOM();cpOpen=true;document.getElementById("cpPanel").classList.add("open");document.getElementById("cpFab").classList.add("hide");cpRenderBody();cpRenderFoot();}
function cpClosePanel(){cpOpen=false;const p=document.getElementById("cpPanel");if(p)p.classList.remove("open");const f=document.getElementById("cpFab");if(f)f.classList.remove("hide");}
function cpToggle(){cpOpen?cpClosePanel():cpOpenPanel();}
cpEnsureDOM();
render();
</script>
