  .auth-btn{width:100%;padding:.82rem;border:none;border-radius:12px;cursor:pointer;color:#fff;font:800 14px var(--font);
    background:linear-gradient(180deg,var(--a-400),var(--accent));box-shadow:0 6px 18px rgba(30,95,209,.36);transition:.15s var(--ease-out);}
  .auth-btn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(30,95,209,.46);}
  .auth-btn:active{transform:translateY(0);}
  .auth-skip{text-align:center;margin-top:13px;}
  .auth-skip a{font-size:11.5px;color:var(--indigo);font-weight:700;cursor:pointer;}
  .auth-skip a:hover{text-decoration:underline;}
  .auth-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:9.5px;color:var(--faint);text-align:center;line-height:1.55;}

  /* ════════════ Constructor: tabla rica ════════════ */
  .cons-tw{border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;}
  .cons-tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:780px;}
  .cons-tbl th{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);background:var(--card2);position:sticky;top:0;z-index:1;}
  .cons-tbl th.r{text-align:right;}
  .cons-tbl td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .cons-tbl tbody tr:last-child td{border-bottom:none;}
  .cons-row{transition:background .12s;}
  .cons-row:hover{background:var(--card2);}
  .cons-row.on{background:rgba(30,95,209,.055);}
  .cons-row.on:hover{background:rgba(30,95,209,.085);}
  .cons-pick{width:36px;}
  .cons-chk{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;}
  .cons-name{display:flex;align-items:center;gap:7px;font-size:13px;line-height:1.1;}
  .cons-name .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cons-sec{font-size:10px;color:var(--faint);margin-top:2px;padding-left:16px;}
  .cons-beta{font-weight:800;}
  .cons-shwrap{display:flex;align-items:center;gap:7px;justify-content:flex-end;}
  .cons-bar{width:46px;height:6px;border-radius:4px;background:var(--line);overflow:hidden;flex-shrink:0;}
  /* tablas ordenables: clic en el encabezado */
  #main table thead th{cursor:pointer;user-select:none;}
  #main table thead th.srt-asc::after{content:" ▲";font-size:8.5px;opacity:.8;}
  #main table thead th.srt-desc::after{content:" ▼";font-size:8.5px;opacity:.8;}
  .cons-bar i{display:block;height:100%;border-radius:4px;}
  .cons-comp{font-weight:800;padding:.12rem .42rem;border-radius:var(--r-pill);font-size:11px;white-space:nowrap;}
  .cons-comp.pos{color:var(--green);background:var(--greenbg);}
  .cons-comp.neg{color:var(--red);background:var(--redbg);}
  .cons-comp.neu{color:var(--muted);background:var(--card2);}
  .cons-style{font-size:9.5px;color:var(--faint);margin-top:4px;max-width:160px;margin-left:auto;}
  .cons-wcell .winp{width:54px;text-align:right;padding:.36rem .42rem;border:1px solid var(--line2);border-radius:8px;background:var(--card);font:700 12px var(--font);color:var(--ink);}
  .cons-wcell .winp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,209,.14);}
  .cons-add{font-size:10.5px;color:var(--faint);font-weight:700;}

  /* ════════════ Pulido profesional v4 ════════════ */
  .pbtn.on,.nbtn.on{background:linear-gradient(180deg,var(--a-400),var(--accent));border-color:transparent;box-shadow:0 3px 10px rgba(30,95,209,.28);}
  .tile{border-radius:13px;}
  .tile:hover .edge{width:4px;}
  .badge{letter-spacing:.2px;}

  /* ════════════ Proyectos (hub) ════════════ */
  .prj-list{display:flex;flex-direction:column;gap:14px;}
  .prj-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:1.05rem 1.15rem;box-shadow:var(--sh-xs);transition:border-color .15s,box-shadow .15s;}
  .prj-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--sh-md);}
  .prj-head{display:flex;align-items:flex-start;gap:11px;}
  .prj-name{flex:1;border:1px solid transparent;border-bottom:1px dashed var(--line2);background:transparent;font:850 16px var(--font);color:var(--navy);padding:.2rem 1.5rem .2rem .4rem;border-radius:8px;letter-spacing:-.3px;min-width:0;cursor:text;}
  .prj-name:hover{border-color:var(--line);background:var(--card2);} .prj-name:focus{outline:none;border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 3px rgba(30,95,209,.14);}
  .prj-namewrap{position:relative;flex:1;min-width:0;display:flex;align-items:center;}
  .prj-namewrap::after{content:"✎";position:absolute;right:.45rem;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none;}
  .proj-steps{display:flex;flex-direction:column;gap:10px;}
  .pstep{display:flex;align-items:center;gap:12px;padding:.8rem .9rem;border:1px solid var(--line);border-radius:12px;background:var(--card2);}
  .pstep-n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font:800 13px var(--font);display:flex;align-items:center;justify-content:center;}
  .pstep-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
  .pstep-b b{font:800 13px var(--font);color:var(--navy);}
  .pstep-b span{font-size:11.5px;color:var(--mut);font-weight:600;}
  .prj-sub{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:2px;padding-left:.4rem;}
  .prj-act{padding:.4rem .75rem;font-size:12px;}
  .prj-del{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;flex-shrink:0;}
  .prj-del:hover{color:var(--red);border-color:var(--red);}
  .prj-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px;margin:14px 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .prj-m{display:flex;flex-direction:column;gap:3px;} .prj-m .l{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;} .prj-m b{font-size:15px;color:var(--navy);font-weight:800;letter-spacing:-.3px;}
  .prj-links{display:flex;flex-direction:column;gap:9px;}
  .prj-lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .prj-llbl{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);width:90px;flex-shrink:0;}
  .prj-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:120px;}
  .prj-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:.18rem .2rem .18rem .5rem;border-radius:var(--r-pill);border:1px solid var(--line2);background:var(--card2);color:var(--ink);}
  .prj-chip.an{border-color:rgba(30,95,209,.35);color:var(--accent);} .prj-chip.sc{border-color:rgba(124,58,237,.35);color:#7C3AED;}
  .prj-x{border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:10px;padding:0 3px;border-radius:50%;} .prj-x:hover{color:var(--red);}
  .prj-none{font-size:10.5px;color:var(--faint);font-style:italic;}
  .prj-add{padding:.32rem .5rem;border:1px solid var(--line2);border-radius:8px;background:var(--card);font:600 11px var(--font);color:var(--muted);cursor:pointer;}
  .prj-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .prj-srlist{display:flex;flex-direction:column;gap:8px;}
  .prj-srow{display:flex;align-items:center;gap:11px;padding:.55rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--card2);}
  .prj-srow.on{border-color:var(--accent);background:rgba(30,95,209,.05);}
  .prj-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--muted);}
  .prj-dot.demo{background:var(--muted);} .prj-dot.import{background:var(--brand-grad);} .prj-dot.sim{background:#7C3AED;}
  .prj-srow b{font-size:13px;color:var(--navy);} .prj-tag{font-size:10px;color:var(--faint);margin-left:8px;font-weight:600;}

  .prj-chip.primary{border-color:var(--accent);background:rgba(30,95,209,.10);box-shadow:0 0 0 1px var(--accent) inset;}
  .prj-chip.active .prj-go{text-decoration:underline;}
  .prj-star{border:none;background:transparent;cursor:pointer;color:#C99A1E;font-size:12px;padding:0 1px;line-height:1;}
  .prj-star:hover{color:#E0AC1F;}
  .prj-chip .prj-go{border:none;background:transparent;cursor:pointer;color:inherit;font:inherit;font-weight:700;padding:0 2px;}
  .prj-chip .prj-go:hover{text-decoration:underline;}

  /* ════════════ Modo asesor: clientes ════════════ */
  .cli-wrap{position:relative;display:none;}/* clientes ocultos por ahora — solo administración */
  .cli-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 .7rem;border-radius:10px;border:1px solid var(--line2);background:var(--card);cursor:pointer;font:700 12.5px var(--font);color:var(--ink);box-shadow:var(--sh-xs);transition:.15s var(--ease);}
  .cli-btn:hover{border-color:var(--accent);}
  .cli-btn .cli-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0;}
  .cli-lbl{font-size:8.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);}
  .cli-name{font-weight:800;color:var(--navy);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cli-btn svg{color:var(--muted);}
  .cli-menu{position:absolute;top:42px;left:0;min-width:230px;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh-lg);padding:6px;display:none;z-index:340;}
  .cli-menu.open{display:block;animation:cfgFade .14s ease;}
  .cli-item{display:flex;align-items:center;gap:9px;width:100%;padding:.5rem .55rem;border:none;background:transparent;border-radius:8px;cursor:pointer;font:600 12.5px var(--font);color:var(--ink);text-align:left;}
  .cli-item:hover{background:var(--card2);}
  .cli-item.on{background:rgba(30,95,209,.07);}
  .cli-item .cli-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .cli-item.act{color:var(--accent);font-weight:800;justify-content:center;}
  .cli-chk{color:var(--green);font-weight:900;}
  .cli-sep{height:1px;background:var(--line);margin:5px 2px;}
  .cli-list{display:flex;flex-direction:column;gap:9px;}
  .cli-card{display:flex;align-items:center;gap:12px;padding:.7rem .85rem;border:1px solid var(--line);border-radius:11px;background:var(--card2);}
  .cli-card.on{border-color:var(--accent);background:rgba(30,95,209,.05);box-shadow:0 0 0 1px var(--accent) inset;}
  .cli-card .cli-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .cli-rename{border:1px solid transparent;background:transparent;font:800 14px var(--font);color:var(--navy);padding:.2rem .35rem;border-radius:7px;max-width:280px;}
  .cli-rename:hover{border-color:var(--line);} .cli-rename:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(30,95,209,.14);}
  .cli-meta{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:2px;padding-left:.35rem;}
  /* Administrador de clientes */
  .adm-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .adm-tbl{width:100%;border-collapse:collapse;font:700 12.5px var(--font);}
  .adm-tbl th{text-align:right;font:800 9.5px var(--font);letter-spacing:.4px;text-transform:uppercase;color:var(--mut);padding:0 .6rem .65rem;border-bottom:1px solid var(--line);white-space:nowrap;}
  .adm-tbl th:first-child{text-align:left;}
  .adm-tbl th.cc{text-align:center;}
  .adm-tbl td{text-align:right;padding:.7rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink);}
  .adm-tbl td:first-child{text-align:left;}
  .adm-row.on{background:rgba(30,95,209,.05);}
  .adm-cli{display:flex;align-items:center;gap:11px;}
  .adm-cli .cli-dot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
  .adm-name{font:800 13.5px var(--font);color:var(--navy);display:flex;align-items:center;gap:8px;}
  .adm-sub{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px;}
  .adm-c{text-align:center !important;font-weight:800;color:var(--navy);}
  .adm-act{display:flex;gap:7px;align-items:center;justify-content:flex-end;}
  .adm-here{font:800 10.5px var(--font);color:var(--accent);text-transform:uppercase;letter-spacing:.4px;}
  .adm-tot td{border-top:2px solid var(--line2);border-bottom:none;font-weight:800;color:var(--navy);padding-top:.85rem;}
  .adm-tot td:first-child{text-transform:uppercase;font-size:10px;letter-spacing:.5px;color:var(--mut);}
  .adm-b{text-align:center !important;font-weight:800;}
  .risk-chip{display:inline-block;font:800 9px var(--font);padding:.14rem .48rem;border-radius:999px;letter-spacing:.2px;vertical-align:middle;text-transform:uppercase;}
  .risk-chip.cons{background:#E6F6EF;color:#0A6B47;}
  .risk-chip.mod{background:#EEF1FB;color:#2C4FB3;}
  .risk-chip.agr{background:#FDECEC;color:#A52121;}
  .risk-chip.none{background:var(--surface);color:var(--mut);}
  [data-theme="dark"] .risk-chip.cons{background:#10311F;color:#7AD6A8;}
  [data-theme="dark"] .risk-chip.mod{background:#1A2240;color:#A0B4F0;}
  [data-theme="dark"] .risk-chip.agr{background:#3A1A1A;color:#F0A0A0;}
  /* ════════════════ HOME / RESUMEN GENERAL ════════════════ */
  .modbtn.home-btn{position:sticky;top:0;z-index:6;margin-bottom:14px;background:linear-gradient(180deg,#0C1A36,#0A1530);border:1px solid rgba(125,172,247,.26);box-shadow:0 10px 16px -8px rgba(3,9,22,.8);}
  .modbtn.home-btn.on{background:linear-gradient(135deg,#1B2F5C,#13234A);border-color:rgba(125,172,247,.38);}
  .home-hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:1.5rem 1.7rem;color:#fff;box-shadow:var(--sh-lg);margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;background:linear-gradient(120deg,#0A1224 0%,#13316E 52%,#2563EB 100%);}
  .home-hero.neg{background:linear-gradient(120deg,#0A1224 0%,#3A1726 55%,#9A2740 100%);}
  .hh-c{flex:1 1 200px;min-width:160px;max-width:380px;align-self:center;opacity:.9;}
  .hero-spark{width:100%;height:72px;display:block;}
  .home-hero::after{content:"";position:absolute;right:-40px;top:-50px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 65%);}
  .hh-eyebrow{font-size:9.5px;letter-spacing:1.6px;font-weight:800;opacity:.82;text-transform:uppercase;}
  .hh-val{font:800 34px var(--font);letter-spacing:-1px;margin:7px 0 6px;position:relative;font-variant-numeric:tabular-nums;}
  .hh-sub{font-size:12px;opacity:.9;position:relative;}
  .hh-r{text-align:right;position:relative;}
  .hh-gain{font:800 22px var(--font);font-variant-numeric:tabular-nums;}
  .hh-pct{font:800 15px var(--font);opacity:.95;}.hh-pct span{display:block;font-size:10px;font-weight:700;opacity:.78;letter-spacing:.3px;margin-top:2px;}
  .home-rklist{display:flex;flex-direction:column;gap:8px;}
  .home-rk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:.6rem .7rem;border:1px solid var(--line);border-radius:11px;background:var(--card2);cursor:pointer;transition:.13s var(--ease);}
  .home-rk:hover{border-color:var(--a-200);background:var(--a-50);transform:translateX(2px);}
  .rk-pos{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:var(--surface);color:var(--mut);font:800 12px var(--font);display:flex;align-items:center;justify-content:center;}
  .home-rk:first-child .rk-pos{background:var(--brand-grad);color:#06231F;}
  .rk-dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;}
  .rk-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .rk-name{font:800 13.5px var(--font);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rk-cli{font-size:10.5px;color:var(--mut);font-weight:600;}
  .rk-bar{height:5px;border-radius:4px;background:var(--surface);overflow:hidden;margin-top:2px;}
  .rk-bar i{display:block;height:100%;border-radius:4px;}
  .rk-pct{flex:0 0 auto;font:800 15px var(--font);font-variant-numeric:tabular-nums;}
  .home-rklist.tight .home-stk{display:flex;align-items:center;gap:11px;padding:.5rem .55rem;border-bottom:1px solid var(--line);}
  .home-stk:last-child{border-bottom:none;}
  .home-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .home-mvgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .home-mv{border:1px solid var(--line);border-radius:11px;padding:.65rem .75rem;background:var(--card2);}
  .mv-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .mv-name{font:800 11.5px var(--font);color:var(--navy);}
  .mv-chg{font:800 12px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .mv-val{font:800 17px var(--font);color:var(--ink);margin:3px 0 5px;font-variant-numeric:tabular-nums;}
  .home-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .home-act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:.85rem .95rem;border:1px solid var(--line2);border-radius:12px;background:var(--card2);cursor:pointer;text-align:left;transition:.14s var(--ease);}
  .home-act:hover{border-color:var(--accent);background:var(--a-50);transform:translateY(-2px);box-shadow:var(--sh);}
  .home-act .ha-i{font-size:18px;color:var(--accent);margin-bottom:4px;}
  .home-act b{font:800 13.5px var(--font);color:var(--navy);}
  .home-act .ha-s{font-size:11px;color:var(--mut);font-weight:600;}
  @media(max-width:880px){.home-grid2{grid-template-columns:1fr;}}
  /* carteras más rentables — tarjetas estándar (tuyas + clientes en igualdad) */
  .home-cartgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;}

function svgLine(o){
  const W=780,H=o.h||215,m={l:46,r:18,t:18,b:48},n=o.vals.length,step=(W-m.l-m.r)/(n-1);

  let g="";

    g+=`<line x1="${m.l}" y1="${yy}" x2="${W-m.r}" y2="${yy}" stroke="${GC}"/><text x="${m.l-8}" y="${yy+3}" text-anchor="end" font-size="11.5" fill="${faint}">${v.toFixed(0)}%</text>`;}

  if(o.cmp){const Pc=o.cmp.map((v,i)=>[X(i),Y(v)]);const dlc=Pc.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");

  const dl=P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const da=`M${X(0).toFixed(1)} ${z} `+P.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${X(n-1).toFixed(1)} ${z} Z`;
  g+=`<defs><linearGradient id="lgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${o.c}" stop-opacity="0.20"/><stop offset="100%" stop-color="${o.c}" stop-opacity="0"/></linearGradient></defs>`;
  g+=`<path d="${da}" fill="url(#lgr)"/><path d="${dl}" fill="none" stroke="${o.c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  P.forEach((p,i)=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#fff" stroke="${o.c}" stroke-width="1.6"/>`;

  window.__lineGeo={xs:P.map(p=>p[0]),ys:P.map(p=>p[1]),labels:o.labels,vals:o.vals,prices:o.prices||[],cmp:o.cmp||[],c:o.c,mt:m.t,mb:m.b,H};
  return `<svg id="dlinesvg" viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}<g id="dlinehover"></g></svg>`;
}

function viewComparativa(){
  // modo ventana (< ~1 año): la rentabilidad protagonista es la de la VENTANA (30d→30d, 6m→6m); la
  // anualizada queda como referencia. El α se prorratea a la ventana para compararlo con ese retorno.
  const W=winMode();
  const retOf=s=>W?s.a24.tot:s.a24.ret, alfaOf=s=>W?alphaWin(s):s.a24.jensen, mktRet=W?MKT.tot:MKT.ret, rfY=W?rfWin():RF;
  const sx=niceBounds([0,...STOCKS.map(s=>s.a24.sig)],0.12);sx.min=0;
  const sy=niceBounds([rfY,...STOCKS.map(retOf),mktRet],0.14);
  const pts=STOCKS.map(s=>({x:s.a24.sig,y:retOf(s),c:s.c,label:s.t}));
  pts.push({x:MKT.sig,y:mktRet,c:indigo,label:"IPSA",shape:"diamond",r:8});
  pts.push({x:0,y:rfY,c:muted,label:"Rf",shape:"tri"});
  const leg=`<div class="legend"><span><span class="lgdot" style="background:${indigo}"></span>IPSA (mercado)</span><span><span class="lgdot" style="background:${muted}"></span>Rf</span></div>`;
  const scatter=card("Mapa Riesgo–Retorno",(W?("Volatilidad anual (X) vs retorno de la ventana (Y) · "):"Volatilidad anual (X) vs retorno anual (Y) · ")+winLong(),svgScatter({pts,xmin:sx.min,xmax:sx.max,ymin:sy.min,ymax:sy.max,xlab:"Riesgo σ (% anual)",ylab:W?("Retorno "+winShort()+" (%)"):"Retorno (% anual)",fx:v=>v.toFixed(0)+"%",fy:v=>v.toFixed(0)+"%",h:420}),leg);
  const byS=[...STOCKS].sort((a,b)=>b.a24.sharpe-a.a24.sharpe);
  const rows=byS.map(s=>{const a=s.a24;return `<tr><td>${tk(s)}</td><td>${badge(s.s,s.c)}</td>
    <td class="tnum num" style="color:${accentT};font-weight:700">${s.b.toFixed(2)}</td><td class="num">${chip(retOf(s))}</td>
    <td class="tnum num">${p0(a.sig)}</td><td class="tnum num" style="font-weight:800;color:${a.sharpe>=0?green:red}">${a.sharpe.toFixed(2)}</td>
    <td class="num">${chip(alfaOf(s))}</td><td class="tnum num" style="color:${muted}">${a.r2.toFixed(2)}</td><td class="tnum num" style="color:${muted}">${W?pc(a.ret):pc(a.tot)}</td></tr>`;}).join("");
  const mkt=`<tr style="background:var(--soft)"><td style="font-weight:800;color:${indigo}">IPSA</td><td>${badge("mercado",indigo)}</td>
    <td class="tnum num" style="color:${accentT};font-weight:700">1.00</td><td class="num">${chip(mktRet)}</td><td class="tnum num">${p0(MKT.sig)}</td>
    <td class="tnum num" style="font-weight:800;color:${green}">${MKT.sharpe.toFixed(2)}</td><td class="num" style="color:${muted}">—</td><td class="tnum num" style="color:${muted}">1.00</td><td class="tnum num" style="color:${muted}">${W?pc(MKT.ret):pc(MKT.tot)}</td></tr>`;
  const heads=W

  const tbl=card("Comparativa de candidatas",tblSub,{html:`<div class="tw"><table><thead><tr>${heads.map(([h,n])=>`<th class="${n?'num ':''}ntr">${h}</th>`).join("")}</tr></thead><tbody>${rows}${mkt}</tbody></table></div>`,flush:true});
  return marketTiles()+scatter+tbl;

  const tiles=`<div class="tiles">

    ${_W?tile("Retorno "+winShort(),pc(a.tot),"anualizado (proyección) "+pc(a.ret),s.c,col(a.tot)):tile("Retorno anual",pc(a.ret),"total "+winShort()+" "+pc(a.tot),s.c,col(a.ret))}
    ${tile("Volatilidad σ",p0(a.sig),(a.sig/MKT.sig).toFixed(1)+"× IPSA",s.c)}
    ${tile("Sharpe",a.sharpe.toFixed(2),"IPSA "+MKT.sharpe.toFixed(2),s.c,a.sharpe>=0?green:red)}
    ${tile("E(R) CAPM",p0(a.er),_W?("exigido en la ventana "+p0(erWin(s.b),2)):"retorno exigido",s.c,indigo)}
    ${_W?tile("α ventana",pc(_alfa),"real − exigido en "+winShort(),s.c,col(_alfa)):tile("α Jensen",pc(a.jensen),"real − exigido",s.c,col(a.jensen))}</div>`;
  // fundamentos del negocio (si el pipeline ya los trajo): complementan las métricas de precio de arriba
  const _f=(typeof fundGet==="function")?fundGet(sel):null;
  const _fpos=(_f&&_f.px!=null&&_f.hi52!=null&&_f.lo52!=null&&_f.hi52>_f.lo52)?Math.max(0,Math.min(1,(_f.px-_f.lo52)/(_f.hi52-_f.lo52))):null;
  const fTiles=_f?`<div class="tiles" style="margin-top:10px">
    ${tile("P/U",_f.pe!=null?_f.pe.toLocaleString("es-CL",{maximumFractionDigits:1}):"—",_f.fpe!=null?("forward "+_f.fpe.toLocaleString("es-CL",{maximumFractionDigits:1})):"precio / utilidad",s.c,ink)}
    ${tile("P/B",_f.pb!=null?_f.pb.toLocaleString("es-CL",{maximumFractionDigits:2}):"—","precio / valor libro",s.c,_f.pb!=null&&_f.pb<1?green:ink)}
    ${tile("Yield dividendos",_f.dy!=null?_f.dy.toLocaleString("es-CL",{maximumFractionDigits:1})+"%":"—",_f.dps!=null?("$"+_f.dps.toLocaleString("es-CL")+" por acción (12m)"):"últimos 12 meses",s.c,_f.dy>=5?green:ink)}
    ${tile("Capitalización",fundFmtCap(_f.mcap),"valor bolsa",s.c,ink)}
    ${tile("Rango 52 semanas",_fpos!=null?(_fpos*100).toFixed(0)+"%":"—",_fpos!=null?("del mínimo ("+(_f.lo52||0).toLocaleString("es-CL")+") al máximo ("+(_f.hi52||0).toLocaleString("es-CL")+")"):"sin datos",s.c,_fpos!=null?(_fpos>=0.5?green:amber):ink)}
    ${_f.roe!=null?tile("ROE",_f.roe.toLocaleString("es-CL",{maximumFractionDigits:1})+"%",(_f.nm!=null?("margen neto "+_f.nm.toLocaleString("es-CL",{maximumFractionDigits:1})+"%"):"rentabilidad del patrimonio"),s.c,_f.roe>=15?green:ink):""}
    ${(_f.target!=null&&_f.px>0)?tile("Precio objetivo",_f.target.toLocaleString("es-CL",{maximumFractionDigits:0}),"upside "+((_f.target/_f.px-1)*100>=0?"+":"")+((_f.target/_f.px-1)*100).toFixed(1)+"%"+(_f.nAn?(" · "+_f.nAn+" analistas"):""),s.c,(_f.target/_f.px-1)>=0.1?green:(_f.target/_f.px-1)>=0?ink:red):""}</div>`:"";
  const xb=niceBounds(MKT.rets,0.1),yb=niceBounds(s.rets,0.1),am=a.alphaR/(DATA.perYear||12);
  const pts=s.rets.map((y,k)=>({x:MKT.rets[k],y:y,c:s.c+"d0",r:5}));
  const line=[{x1:xb.min,y1:am+s.b*xb.min,x2:xb.max,y2:am+s.b*xb.max,c:s.c}];
  const scl=card("Recta Característica (SCL)",`Retorno ${perAdj} de ${s.t} (Y) vs IPSA (X) · pendiente = β ${s.b.toFixed(2)}`,svgScatter({pts,lines:line,xmin:xb.min,xmax:xb.max,ymin:yb.min,ymax:yb.max,xlab:"IPSA (% "+perAdj+")",ylab:s.t+" (% "+perAdj+")",fx:v=>v.toFixed(0)+"%",fy:v=>v.toFixed(0)+"%",h:300}));
  const i=TICK.indexOf(s.t);
  // COMPACTO e independiente del nº de acciones del análisis: con 28 acciones la lista completa se hacía
  // interminable y desordenaba la vista — se muestran los EXTREMOS útiles para decidir (con quién diversificar
  // y con quién NO se diversifica), no el listado entero
  const _oth=STOCKS.filter(x=>x.t!==s.t).map(x=>({x,c:CORR[i][TICK.indexOf(x.t)]})).filter(o=>o.c!=null&&isFinite(o.c)).sort((a,b)=>a.c-b.c);
  const _cRow=o=>`<div style="display:flex;align-items:center;gap:9px;padding:.42rem .1rem;border-bottom:1px solid var(--line)"><span style="flex:1;min-width:0">${tk(o.x)}</span><div class="cons-bar" style="width:56px;flex:0 0 auto"><i style="width:${Math.max(4,Math.min(100,Math.abs(o.c)*100)).toFixed(0)}%;background:${o.c<0.3?green:o.c<0.6?amber:red}"></i></div><span class="tnum" style="font-weight:800;width:38px;text-align:right;color:${o.c<0.3?green:o.c<0.6?amber:red}">${o.c.toFixed(2)}</span></div>`;
  let cl;
  if(_oth.length<=8){cl=_oth.map(_cRow).join("");}
  else{const nS=6,lows=_oth.slice(0,nS),highs=_oth.slice(-nS).reverse();
    cl=`<div class="genl" style="margin:0 0 4px">Diversifican mejor (menor ρ)</div>${lows.map(_cRow).join("")}
        <div class="genl" style="margin:12px 0 4px">Se mueven en bloque (mayor ρ)</div>${highs.map(_cRow).join("")}
        <div class="note" style="margin-top:10px;font-size:10.5px">Extremos de ${_oth.length} acciones del análisis · la selección completa con correlaciones se trabaja en el Constructor.</div>`;}
  const corr=card("Correlación con otras","Con quién diversifica "+s.t+" y con quién no · ρ de la ventana",cl);
  const mr=card("Retornos "+perPl,`${s.t} vs IPSA · ${winLong()}`,svgLine({vals:s.rets,labels:DATA.labels,c:s.c,cmp:MKT.rets,cmpC:muted,prices:s.prices.slice(1),h:215}),`<div class="legend"><span><span class="lgdot" style="background:${s.c}"></span>${s.t}</span><span><span class="lgdot" style="background:${muted}"></span>IPSA</span></div>`);
  const plab=(/^[a-z]{3}-\d{2}$/i.test(""+DATA.labels[0]))?[prevMonth(DATA.labels[0]),...DATA.labels]:["inicio",...DATA.labels];   // solo el demo usa etiquetas mes-año; en un análisis del usuario son fechas
  const ph=card("Historia del precio",`${s.t} · precio de cierre ${perAdj} · ${s.prices.length} puntos`,svgPrice({prices:s.prices,labels:plab,c:s.c,t:s.t,h:215}));
  const _lowR2=a.r2<0.10;   // r² muy bajo: el mercado casi no explica a la acción → β/α poco confiables (mucho riesgo idiosincrático)
  const interp=notecard(`<b>${s.n}</b> (${s.s}). β ${s.b.toFixed(2)} → ${s.b<0.8?"defensiva, amortigua el mercado":s.b<1?"moderada":"agresiva, amplifica el mercado"}. R² ${a.r2.toFixed(2)}: <b>${(a.r2*100).toFixed(0)}%</b> de su riesgo es sistemático, el resto es propio (diversificable). ${_W?("Retorno de la ventana ("+winShort()+") "+pc(a.tot)+" (anualizado referencial "+pc(a.ret)+")"):("Retorno anual "+pc(a.ret))} con σ ${p0(a.sig)} → Sharpe ${a.sharpe.toFixed(2)} (IPSA ${MKT.sharpe.toFixed(2)}). ${_W?("α de la ventana "+pc(_alfa)):("α de Jensen "+pc(a.jensen))} → <b>${_alfa>=0?"rindió sobre":"rindió bajo"}</b> lo exigido por su β${_W?" en ese lapso":""}. Señal de valoración: <b style="color:${sgc}">${sg}</b>${_W?" (ventana corta: tómala como indicio, no como veredicto)":""}.${_lowR2?` <br><b style="color:${amber}">⚠ R² muy bajo (${(a.r2*100).toFixed(0)}%):</b> el IPSA casi no explica el movimiento de ${s.t} (se mueve por factores propios). Con eso su <b>β y su α son estadísticamente poco confiables</b> — no es un error del cálculo, es una acción de baja correlación con el mercado. El Investor Score lo sabe: amortigua su α para no premiar lo que en el fondo es ruido idiosincrático.`:""}`);
  return selbar+tiles+fTiles+`<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)">${scl}${corr}</div>`+mr+ph+interp;
}

// ===== CAPM / SML =====
function viewCAPM(){
  const bmax=Math.max(...STOCKS.map(s=>s.b))*1.18;
  // MODO VENTANA (< ~1 año): todo el gráfico y la tabla en términos de la VENTANA — retornos reales de la
  // ventana, SML prorrateada (Rf y prima llevados al lapso del análisis) y α de ventana. Nada anualizado.
  const W=winMode();
  const rf0=W?rfWin():RF, prima0=W?primaWin():PRIMA;
  const retOf=s=>W?s.a24.tot:s.a24.ret, erOf=s=>W?erWin(s.b):s.a24.er, alfaOf=s=>W?alphaWin(s):s.a24.jensen;
  const mktRet=W?MKT.tot:MKT.ret;
  // segunda SML con la prima REALIZADA de la ventana: contra la ex-ante el propio mercado sale con α≠0
  // (sesga todo a "subvalorada"); la realizada pasa por el mercado (α=0)
  const primaR=isFinite(mktRet)?(mktRet-rf0):prima0;
  const showR=Math.abs(primaR-prima0)>(W?Math.max(0.5,prima0*0.35):2);
  const yb=niceBounds([rf0,...STOCKS.map(retOf)].concat(showR?[rf0+bmax*primaR]:[]),0.14);
  const pts=STOCKS.map(s=>({x:s.b,y:retOf(s),c:s.c,label:s.t}));
  const line=[{x1:0,y1:rf0,x2:bmax,y2:rf0+bmax*prima0,c:indigo,dash:true}].concat(showR?[{x1:0,y1:rf0,x2:bmax,y2:rf0+bmax*primaR,c:muted,dash:true}]:[]);
  const smlLeg=showR?`<div class="legend"><span><span class="lgdot" style="background:${indigo}"></span>SML ex-ante (prima ${p0(prima0,W?2:1)})</span><span><span class="lgdot" style="background:${muted}"></span>SML realizada (prima ${p0(primaR,W?2:1)})</span></div>`:"";
  const chart=card("Security Market Line (SML)",(W?("En términos de la VENTANA de "+winLong()+" · "):"")+"Línea = retorno exigido por β · puntos sobre la línea batieron al CAPM (α+)",svgScatter({pts,lines:line,xmin:0,xmax:bmax,ymin:yb.min,ymax:yb.max,xlab:"β (riesgo sistemático)",ylab:W?("Retorno real "+winShort()+" (%)"):"Retorno real anual (%)",fx:v=>v.toFixed(2),fy:v=>v.toFixed(0)+"%",h:330}),smlLeg);
  const byJ=[...STOCKS].sort((a,b)=>alfaOf(b)-alfaOf(a));
  const aThr=W?Math.max(0.3,winYears()):1;   // mismo prorrateo del umbral ±1pp anual que en Detalle
  const rows=byJ.map(s=>{const al=alfaOf(s);const sg=al>aThr?"SUBVALORADA":al<-aThr?"SOBREVALORADA":"EQUILIBRIO",sc=al>aThr?green:al<-aThr?red:muted;
    return `<tr><td>${tk(s)}</td><td class="tnum num" style="color:${accentT};font-weight:700">${s.b.toFixed(2)}</td>
    <td class="tnum num" style="color:${indigo};font-weight:600">${p0(erOf(s),W?2:1)}</td><td class="num">${chip(retOf(s))}</td><td class="num">${chip(al)}</td><td>${badge(sg,sc)}</td></tr>`;}).join("");
  const heads=W?[["Acción",0],["β",1],["Exigido "+winShort(),1],["Real "+winShort(),1],["α ventana",1],["Señal",0]]:[["Acción",0],["β",1],["E(R) CAPM",1],["Retorno real",1],["α Jensen",1],["Señal",0]];
  const tbl=card("Valoración CAPM",(W?("Exigido y α prorrateados a la ventana de "+winLong()+" · "):"")+"E(R) exigido = Rf + β × prima · α = retorno real − exigido",{html:`<div class="tw"><table><thead><tr>${heads.map(([h,n])=>`<th class="${n?'num ':''}ntr">${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`,flush:true});
  const note=notecard(`La <b>SML</b> muestra el retorno que el CAPM exige según el β${W?(" — aquí <b>prorrateado a la ventana de "+winLong()+"</b> (Rf "+p0(rf0,2)+", prima "+p0(prima0,2)+"), sin anualizar"):" (Rf "+p0(RF)+", prima "+p0(PRIMA)+")"}. Un punto <b>sobre</b> la línea rindió más de lo exigido por su riesgo sistemático (α positivo); <b>bajo</b>, menos.`+(showR?` La línea <b>gris</b> usa la prima <b>realizada</b> de la ventana (mercado ${pc(mktRet)} − Rf = ${p0(primaR,2)}): contra ella el propio mercado queda en la línea (α=0), así que mide quién batió al mercado de verdad; la azul es el supuesto ex-ante.`:"")+(W?` Ventana corta: las señales son indicios, no veredictos.`:""));
  return chart+tbl+note;
}

/* ejecuta fn con el universo CANÓNICO del IPSA (DATA: 14 acciones con β, retornos y matriz de correlación),

   sin importar qué análisis esté seleccionado. Restaura los globales al terminar. */
function withCanonicalUniverse(fn){
  const sv={STOCKS,MKT,CORR,TICK,RF,PRIMA};
  try{STOCKS=DATA_UNIVERSE;MKT=DATA.market;CORR=DATA.corr;TICK=UNIVERSE_TICK;RF=DATA.rf;PRIMA=DATA.prima;return fn();}
  finally{STOCKS=sv.STOCKS;MKT=sv.MKT;CORR=sv.CORR;TICK=sv.TICK;RF=sv.RF;PRIMA=sv.PRIMA;}
}
/* pMetrics sobre el universo IPSA completo (30) MÁS sintéticos para los tickers de sel que no estén en él
   (p.ej. holdings de un análisis importado no-IPSA): así ningún peso se descarta del β/σ del portafolio.
   betaOf(t) permite entregar la β guardada del holding en vez de asumir 1. */
function pMetricsUniverse(sel,betaOf){
  const sv={STOCKS,MKT,CORR,TICK,RF,PRIMA};

    const extra=Object.keys(sel).filter(t=>!DATA_UNIVERSE.some(s=>s.t===t)).map(t=>{const b=(betaOf&&isFinite(betaOf(t)))?betaOf(t):1;
      return {t,n:t,s:"fuera del IPSA",c:"#1E5FD1",b,rets:[],prices:[],a24:{ret:0,sig:24,r2:0,corr:0,alphaR:0,jensen:0,sharpe:0,er:+(DATA.rf+b*DATA.prima).toFixed(2),tot:0}};});

function altWeights(list,profile){

  else if(profile==="riesgoso"){const r=list.map(s=>Math.max(2,s.a24.ret));const t=r.reduce((a,b)=>a+b,0);w=r.map(x=>x/t*100);}

  for(let it=0;it<4;it++){let ex=0,room=0;w=w.map(x=>{if(x>cap){ex+=x-cap;return cap;}return x;});w.forEach(x=>{if(x<cap)room+=cap-x;});if(ex<=0.01||room<=0)break;w=w.map(x=>x<cap?x+ex*((cap-x)/room):x);}

// ===== INVERSIÓN (bloqueado) =====
function applyScenario(id){const sc=SCEN.find(s=>s.id===id);if(!sc)return;simState.sel=Object.assign({},sc.sel);simState.amount=sc.amount;applyInvestment(sc.name);}
/* ¿el proyecto está "vacío" (recién creado, sin inversión definida)? */
function projIsEmpty(p){return !!p&&!(p.holdings&&p.holdings.length)&&!(p.weeks&&p.weeks.length);}
/* crea un PROYECTO vacío (sin inversión todavía); el usuario lo construye: análisis → simulación → invertir */
function projectCreate(name){
  const nm=(""+(name||"")).trim()||("Proyecto "+(PROJECTS.length+1));
  const proj={id:Date.now(),name:nm,date:new Date().toLocaleDateString("es-CL"),amount:0,bp:0,erCapm:0,sig:0,sharpe:0,corrAvg:0,bench:"IPSA",freq:"diario",holdings:[],weeks:[],links:{analyses:["demo"],scenarios:[],primary:"demo"}};
  PROJECTS.push(proj);activeId=proj.id;editIdx=null;saveProjects();syncProj();return proj;
}
function applyInvestment(defName,skipPrompt,canonical){
  const M=canonical?withCanonicalUniverse(simMetrics):simMetrics();
  if(!M.ws.length){alert("Selecciona acciones y define sus pesos antes de aplicar la inversión.");return;}
  if(!simState.amount||simState.amount<=0){alert("Ingresa el monto a invertir.");return;}
  const benchName=canonical?"IPSA":((typeof DATASET!=="undefined"&&DATASET==="import"&&typeof IMP!=="undefined"&&IMP&&IMP.bench)?IMP.bench.name:"IPSA");
  const anId=canonical?"demo":currentAnalysisId();
  const holdings=M.ws.map(x=>({t:x.s.t,n:x.s.n,s:x.s.s,c:x.s.c,b:x.s.b,w:x.w,monto:simState.amount*x.w}));
  const cur=curProj();
  // si el proyecto ACTIVO está vacío, se define SU inversión (no se crea otro) → todo se gestiona por proyecto
  if(projIsEmpty(cur)){
    if(defName&&(""+defName).trim())cur.name=(""+defName).trim();
    Object.assign(cur,{amount:simState.amount,bp:M.bp,erCapm:M.erCapm,sig:M.sig,sharpe:M.sharpe,corrAvg:M.corrAvg,bench:benchName,freq:cur.freq||"diario",origSim:{sel:Object.assign({},simState.sel),amount:simState.amount},holdings});
    if(!cur.links)cur.links={analyses:[anId],scenarios:[],primary:anId};
    try{const _sc=projDefaultScenario(cur);if(_sc){_sc.m.retH=M.retH;SCEN.push(_sc);cur.links.scenarios=[...new Set([...(cur.links.scenarios||[]),_sc.id])];lsSet("pf_scenarios_v1",SCEN);}}catch(e){}
    activeId=cur.id;editIdx=null;saveProjects();syncProj();modulo="inv";page="ingreso";render();return;
  }
  // si no hay proyecto vacío activo, se crea uno nuevo con la inversión
  let nm;
  if(skipPrompt){nm=defName;}
  else{nm=window.prompt("Nombre del proyecto de inversión:",defName||("Proyecto "+(PROJECTS.length+1)));if(nm===null)return;}
  const proj={id:Date.now(),name:(nm||("Proyecto "+(PROJECTS.length+1))).trim(),date:new Date().toLocaleDateString("es-CL"),amount:simState.amount,bp:M.bp,erCapm:M.erCapm,sig:M.sig,sharpe:M.sharpe,corrAvg:M.corrAvg,bench:benchName,
      freq:"diario",origSim:{sel:Object.assign({},simState.sel),amount:simState.amount},holdings,weeks:[],links:{analyses:[anId],scenarios:[],primary:anId}};
  try{const _sc=projDefaultScenario(proj);if(_sc){_sc.m.retH=M.retH;SCEN.push(_sc);proj.links.scenarios=[_sc.id];lsSet("pf_scenarios_v1",SCEN);}}catch(e){}
  PROJECTS.push(proj);activeId=proj.id;editIdx=null;saveProjects();syncProj();
  modulo="inv";page="ingreso";render();
}
// periodKey vive UNA sola vez, junto a resampleMap/periodIndex (misma convención UTC de semanas);
// una segunda copia aquí quedaba muerta por hoisting y era una trampa de mantención
function resampleWeeks(newFreq){
  if(WEEKS.length<=1)return 0;
  const last={};WEEKS.forEach((w,i)=>{if(i===0)return;last[periodKey(w.date,newFreq)]=i;});
  const keep=new Set([0]);WEEKS.forEach((w,i)=>{if(w.ev)keep.add(i);});
  Object.values(last).forEach(i=>keep.add(i));
  const idx=[...keep].sort((a,b)=>a-b);const removed=WEEKS.length-idx.length;
  const nw=idx.map(i=>WEEKS[i]);WEEKS.length=0;nw.forEach(w=>WEEKS.push(w));
  return removed;
}
function changeFreq(nf){
  const p=curProj();if(!p||p.freq===nf)return;
  const ord={diario:0,semanal:1,mensual:2},coarser=ord[nf]>ord[p.freq];
  const um={semanal:"semana",mensual:"mes",diario:"día"}[nf];
  const msg=coarser?("Cambiar a "+nf.toUpperCase()+" reorganizará tus registros: se conserva el ÚLTIMO registro de cada "+um+" (más los eventos de inyección/rebalanceo) y se eliminan los intermedios. El valor y la rentabilidad se mantienen. ¿Continuar?"):("Cambiar la periodicidad a "+nf.toUpperCase()+". Se conservan todos los registros; solo cambian las etiquetas y la anualización de riesgo. ¿Continuar?");
  if(!window.confirm(msg))return;
  if(coarser){
    if(WEEKS.length>1&&window.confirm("¿Descargar el respaldo Excel con tus datos actuales antes de reorganizar? (Esto es irreversible.)\n\nAceptar = descargar respaldo y luego reorganizar\nCancelar = reorganizar sin respaldo")){exportInvCSV();}
    resampleWeeks(nf);
  }
  p.freq=nf;editIdx=null;saveProjects();render();
}
function buildDemo(cfg){
  const hold=cfg.pick.map(t=>STOCKS.find(s=>s.t===t)).filter(Boolean);
  if(hold.length<2)return null;
  const w=cfg.w.slice(0,hold.length),ws=w.reduce((a,b)=>a+b,0);const wn=w.map(x=>x/ws);
  const holdings=hold.map((s,i)=>({t:s.t,n:s.n,s:s.s,c:s.c,b:s.b,w:wn[i],monto:+(cfg.amount*wn[i]).toFixed(0)}));
  const bp=holdings.reduce((a,hh,i)=>a+hh.w*hold[i].b,0);
  const retH=holdings.reduce((a,hh,i)=>a+hh.w*hold[i].a24.ret,0);
  const sig=holdings.reduce((a,hh,i)=>a+hh.w*hold[i].a24.sig,0);
  const erCapm=RF+bp*PRIMA,sharpe=(retH-RF)/sig,corrAvg=0.4;
  let s=cfg.seed;const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff-0.5;};
  const N=cfg.n,weeks=[],px={};hold.forEach(hh=>px[hh.t]=hh.prices[hh.prices.length-1]);let ipsa=10788.19;
  const stepDays=cfg.freq==="semanal"?7:cfg.freq==="mensual"?30:1;
  const start=new Date();start.setDate(start.getDate()-(N-1)*stepDays);
  for(let i=0;i<N;i++){const d=new Date(start);d.setDate(start.getDate()+i*stepDays);
    const prices={};hold.forEach(hh=>prices[hh.t]=+px[hh.t].toFixed(2));
    weeks.push({date:d.toISOString().slice(0,10),ipsa:+ipsa.toFixed(2),prices});
    const mkt=rnd()*cfg.vol*2+cfg.drift;ipsa*=(1+mkt);hold.forEach(hh=>{px[hh.t]=px[hh.t]*(1+hh.b*mkt+rnd()*cfg.vol);});}
  const oSel={};holdings.forEach(hd=>{oSel[hd.t]=+(hd.w*100).toFixed(1);});
  return {id:Date.now()+Math.floor(Math.random()*100000),name:cfg.name,date:new Date().toLocaleDateString("es-CL"),amount:cfg.amount,bp,erCapm,sig,sharpe,corrAvg,freq:cfg.freq,origSim:{sel:oSel,amount:cfg.amount},holdings,weeks};
}
function seedDemos(){
  const cfgs=[
    {name:"Demo diario · agresivo",pick:["BCI","SQM-B","PARAUCO"],w:[0.4,0.3,0.3],amount:3000000,freq:"diario",n:30,seed:99173,drift:0.0022,vol:0.014},
    {name:"Demo semanal · balanceado",pick:["CHILE","FALABELLA","ENELCHILE","LATAM"],w:[0.3,0.25,0.25,0.2],amount:8000000,freq:"semanal",n:24,seed:50021,drift:0.0035,vol:0.022},
    {name:"Demo mensual · gran capital",pick:["CHILE","BCI","ENELCHILE","SANTANDER","FALABELLA"],w:[0.25,0.2,0.2,0.2,0.15],amount:50000000,freq:"mensual",n:18,seed:71449,drift:0.007,vol:0.028}
  ];
  let last=null,added=0;
  cfgs.forEach(cfg=>{if(PROJECTS.some(p=>p.name===cfg.name))return;const pr=buildDemo(cfg);if(pr){PROJECTS.push(pr);last=pr.id;added++;}});
  if(last){activeId=last;}

  if(!added)window.alert("Los proyectos de prueba ya existen.");
  modulo="inv";page="seguimiento";render();
}
function invMetrics(){
  if(!PF||!WEEKS.length)return null;
  const base=WEEKS[0],sh={},cost={},b0={};PF.holdings.forEach(hd=>{let bp=base.prices[hd.t];if(bp==null){const fw=WEEKS.find(w=>w.prices[hd.t]!=null);bp=fw?fw.prices[hd.t]:0;}b0[hd.t]=bp||1;const inB=base.prices[hd.t]!=null;if(base.qty&&base.qty[hd.t]!=null){sh[hd.t]=base.qty[hd.t];cost[hd.t]=base.qty[hd.t]*(base.prices[hd.t]||b0[hd.t]);}else{sh[hd.t]=inB?hd.monto/base.prices[hd.t]:0;cost[hd.t]=inB?hd.monto:0;}});
  const t0=new Date(base.date).getTime();
  const addD=(WEEKS.length>1&&WEEKS[1].date===WEEKS[0].date)?864e5:0;

      else if(w.ev.kind==="trade"){const tt=w.ev.t,qy=+w.ev.shares||0,pp=+w.ev.price||(w.prices[tt]||base.prices[tt]||1);if(w.ev.side==="sell"){const old=sh[tt]||0,sold=Math.min(qy,old);cost[tt]=(cost[tt]||0)*(old>0?(old-sold)/old:0);sh[tt]=old-sold;inflow=-(sold*pp);aport+=inflow;}else{sh[tt]=(sh[tt]||0)+qy;cost[tt]=(cost[tt]||0)+qy*pp;inflow=qy*pp;aport+=inflow;}}
    }

    if(i>0&&prevVal>0){const r=(val-inflow)/prevVal-1;twr*=(1+r);pr.push(r);mr.push(w.ipsa/WEEKS[i-1].ipsa-1);}
    prevVal=val;

  const stockSeries=PF.holdings.map(hd=>({label:hd.t,c:hd.c,vals:WEEKS.map(w=>+(100*((w.prices[hd.t]||b0[hd.t])/b0[hd.t])).toFixed(2))}));
  const lastW=WEEKS[WEEKS.length-1],prevW=WEEKS.length>=2?WEEKS[WEEKS.length-2]:null,last=series[series.length-1];
  const perStock=PF.holdings.map(hd=>{const cur=lastW.prices[hd.t]||b0[hd.t],shx=sh[hd.t]||0,v=shx*cur,pp=prevW?(prevW.prices[hd.t]||b0[hd.t]):null,gain=v-(cost[hd.t]||0);return {hd,sh:shx,buy:b0[hd.t],cur,val:v,ret:cur/b0[hd.t]-1,dayRet:pp?cur/pp-1:null,gain,contribCum:gain/aport,cost:cost[hd.t]||0};});
  let betaR=null,corrR=null;
  if(pr.length>=4){const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,mp=mean(pr),mm=mean(mr);let cov=0,vm=0,vp=0;
    for(let i=0;i<pr.length;i++){cov+=(pr[i]-mp)*(mr[i]-mm);vm+=(mr[i]-mm)**2;vp+=(pr[i]-mp)**2;}

  const L0=series.length>=2?series[series.length-2]:null,lastInflow=last.inflow||0;

  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

  const elapsedDays=Math.round(elapsedYrs*365.25);

}

  const allocBody=`<div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center"><div style="text-align:center;flex-shrink:0">${svgDonut(allocItems)}<div class="legend" style="justify-content:center;max-width:210px;margin:8px auto 0">${allocLeg}</div></div><div style="flex:1;min-width:300px"><div class="tw"><table><thead><tr><th>Acción</th><th class="r">Objetivo</th><th class="r">Actual</th><th class="r">Drift</th><th class="r">Valor</th></tr></thead><tbody>${driftRows}</tbody></table></div></div></div><div class="note" style="margin-top:12px">El <b>drift</b> es cuánto se desvió el peso actual de cada acción respecto a su objetivo de compra (por subir o bajar de precio). ${mxs?("La de mayor desviación es <b style='color:"+mxs.hd.c+"'>"+mxs.hd.t+"</b> ("+((mxs.val/L.val-mxs.hd.w)*100>=0?"+":"")+((mxs.val/L.val-mxs.hd.w)*100).toFixed(1)+" pp). "):""}Si el drift crece mucho, considera rebalancear para volver a tu asignación objetivo.</div>`;

  const invTools=`<div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap"><button class="btn" id="geninforme">📄 Generar informe</button><button class="btn" id="genxls">📊 Generar Excel</button></div>`;
  const b0q=WEEKS[0];
  const deltaCard=b0q.qty?card("Inversión inicial: real vs objetivo","Acciones compradas y monto real por acción frente al objetivo de la simulación",{html:`<div class="tw"><table><thead><tr><th>Acción</th><th class="r">Acciones</th><th class="r">Precio compra</th><th class="r">Objetivo</th><th class="r">Real</th><th class="r">Δ</th></tr></thead><tbody>`+PF.holdings.map(hd=>{const q=b0q.qty[hd.t]||0,p=b0q.prices[hd.t]||0,real=q*p,obj=PF.amount*hd.w,d=real-obj;return `<tr><td>${tk(hd)}</td><td class="r">${q.toLocaleString("es-CL")}</td><td class="r">${fmtP(p)}</td><td class="r">${fmtCLP(obj)}</td><td class="r" style="font-weight:700">${fmtCLP(real)}</td><td class="r" style="color:${Math.abs(d)<1?muted:(d>=0?green:red)}">${(d>=0?"+":"−")+fmtCLP(Math.abs(d))}</td></tr>`;}).join("")+`<tr style="background:var(--soft);font-weight:800"><td>Total invertido</td><td></td><td></td><td class="r">${fmtCLP(PF.amount)}</td><td class="r">${fmtCLP(IM.series[0].val)}</td><td class="r" style="color:${(IM.series[0].val-PF.amount)>=0?green:red}">${((IM.series[0].val-PF.amount)>=0?"+":"−")+fmtCLP(Math.abs(IM.series[0].val-PF.amount))}</td></tr></tbody></table><div class="note" style="margin-top:11px">Por el precio entero de las acciones, invertiste <b>${fmtCLP(IM.series[0].val)}</b> vs el objetivo de <b>${fmtCLP(PF.amount)}</b> → delta <b style="color:${(IM.series[0].val-PF.amount)>=0?green:red}">${((IM.series[0].val-PF.amount)>=0?"+":"−")+fmtCLP(Math.abs(IM.series[0].val-PF.amount))}</b> (${((IM.series[0].val-PF.amount)/PF.amount*100).toFixed(1)}%). El seguimiento usa las acciones y montos realmente comprados.</div></div>`,flush:true}):"";
  if(histPg) return projbar+summary+invTools+tbl;
  if(!seg){
    if(isFirst||editing) return projbar+summary+freqBar+form;
    const opHint=card("Gestiona esta inversión","Esta cartera ya existe. Para <b>comprar, vender o inyectar capital</b>, ve a Operar. Para crear <b>otra inversión nueva</b>, ve a Proyectos.",

    return projbar+summary+invDetailCard()+opHint;
  }
  return projbar+invTools+hero+summary+valChart+psTbl+allocCard+stkChart+evoChart+ipsaTiles+verdict+capmKp+capmChart+capmNote+riskCard+qualityCard;
}

  // Sección 11: rentabilidad diaria por acción
  const dpStk=IM.stockSeries;
  const dpDates=IM.series.map(s=>s.date);
  const dpHead=`<tr><th>Fecha</th>${dpStk.map(s=>`<th class="r"><span class="dot" style="background:${s.c}"></span>${s.label}</th>`).join("")}<th class="r">IPSA</th></tr>`;
  const dpRows=dpDates.map((d,i)=>{
    if(i===0)return `<tr><td>${d} <span style="color:#8DA1C2">(compra)</span></td>${dpStk.map(()=>'<td class="r" style="color:#8DA1C2">\u2014</td>').join("")}<td class="r" style="color:#8DA1C2">\u2014</td></tr>`;
    const cells=dpStk.map(s=>{const r=(s.vals[i-1]>0)?(s.vals[i]/s.vals[i-1]-1):null;return `<td class="r" style="color:${r==null?'#8DA1C2':(r>=0?pos:neg)}">${r==null?'\u2014':sg(r*100)}</td>`;}).join("");
    const ir=(1+IM.series[i].ipsaRet)/(1+IM.series[i-1].ipsaRet)-1;
    return `<tr><td>${d}</td>${cells}<td class="r" style="color:${ir>=0?pos:neg}">${sg(ir*100)}</td></tr>`;

  const dpFoot=`<tr style="font-weight:800;background:#EEF3FB"><td>Acumulado</td>${dpStk.map(s=>{const r=(s.vals[0]>0)?(s.vals[s.vals.length-1]/s.vals[0]-1):null;return `<td class="r" style="color:${r==null?'#8DA1C2':(r>=0?pos:neg)}">${r==null?'\u2014':sg(r*100)}</td>`;}).join("")}<td class="r" style="color:${L.ipsaRet>=0?pos:neg}">${sg(L.ipsaRet*100)}</td></tr>`;
  const verdict=L.diff>=0?`<b style="color:${pos}">supera al mercado por ${Math.abs(L.diff*100).toFixed(2)} pts</b>`:`<b style="color:${neg}">va bajo el mercado por ${Math.abs(L.diff*100).toFixed(2)} pts</b>`;
  const html=`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Informe de seguimiento · ${PF.name}</title><style>
    *{box-sizing:border-box;}body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;color:#1B2A4A;margin:0;font-size:12px;line-height:1.45;}

    table{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;} th{background:#EEF3FB;text-align:left;padding:7px 9px;font-size:8.5px;text-transform:uppercase;color:#52668A;letter-spacing:.4px;border-bottom:1.5px solid #CCDBEE;} td{padding:6px 9px;border-bottom:1px solid #F0F4FA;} td.r,th.r{text-align:right;} tbody tr:nth-child(even){background:#FBFCFE;}

    @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;} h2{page-break-after:avoid;} table,.kgrid,.kpi,.note,.two{page-break-inside:avoid;}}
  </style></head><body>
  <div class="band"><div class="logo">📈</div><div><h1>Informe de seguimiento de inversión</h1><div class="s">${PF.name} · ${fch} · invertido hace ${days} días (${wks} sem · ${mos} meses) desde ${WEEKS[0].date}</div></div>
    <div style="margin-left:auto;text-align:right"><div style="font-size:9px;opacity:.75;text-transform:uppercase;letter-spacing:.8px;font-weight:700">Valor actual</div><div style="font-size:26px;font-weight:800;letter-spacing:-.5px">${fmtCLP(L.val)}</div><div style="font-size:11.5px;font-weight:700;color:${gain>=0?'#9FE8C4':'#FFB3B3'}">${(gain>=0?"+":"−")+fmtCLP(Math.abs(gain))} (${sg(L.ret*100)})</div></div></div>

  <div class="page">
    <h2><span class="sn">1</span>Resumen ejecutivo</h2>

      ${kpi("Retorno (TWR)",sg(L.ret*100),cc(L.ret*100),"time-weighted")}
      ${kpi("Retorno IPSA",sg(L.ipsaRet*100),cc(L.ipsaRet*100),"mismo período")}
      ${kpi("Diferencia vs IPSA",sg1(L.diff*100)+" pts",cc(L.diff*100),L.diff>=0?"sobre el mercado":"bajo el mercado")}
      ${kpi("β esperado / realizado",PF.bp.toFixed(2)+" / "+(IM.betaR!=null?IM.betaR.toFixed(2):"—"),null,"sensibilidad al IPSA")}
    </div>
    <div class="note">Tu portafolio rinde <b style="color:${cc(L.ret*100)}">${sg(L.ret*100)}</b> (TWR) vs el IPSA <b style="color:${cc(L.ipsaRet*100)}">${sg(L.ipsaRet*100)}</b> → ${verdict} en estos ${days} días. Ganancia neta de ${(gain>=0?"+":"−")+fmtCLP(Math.abs(gain))} sobre un capital aportado de ${fmtCLP(IM.aport)}.</div>

    ${compNote}
    <h2><span class="sn">4</span>Asignación actual vs objetivo</h2>
    <div class="two"><div style="text-align:center">${donut}<div style="margin-top:8px;max-width:210px">${dleg}</div></div>
      <div class="col"><table><thead><tr><th>Acción</th><th class="r">Objetivo</th><th class="r">Actual</th><th class="r">Drift</th></tr></thead><tbody>${wRows}</tbody></table><div class="note" style="margin-top:10px">El <b>drift</b> es la desviación del peso actual respecto al objetivo definido en la simulación. Drifts persistentes sobre ±5 pp suelen gatillar un rebalanceo.</div></div></div>
    <h2><span class="sn">5</span>Crecimiento por acción (base 100)</h2>${stkChart}<div class="lgrow">${IM.stockSeries.map(s=>`<span class="lg"><span class="d" style="background:${s.c}"></span>${s.label}</span>`).join("")}</div>
    <h2><span class="sn">6</span>Portafolio vs IPSA (base 100)</h2>${evoChart}<div class="lgrow"><span class="lg"><span class="d" style="background:#1E5FD1"></span>Portafolio</span><span class="lg"><span class="d" style="background:#475569"></span>IPSA</span></div>
    <h2><span class="sn">7</span>Análisis CAPM</h2>
    <div class="kgrid" style="grid-template-columns:repeat(4,1fr)">
      ${kpi("Retorno real",sg(L.ret*100),cc(L.ret*100))}
      ${kpi("Exigido CAPM",sg(reqRet*100),'#1E5FD1',"prorrateado")}
      ${kpi("Alpha realizado",sg(alpha*100),cc(alpha*100),alpha>=0?"sobre lo exigido":"bajo lo exigido")}
      ${kpi("β realizado",IM.betaR!=null?IM.betaR.toFixed(2):"—",null,"esperado "+PF.bp.toFixed(2))}
    </div>
    <div style="margin-top:12px">${capmChart}</div><div class="lgrow"><span class="lg"><span class="d" style="background:#1E5FD1"></span>Valor real</span><span class="lg"><span class="d" style="background:#0E8C5E"></span>Esperado CAPM (${PF.erCapm.toFixed(2)}% anual)</span></div>
    <h2><span class="sn">8</span>Riesgo: VaR vs pérdida real</h2>
    <div class="two" style="align-items:flex-start"><div class="col"><table><thead><tr><th>Horizonte</th><th class="r">VaR 95%</th><th class="r">Pérdida máx (VaR)</th><th class="r">Peor real (CLP)</th></tr></thead><tbody>${varRows}</tbody></table><div class="note" style="margin-top:10px">El <b>VaR 95%</b> es la pérdida máxima esperada en condiciones normales (salvo 1 de cada 20 períodos). Es paramétrico (asume normalidad) y subestima eventos extremos.</div></div>
    <div class="col"><div class="kgrid" style="grid-template-columns:repeat(2,1fr)">${kpi("Peor "+fr.u+" real",IM.worstRet!=null?sg(IM.worstRet*100):"—",IM.worstRet!=null?cc(IM.worstRet*100):'#52668A',IM.worstLossCLP!=null?fmtCLP(IM.worstLossCLP):"")}${kpi("Máximo drawdown",IM.maxDDCLP?fmtCLP(IM.maxDDCLP):sg(IM.maxDD*100),neg,sg(IM.maxDD*100)+" desde un máximo")}${kpi("Volatilidad realizada",IM.realizedVol!=null?IM.realizedVol.toFixed(1)+"%":"—",null,"esperada σ "+PF.sig.toFixed(1)+"%")}${kpi("Mejor / peor "+fr.u,(IM.bestRet!=null?`<span style="color:${cc(IM.bestRet*100)}">${sg(IM.bestRet*100)}</span>`:"—")+" / "+(IM.worstRet!=null?`<span style="color:${cc(IM.worstRet*100)}">${sg(IM.worstRet*100)}</span>`:"—"),null,"rango por período")}</div></div></div>
    <h2><span class="sn">9</span>Calidad del desempeño</h2>
    <div class="kgrid" style="grid-template-columns:repeat(3,1fr)">
      ${kpi("Retorno anualizado (CAGR)",cagrOk?sg(IM.cagr*100):"—",cagrOk?cc(IM.cagr*100):'#52668A',cagrOk?"ritmo anual equivalente":"se reporta desde los 60 días")}
      ${kpi("Sharpe realizado",IM.sharpeR!=null?IM.sharpeR.toFixed(2):"—",IM.sharpeR!=null?(IM.sharpeR>=0?pos:neg):'#52668A',"retorno por unidad de riesgo")}
      ${kpi("Tracking error",IM.trackingError!=null?IM.trackingError.toFixed(1)+"%":"—",null,"desvío anual vs IPSA")}
      ${kpi("Information ratio",IM.infoRatio!=null?IM.infoRatio.toFixed(2):"—",IM.infoRatio!=null?cc(IM.infoRatio):'#52668A',"retorno activo / tracking error")}
      ${kpi("Aciertos vs IPSA",IM.winRate!=null?IM.winRate.toFixed(0)+"%":"—",null,"% de períodos sobre el mercado")}
      ${kpi("Observaciones",String(IM.nret),null,"retornos registrados")}
    </div>
    <div class="note"><b>Lectura.</b> El <b>Sharpe realizado</b> mide el retorno ajustado por la volatilidad efectiva (anualizado por días bursátiles). El <b>information ratio</b> es el retorno extra sobre el IPSA por unidad de riesgo activo (sobre 0,5 se considera bueno). Con pocas observaciones estas métricas son ruidosas; ganan validez estadística desde ~20 retornos.</div>
    <h2><span class="sn">10</span>Historial de seguimiento (${WEEKS.length} registros)</h2>
    <table><thead><tr><th>Registro</th><th>Fecha</th><th class="r">Valor</th><th class="r">Δ ${fr.u} Port.</th><th class="r">Δ ${fr.u} IPSA</th><th class="r">Ret. acum.</th><th class="r">IPSA acum.</th><th class="r">Dif. acum.</th><th class="r">Aporte</th></tr></thead><tbody>${hist}</tbody></table>
        <h2><span class="sn">11</span>Rentabilidad diaria por acción (${dpDates.length} registros)</h2>
    <table><thead>${dpHead}</thead><tbody>${dpRows}</tbody><tfoot>${dpFoot}</tfoot></table>
    <div class="note">Variación porcentual del precio de cierre de cada acción respecto al cierre anterior. La columna <b>IPSA</b> es la variación diaria del índice (referencia). La fila <b>Acumulado</b> es el retorno total de cada acción desde la compra (${WEEKS[0].date}).</div>
    <div class="foot"><b>Metodología y supuestos.</b> Rentabilidad time-weighted (TWR), que aísla el efecto de aportes y rebalanceos. Ganancia = valor actual − capital aportado total (los aportes no cuentan como rentabilidad). El tiempo invertido cuenta días calendario (la compra intradía suma el día del primer cierre); la volatilidad y el Sharpe se anualizan por días bursátiles (√252 diario, √52 semanal, √12 mensual). CAPM con benchmark IPSA: Rf ${RF}%, prima ${PRIMA}%, β del portafolio ${PF.bp.toFixed(2)}; retorno exigido prorrateado al período transcurrido. VaR 95% paramétrico (μ − 1,645·σ), asume normalidad y subestima los eventos extremos. β realizado, tracking error e information ratio se estiman contra los retornos del IPSA en el mismo período. El CAGR se reporta solo con ≥60 días para evitar extrapolaciones irreales. Informe generado el ${fch} por el Gestor de Portafolio. Documento informativo; no constituye recomendación ni asesoría de inversión.</div>
  </div>
  \x3cscript>window.onload=function(){setTimeout(function(){window.print();},350);};\x3c/script>
  </body></html>`;
  const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();}else window.alert("Habilita las ventanas emergentes para ver el informe.");
}

function attachInv(){
  if(modulo!=="inv")return;
  document.querySelectorAll("[data-stksel]").forEach(b=>b.onclick=()=>{const _mn=document.getElementById("main"),_st=_mn?_mn.scrollTop:0;invStkSel=b.dataset.stksel||null;render();const _mn2=document.getElementById("main");if(_mn2)_mn2.scrollTop=_st;});
  const ld=document.getElementById("loaddemo");if(ld)ld.onclick=seedDemos;
  document.querySelectorAll("[data-pstep]").forEach(b=>b.onclick=()=>{const[m,pg]=b.dataset.pstep.split("|");modulo=m;page=pg;render();});
  const _pdi=document.getElementById("projDefineInv");if(_pdi)_pdi.onclick=()=>{const p=curProj();invNew={name:(p&&p.name)||"",amount:"",sel:{}};render();};
  attachInvNew();   // handlers del formulario de inversión cuando está abierto en el módulo Inversión
  const be=document.getElementById("bkpexport");if(be)be.onclick=exportBackup;
  const bim=document.getElementById("bkpimport"),bf=document.getElementById("bkpfile");if(bim&&bf){bim.onclick=()=>bf.click();bf.onchange=ev=>{if(ev.target.files[0])importBackup(ev.target.files[0]);};}
  document.querySelectorAll("[data-setfreq]").forEach(b=>b.onclick=()=>changeFreq(b.dataset.setfreq));
  const _cm=(WEEKS.length===0||editIdx===0);if(_cm){const _upd=()=>{const pv=document.getElementById("compraprev");if(pv)pv.innerHTML=compraPreview();};document.querySelectorAll(".pinp,.qinp").forEach(i=>i.oninput=_upd);_upd();}
  const sv=document.getElementById("savew");
  if(sv)sv.onclick=()=>{
    const compraMode=(WEEKS.length===0||editIdx===0);
    const prices={};let ok=true,qty=null;
    if(compraMode){qty={};PF.holdings.forEach(hd=>{const pe=document.querySelector('.pinp[data-pt="'+hd.t+'"]'),qe=document.querySelector('.qinp[data-qt="'+hd.t+'"]');const p=pe?parseFloat(pe.value):NaN,q=qe?parseFloat(qe.value):NaN;if(!p||p<=0||!q||q<=0)ok=false;else{qty[hd.t]=q;prices[hd.t]=p;}});}
    else{PF.holdings.forEach(hd=>{const el=document.querySelector('.pinp[data-pt="'+hd.t+'"]');const v=el?parseFloat(el.value):NaN;if(!v||v<=0)ok=false;else prices[hd.t]=v;});}
    const ipEl=document.getElementById("wipsa"),ipsa=ipEl?parseFloat(ipEl.value):NaN;
    const dEl=document.getElementById("wdate"),date=dEl&&dEl.value?dEl.value:localDay();
    if(!ok||!ipsa||ipsa<=0){alert(compraMode?"Ingresa el precio de compra y la cantidad de acciones de cada papel, y el IPSA, con números válidos.":"Ingresa todos los precios de cierre y el valor del IPSA con números válidos.");return;}
    if(!weekendGuard(date))return;
    const rec={date,prices,ipsa};if(qty)rec.qty=qty;
    const wasCompra=(editIdx===0||WEEKS.length===0);
    // editar un registro que fue una OPERACIÓN (aporte/compra/venta/rebalanceo) conserva la operación:
    // si se perdiera el campo ev, sus acciones y su flujo de caja desaparecerían del TWR y del libro
    if(editIdx!=null&&WEEKS[editIdx]&&WEEKS[editIdx].ev)rec.ev=WEEKS[editIdx].ev;
    if(editIdx!=null){WEEKS[editIdx]=rec;editIdx=null;}else{WEEKS.push(rec);}
    // la ponderación ejecutada (acciones enteras a precio de mercado) no calza exacto con la simulada:
    // al registrar/editar la COMPRA, la simulación del proyecto pasa a reflejar los pesos REALES.
    if(wasCompra&&qty){try{projSyncReal(PF);}catch(e){}}
    saveProjects();render();
  };
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editIdx=+b.dataset.edit;page="ingreso";render();});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=+b.dataset.del;const _ev=WEEKS[i]&&WEEKS[i].ev;const _msg=_ev?("⚠ Este registro es una OPERACIÓN ("+(_ev.kind==="inject"?"aporte de capital":_ev.kind==="trade"?(_ev.side==="sell"?"venta":"compra"):"rebalanceo")+"): eliminarlo también elimina la operación (acciones y flujo de caja) del seguimiento y la contabilidad.\n\n¿Eliminar de todas formas?"):"¿Eliminar este registro diario?";if(window.confirm(_msg)){WEEKS.splice(i,1);if(editIdx===i)editIdx=null;else if(editIdx!=null&&editIdx>i)editIdx--;saveProjects();render();}});
  document.querySelectorAll("[data-godatos]").forEach(b=>b.onclick=()=>{modulo="datos";page=b.dataset.godatos;render();});
  document.querySelectorAll("[data-invtab]").forEach(b=>b.onclick=()=>{page=b.dataset.invtab;render();});
  document.querySelectorAll("[data-gomod]").forEach(b=>b.onclick=()=>{modulo=b.dataset.gomod;if(modulo==="proyectos")page="hub";render();});
  document.querySelectorAll("[data-projsel]").forEach(b=>b.onclick=()=>{activeId=+b.dataset.projsel;editIdx=null;saveProjects();render();});

/* ── TABLAS ORDENABLES: clic en cualquier encabezado ordena por esa columna (asc ⇄ desc) ──
   Universal: se engancha a TODAS las tablas renderizadas. Entiende números en ambos formatos que
   conviven en la app (es-CL "10.821,14" y técnico "1.12"), %, $, × y signos; el texto ordena alfabético.
   Las filas "Total" quedan siempre al final. El orden es visual (el DOM se reordena con sus listeners). */
function tableSortNum(raw){
  let s=(""+(raw||"")).trim().replace(/[−–]/g,"-").replace(/[$%×\s]/g,"");
  if(s===""||s==="—")return null;
  if(s.includes(".")&&s.includes(",")){s=s.replace(/\./g,"").replace(",",".");}          // 10.821,14 → 10821.14
  else if(s.includes(",")){s=s.replace(",",".");}                                        // 4,45 → 4.45
  else if(/^[+-]?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,"");}                    // 1.000.000 → 1000000 (grupos de miles)
  const v=parseFloat(s);return isFinite(v)?v:null;
}
function tableSortVal(td){
  if(!td)return {t:""};
  const raw=(td.textContent||"").trim();
  const n=tableSortNum(raw);
  if(n!=null)return {n};
  const m=raw.match(/[+-−]?[\d.,]+/);if(m){const x=tableSortNum(m[0]);if(x!=null)return {n:x};}   // celdas mixtas: primer número
  return {t:raw.toLowerCase()};
}
function attachTableSort(){
  document.querySelectorAll("#main table").forEach(tb=>{
    const thead=tb.tHead||tb.querySelector("thead");if(!thead||!tb.tBodies.length)return;
    [...thead.querySelectorAll("th")].forEach((th,ci)=>{
      if(th._srt)return;th._srt=1;
      th.addEventListener("click",e=>{
        if(e.target.closest("button,input,select,a"))return;   // no interferir con controles del encabezado
        const body=tb.tBodies[0];if(!body)return;
        const rows=[...body.rows];
        const data=rows.filter(r=>!/^\s*total\b/i.test((r.cells[0]&&r.cells[0].textContent)||""));
        const foot=rows.filter(r=>data.indexOf(r)<0);
        const dir=th._dir==="asc"?"desc":"asc";
        [...thead.querySelectorAll("th")].forEach(x=>{if(x!==th){x._dir=null;x.classList.remove("srt-asc","srt-desc");}});
        th._dir=dir;th.classList.toggle("srt-asc",dir==="asc");th.classList.toggle("srt-desc",dir==="desc");
        data.sort((a,b)=>{
          const va=tableSortVal(a.cells[ci]),vb=tableSortVal(b.cells[ci]);
          let c;
          if(va.n!=null&&vb.n!=null)c=va.n-vb.n;
          else if(va.n!=null)c=-1;else if(vb.n!=null)c=1;
          else c=va.t<vb.t?-1:va.t>vb.t?1:0;
          return dir==="asc"?c:-c;
        });
        data.forEach(r=>body.appendChild(r));
        foot.forEach(r=>body.appendChild(r));   // el Total siempre al final
      });
    });
  });
}

  {key:"quality",name:"Quality (QMJ)",cat:"Fundamental",desc:"Rentable (ROE, margen), poco apalancada y con crecimiento. Calidad sobre basura."},
  {key:"size",name:"Size (SMB)",cat:"Fundamental",desc:"Menor capitalización → premio small-cap por mayor riesgo/iliquidez."},
  {key:"yield",name:"Dividend Yield",cat:"Fundamental",desc:"Mayor rendimiento por dividendo: carry/income y disciplina de caja."}
];

function clampz(z,c){c=c||2.5;return Math.max(-c,Math.min(c,z));}
/* ¿hay fundamentos REALES cargados (pipeline)? Si los hay, el análisis del usuario NO debe usar el
   dataset ilustrativo estático para NADA: un dato que falta queda NEUTRO, no inventado. */
function hasRealFund(){try{return !!(typeof FDATA!=="undefined"&&FDATA&&FDATA.byTicker&&Object.keys(FDATA.byTicker).length);}catch(e){return false;}}
/* fundamentos por acción para el MULTIFACTOR. Con datos reales cargados: SOLO los reales (los campos que
   Yahoo no entrega quedan null → neutros en el z-score, nunca un default arbitrario que sesgue el ranking).
   Sin fundamentos reales (modo demo): el dataset ilustrativo estático, solo para que el demo no quede vacío.
   La capitalización real (CLP) se lleva a MM USD (dólar de mindicador, fallback 950). */
function mfFund(t){
  if(!hasRealFund())return FUND[t]||{};   // demo/sin pipeline: dataset ilustrativo (no hay nada real que usar)
  let f=null;try{f=fundGet(t);}catch(e){}
  if(!f)return {};   // acción real SIN fundamentos: todo neutro (jamás valores inventados del estático)
  const dolar=(typeof MIND!=="undefined"&&MIND&&MIND.dolar&&isFinite(+MIND.dolar.valor)&&+MIND.dolar.valor>0)?+MIND.dolar.valor:950;
  const o={};
  ["pb","pe","dy","roe","nm","de","eg"].forEach(k=>{if(f[k]!=null)o[k]=f[k];});
  if(f.mcap!=null)o.mcap=f.mcap/1e6/dolar;
  return o;
}
/* z-score robusto a faltantes: la media y la desviación se calculan SOLO con los valores presentes;
   un valor null queda null (neutro), nunca se le inventa un número que lo mueva en el ranking. */
function zscoresNull(a){const v=a.filter(x=>x!=null&&isFinite(x));if(v.length<2)return a.map(()=>null);const m=v.reduce((x,y)=>x+y,0)/v.length;const sd=Math.sqrt(v.reduce((x,y)=>x+(y-m)**2,0)/v.length)||1;return a.map(x=>(x!=null&&isFinite(x))?(x-m)/sd:null);}
function computeFactors(list){
  // De PRECIOS (siempre reales) vs FUNDAMENTALES (solo cuentan si Yahoo entregó el dato; si no → neutro).
  const raw={mom:[],sig:[],idio:[],lnmc:[],pb:[],pe:[],roe:[],nm:[],de:[],eg:[],dy:[]};
  list.forEach(s=>{
    const f=mfFund(s.t),p=s.prices,n=p.length;
    const mom=(n>=14)?(p[n-2]/p[n-14]-1)*100:(p[n-1]/p[0]-1)*100;
    raw.mom.push(mom);
    raw.sig.push(s.a24.sig);
    raw.idio.push(s.a24.sig*Math.sqrt(Math.max(0,1-s.a24.r2)));
    raw.lnmc.push(f.mcap!=null?Math.log(f.mcap):null);
    raw.pb.push(f.pb!=null?f.pb:null); raw.pe.push(f.pe!=null?f.pe:null);
    raw.roe.push(f.roe!=null?f.roe:null); raw.nm.push(f.nm!=null?f.nm:null);
    raw.de.push(f.de!=null?(f.de/(1+f.de)):null); raw.eg.push(f.eg!=null?f.eg:null); raw.dy.push(f.dy!=null?f.dy:null);
  });
  const Z={};Object.keys(raw).forEach(k=>Z[k]=(k==="mom"||k==="sig"||k==="idio")?zscores(raw[k]):zscoresNull(raw[k]));
  // combina sub-z ponderados usando SOLO los presentes (renormaliza el peso); null si no hay ninguno
  const blend=(parts)=>{let sw=0,sv=0;parts.forEach(([z,w])=>{if(z!=null){sv+=w*z;sw+=w;}});return sw>0?sv/sw:null;};
  const z={},er={},comp={},attrib={},raws={},cover={};
  list.forEach((s,i)=>{
    const zf={
      momentum:clampz(Z.mom[i]),
      lowvol:clampz(-Z.sig[i]),
      specific:clampz(-Z.idio[i]),
      market:s.b,
      size:Z.lnmc[i]!=null?clampz(-Z.lnmc[i]):null,
      value:(()=>{const b=blend([[Z.pb[i],0.6],[Z.pe[i],0.4]]);return b!=null?clampz(-b):null;})(),
      quality:(()=>{const b=blend([[Z.roe[i],0.40],[Z.nm[i],0.25],[Z.de[i]!=null?-Z.de[i]:null,0.20],[Z.eg[i],0.15]]);return b!=null?clampz(b):null;})(),
      yield:Z.dy[i]!=null?clampz(Z.dy[i]):null
    };
    // COMPOSITE: promedio de los factores de estilo CON dato (momentum y lowvol siempre; value/quality/size/yield
    // solo si hay fundamento real). Un factor ausente no suma 0 ficticio: se excluye del promedio.
    const present=MFSTYLE.filter(k=>zf[k]!=null);
    comp[s.t]=present.length?present.reduce((a,k)=>a+zf[k],0)/present.length:0;
    cover[s.t]={n:present.length,fund:["value","quality","size","yield"].filter(k=>zf[k]!=null).length};
    // para la vista/radar: los factores ausentes se muestran como 0 (neutro), pero NO entran al composite ni al tilt
    const zdisp={};MFSTYLE.forEach(k=>zdisp[k]=(zf[k]!=null?zf[k]:0));zdisp.specific=zf.specific;zdisp.market=zf.market;
    z[s.t]=zdisp;
    const base=RF+s.b*PRIMA;
    const tilt={};MFSTYLE.forEach(k=>tilt[k]=(zf[k]!=null?zf[k]:0)*LAMBDA[k]);   // sin dato → sin tilt
    const tsum=MFSTYLE.reduce((a,k)=>a+tilt[k],0);
    er[s.t]=base+tsum;
    attrib[s.t]={rf:RF,market:s.b*PRIMA,base,tilt,total:base+tsum};
    raws[s.t]={mom:raw.mom[i],idio:raw.idio[i]};
  });
  return {z,er,comp,attrib,raws,cover};
}
let MF=computeFactors(STOCKS);

function compositeOf(t,prof){
  if(prof==="equal")return MF.comp[t];
  const w=PROFILE_W[prof];return Object.keys(w).reduce((a,k)=>a+w[k]*MF.z[t][k],0);
}
function zcell(z){
  const v=clampz(z);let bg,fg;
  if(v>=0.05){const a=0.12+0.5*Math.min(1,v/2.5);bg=`rgba(11,132,87,${a.toFixed(2)})`;fg=v>1.2?"#fff":"var(--green)";}
  else if(v<=-0.05){const a=0.12+0.5*Math.min(1,-v/2.5);bg=`rgba(206,47,59,${a.toFixed(2)})`;fg=v<-1.2?"#fff":"var(--red)";}
  else{bg="var(--surface)";fg="var(--muted)";}
  return `<span class="zc" style="background:${bg};color:${fg}">${(z>=0?"+":"")+z.toFixed(2)}</span>`;
}
function styleBadges(t){
  const z=MF.z[t],s=stk(t),out=[];
  if(z.value>0.5)out.push(["Value","#6D54D8"]);else if(z.value<-0.5)out.push(["Growth","#D9730D"]);else out.push(["Blend","#566A8C"]);
  if(s.b<0.85&&z.lowvol>0)out.push(["Defensiva","#0B8457"]);else if(s.b>1.1)out.push(["Agresiva","#CE2F3B"]);
  if(z.quality>0.5)out.push(["Alta calidad","#0E8F86"]);else if(z.quality<-0.5)out.push(["Baja calidad","#A8700C"]);
  if(z.yield>0.6)out.push(["Alto dividendo","#1E5FD1"]);
  if(z.momentum>0.7)out.push(["Momentum","#DB2777"]);
  return out.map(b=>badge(b[0],b[1])).join(" ");
}

/* ---- Radar SVG ---- */
function svgRadar(o){
  const W=o.w||380,H=o.h||340,cx=W/2,cy=H/2+4,R=o.R||110,ax=o.axes,n=ax.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n,pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let g="";
  for(let k=1;k<=4;k++){const rr=R*k/4;let p="";for(let i=0;i<n;i++){const q=pt(i,rr);p+=(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);}p+="Z";
    g+=`<path d="${p}" fill="none" stroke="${GC}" stroke-width="1"/>`;}
  for(let i=0;i<n;i++){const q=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" stroke="${GC}" stroke-width="1"/>`;
    const l=pt(i,R+22),anc=Math.abs(l[0]-cx)<10?"middle":(l[0]>cx?"start":"end");
    g+=`<text x="${l[0].toFixed(1)}" y="${(l[1]+3).toFixed(1)}" text-anchor="${anc}" font-size="10.5" font-weight="800" fill="${muted}">${ax[i]}</text>`;}
  (o.series||[]).forEach(s=>{let p="";const ps=[];for(let i=0;i<n;i++){const r=R*Math.max(0,Math.min(100,s.vals[i]))/100,q=pt(i,r);ps.push(q);p+=(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);}p+="Z";
    g+=`<path d="${p}" fill="${s.c}" fill-opacity="${s.fill!=null?s.fill:0.16}" stroke="${s.c}" stroke-width="${s.w||2.2}" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':""}/>`;
    if(s.dot!==false)ps.forEach(q=>{g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3" fill="${s.c}" stroke="#ffffff" stroke-width="1.4"/>`;});});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" style="max-width:${W}px" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
const zToPct=z=>Math.max(2,Math.min(100,50+20*z));

/* ---- Slopegraph ranking ---- */
function svgSlope(rows,labL,labR){
  const W=860,rowH=23,top=40,H=top+rows.length*rowH+16,xL=250,xR=W-250;
  let g=`<text x="${xL}" y="22" text-anchor="end" font-size="11.5" font-weight="800" fill="${muted}">${labL}</text>`+
        `<text x="${xR}" y="22" text-anchor="start" font-size="11.5" font-weight="800" fill="${muted}">${labR}</text>`;
  const yOf=r=>top+(r-1)*rowH;
  rows.forEach(r=>{const yl=yOf(r.rankL),yr=yOf(r.rankR);
    g+=`<line x1="${xL}" y1="${yl}" x2="${xR}" y2="${yr}" stroke="${r.c}" stroke-width="2" opacity="0.45"/>`;
    g+=`<circle cx="${xL}" cy="${yl}" r="4" fill="${r.c}"/><circle cx="${xR}" cy="${yr}" r="4" fill="${r.c}"/>`;
    g+=`<text x="${xL-12}" y="${(yl+3.5).toFixed(1)}" text-anchor="end" font-size="11" font-weight="700" fill="${ink}">${r.rankL}. ${r.t}</text>`;
    g+=`<text x="${xR+12}" y="${(yr+3.5).toFixed(1)}" text-anchor="start" font-size="11" font-weight="700" fill="${ink}">${r.t} · ${r.rankR}</text>`;
    const mv=r.rankL-r.rankR;if(mv!==0){const mc=mv>0?green:red;g+=`<text x="${(xL+xR)/2}" y="${((yl+yr)/2-4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="${mc}">${mv>0?"▲":"▼"}${Math.abs(mv)}</text>`;}});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}

}

  }

  const note=notecard(`<b>Cómo leerlo.</b> El CAPM solo distingue por β: premia y castiga poco. El multifactor reordena según valor, calidad, momentum, tamaño, baja volatilidad y dividendo. Casos didácticos con estos datos: <b>CHILE</b> tiene β alto (E(R) CAPM alto) pero es cara y de momentum medio → el multifactor le exige menos; <b>ENELCHILE</b> y <b>COLBUN</b> suben por value + low-vol + yield; <b>PARAUCO</b> combina momentum, márgenes y tamaño. Modelo educativo con datos fundamentales ilustrativos; no es asesoría de inversión.`);
  return intro+selbar+`<div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)">${radarCard}${attrCard}</div>`+tbl+slope+pfCard+note;
}
