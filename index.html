<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor — Inteligencia que genera valor</title>
<script>try{if(localStorage.getItem('inv_theme')!=='light')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
  :root{
    color-scheme:light;
    /* Fondos / superficies estratificadas (3 niveles) */
    --bg:#EEF2F8; --surface:#F5F8FC; --card:#FFFFFF; --card2:#FBFCFE;
    --soft:#F3F7FD; --soft2:#E8F0FB;
    /* Tinta */
    --ink:#0C2240; --navy:#0F2E63; --muted:#566A8C; --faint:#8A9DBD;
    /* Líneas */
    --line:#E3EAF4; --line2:#CDD9EA; --line3:#F0F4FA;
    /* Acento primario + rampa */
    --accent:#2563EB; --accent2:#5B8DEF; --indigo:#2563EB;
    --a-50:#EEF3FE; --a-100:#DCE7FD; --a-200:#BACDFA; --a-300:#8DAEF6;
    --a-400:#588EF0; --a-500:#2563EB; --a-600:#1E50C4; --a-700:#19429E;
    /* Acento de datos */
    --data:#0E9E6E; --data-2:#34D399; --data-bg:#E4F6EF;
    --brand-cyan:#60A5FA; --brand-blue:#2563EB;
    --brand-grad:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);
    /* Semánticos */
    --green:#0E9D6B; --greenbg:#E4F7EF; --green-line:#A7E3C9;
    --red:#CE2F3B; --redbg:#FBE9EA; --red-line:#F0B6BB;
    --amber:#A8700C; --amberbg:#FAF0D9; --amber-line:#EAD09A;
    --violet:#6D54D8; --violet-bg:#EDE9FC;
    /* Sombras en capas */
    --sh-xs:0 1px 2px rgba(14,28,54,.05);
    --sh:0 1px 1px rgba(14,28,54,.04), 0 2px 6px rgba(14,28,54,.05);
    --sh-md:0 1px 2px rgba(14,28,54,.05), 0 8px 22px rgba(14,28,54,.09);
    --sh-lg:0 2px 4px rgba(14,28,54,.06), 0 18px 44px rgba(14,28,54,.14);
    --shL:0 16px 44px rgba(14,28,54,.16);
    --ring:0 0 0 3px rgba(37,99,235,.20);
    /* Charts (tematizables vía JS) */
    --chart-grid:#EAF0F8; --chart-axis:#CBD5E6; --chart-zero:#C2CEDF;
    /* Forma */
    --r:14px; --r-lg:16px; --r-sm:9px; --r-xs:6px; --r-pill:999px;
    /* Glass + sidebar + movimiento */
    --glass:rgba(255,255,255,.72);
    --side-grad:linear-gradient(168deg,#0A1224 0%,#0F1D3A 60%,#13264A 100%);
    --ease:cubic-bezier(.22,.61,.36,1); --ease-out:cubic-bezier(.16,1,.3,1);
    --font:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,'Cascadia Mono',Menlo,monospace;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0A1224; --surface:#0E1A33; --card:#0F1D3A; --card2:#15274A;
    --soft:#142544; --soft2:#1A2C4D;
    --ink:#E8EEF8; --navy:#F3F7FD; --muted:#94A3B8; --faint:#647693;
    --line:#1C2C49; --line2:#283B5E; --line3:#152138;
    --accent:#3B82F6; --accent2:#60A0FF; --indigo:#3B82F6;
    --a-50:#15233F; --a-100:#1A2E52; --a-200:#244275; --a-300:#2E5796;
    --a-400:#3B82F6; --a-500:#5EA0FF; --a-600:#88BCFF; --a-700:#B4D6FF;
    --data:#34D399; --data-2:#34D399; --data-bg:#0C2E22;
    --brand-cyan:#60A5FA; --brand-blue:#3B82F6;
    --brand-grad:linear-gradient(135deg,#3B82F6 0%,#2563EB 100%);
    --green:#10B981; --greenbg:#0C2E22; --green-line:#1C6B4F;
    --red:#F0606B; --redbg:#3A1A1E; --red-line:#7A2C32;
    --amber:#E0A93C; --amberbg:#352910; --amber-line:#6E561E;
    --violet:#9B86F0; --violet-bg:#1F1A3A;
    --sh-xs:0 1px 2px rgba(0,0,0,.34);
    --sh:0 1px 1px rgba(0,0,0,.30), 0 2px 8px rgba(0,0,0,.34);
    --sh-md:0 2px 6px rgba(0,0,0,.36), 0 10px 26px rgba(0,0,0,.40);
    --sh-lg:0 4px 10px rgba(0,0,0,.42), 0 22px 50px rgba(0,0,0,.52);
    --shL:0 22px 50px rgba(0,0,0,.55);
    --ring:0 0 0 3px rgba(61,139,255,.30);
    --chart-grid:#1E2D47; --chart-axis:#33486B; --chart-zero:#3C5078;
    --glass:rgba(15,30,56,.66);
    --side-grad:linear-gradient(168deg,#070E1C 0%,#0A1530 58%,#0F2042 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;}
  #app{display:flex;height:100vh;overflow:hidden;}
  .tnum{font-variant-numeric:tabular-nums;}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-thumb{background:#CAD5E5;border-radius:7px;border:3px solid var(--bg);}

  /* ===== SIDEBAR (navy) ===== */
  aside{width:258px;flex-shrink:0;background:linear-gradient(168deg,#0B2143 0%,#143A77 100%);color:#AEC2DC;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:12px;padding:1.5rem 1.3rem;border-bottom:1px solid rgba(255,255,255,.09);}
  .brand .bar{width:4px;align-self:stretch;border-radius:3px;background:linear-gradient(180deg,#4F9BEF,#7FD0E8);}
  .beye{font-size:8.5px;letter-spacing:2px;color:#7FD0E8;font-weight:800;text-transform:uppercase;margin-bottom:6px;}
  .bt{font-weight:800;font-size:25px;line-height:1.15;color:#FFFFFF;letter-spacing:-.4px;text-shadow:0 1px 4px rgba(0,0,0,.3);}
  .snav{flex:1;overflow-y:auto;padding:1rem .8rem;}
  .sgroup{font-size:8.5px;letter-spacing:1.9px;color:#6F88AE;font-weight:800;text-transform:uppercase;padding:.5rem .65rem .35rem;margin-top:.5rem;}
  .modbtn{display:flex;align-items:center;gap:11px;width:100%;padding:.68rem .7rem;border:1px solid transparent;background:rgba(255,255,255,.035);border-radius:11px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;color:#C4D4E8;transition:all .14s;margin-bottom:6px;text-align:left;}
  .modbtn:hover{background:rgba(255,255,255,.09);color:#fff;}
  .modbtn.on{background:linear-gradient(135deg,rgba(79,155,239,.34),rgba(127,208,232,.16));color:#fff;border-color:rgba(127,176,242,.45);box-shadow:0 5px 16px rgba(8,24,53,.45);}
  .modbtn .mi{width:31px;height:31px;border-radius:9px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#7FB0F2;}
  .modbtn.on .mi{background:rgba(255,255,255,.18);color:#fff;}
  .modbtn .lk{margin-left:auto;font-size:11px;opacity:.5;}
  .tab{display:flex;align-items:center;gap:10px;width:100%;padding:.55rem .7rem;border:none;background:transparent;border-radius:9px;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:600;color:#9DB2CE;transition:all .12s;margin-bottom:2px;border-left:3px solid transparent;text-align:left;}
  .tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .tab.on{background:rgba(79,155,239,.18);color:#fff;border-left:3px solid #5CA6F2;font-weight:700;}
  .tab .num{width:19px;height:19px;border-radius:6px;background:rgba(255,255,255,.09);color:#9DB2CE;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tab.on .num{background:#5CA6F2;color:#fff;}
  .sfoot{padding:.95rem 1.15rem;border-top:1px solid rgba(255,255,255,.09);font-size:9.5px;color:#6F88AE;line-height:1.85;}
  .sfoot b{color:#AEC2DC;font-weight:700;}
  .tbar{width:4px;height:34px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--accent2));flex-shrink:0;}

  /* ===== TOPBAR ===== */
  .topbar{height:62px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 1.6rem;box-shadow:var(--sh);z-index:5;}
  .crumb{font-size:9px;letter-spacing:1.4px;color:var(--indigo);font-weight:800;text-transform:uppercase;margin-bottom:4px;}
  .ptitle{font-weight:800;font-size:17px;letter-spacing:-.3px;line-height:1;color:var(--navy);}
  .spacer{flex:1;}
  .hstats{display:flex;align-items:center;gap:18px;}
  .hstat .l{font-size:8px;letter-spacing:1.1px;color:var(--faint);font-weight:700;text-transform:uppercase;}
  .hstat .v{font-size:14px;font-weight:800;line-height:1.2;}
  .hsep{width:1px;height:30px;background:var(--line);}

  /* ===== CONTENT ===== */
  .mainwrap{flex:1;display:flex;flex-direction:column;min-width:0;}
  #main{flex:1;overflow-y:auto;padding:1.4rem 1.5rem;}
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .grid{display:grid;gap:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
  /* ===== refinamiento profesional ===== */
  .card{transition:box-shadow .2s ease,border-color .2s ease;}
  .card:hover{box-shadow:0 1px 2px rgba(20,30,54,.05),0 14px 34px rgba(20,30,54,.11);border-color:var(--line2);}
  .ct{font-weight:800;font-size:14px;}
  .cs{font-size:11.5px;}
  .tile{transition:transform .15s ease,box-shadow .15s ease;}
  .tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,30,54,.13);}
  .pbtn{transition:all .14s ease;}
  .altchip{transition:transform .12s ease;} .altchip:hover{transform:translateY(-1px);}
  .wbtn{transition:background .12s ease,color .12s ease;}
  .btn{transition:transform .13s ease,box-shadow .13s ease,background .13s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-pri{box-shadow:0 2px 9px rgba(30,95,209,.28);}
  .btn-pri:hover{box-shadow:0 5px 16px rgba(30,95,209,.34);}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,209,.16);}
  .tw table tbody tr{transition:background .1s ease;} .tw table tbody tr:hover{background:var(--soft);}
  .tile .tv,.kv{letter-spacing:-.3px;}
  .cs{line-height:1.4;}
  .legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--muted);font-weight:600;align-items:center;}
  .legend .lgdot{box-shadow:0 0 0 2px #fff,0 1px 2px rgba(20,30,54,.18);}
  .chart{max-width:940px;}
  .heat .cell{border-radius:7px;transition:transform .1s ease;} .heat .cell:hover{transform:scale(1.08);}
  .altm{transition:background .12s ease;}
  svg text{font-family:var(--font);}
  .card>.hd{padding:1rem 1.3rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .card .ct{font-weight:800;font-size:15px;color:var(--navy);letter-spacing:-.2px;}
  .card .cs{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .card .bd{padding:1.2rem 1.3rem;}
  .card .bd.flush{padding:0;}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .lgdot{width:9px;height:9px;border-radius:3px;}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.92rem .9rem .92rem 1rem;position:relative;overflow:hidden;box-shadow:var(--sh);}
  .tile .edge{position:absolute;left:0;top:0;bottom:0;width:3px;}
  .tile .l{font-size:10.5px;letter-spacing:.4px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:7px;line-height:1.3;}
  .tile .v{font-size:1.16rem;font-weight:800;line-height:1.16;letter-spacing:-.4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
  .tile .s{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35;}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{padding:.72rem .9rem;text-align:left;font-size:10.5px;letter-spacing:.5px;color:var(--muted);font-weight:700;
           text-transform:uppercase;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--soft);}
  .ntr{text-transform:none !important;}
  /* pestañas del libro de operaciones por proyecto */
  .ctx-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px;}
  .ctxtab{padding:.42rem .8rem;border:1px solid var(--line2);border-radius:9px;background:var(--card2);color:var(--mut);font:700 12px var(--font);cursor:pointer;transition:all .12s ease;white-space:nowrap;}
  .ctxtab:hover{border-color:var(--accent);color:var(--accent);}
  .ctxtab.on{background:linear-gradient(180deg,var(--a-400),var(--accent));border-color:transparent;color:#fff;box-shadow:0 2px 9px rgba(30,95,209,.26);}
  /* crear análisis */
  .ca-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end;}
  .ca-f{display:flex;flex-direction:column;gap:7px;}
  .ca-f>span{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);}
  .ca-f input{padding:.55rem .7rem;border:1px solid var(--line2);border-radius:9px;background:var(--card2);color:var(--ink);font:600 13px var(--font);}
  .ca-f input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--a-50);}
  .ca-stk{margin-top:17px;}
  .ca-stk-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .ca-stk-h b{font:800 13px var(--font);color:var(--navy);}
  .ca-stk-h span{font-size:11.5px;color:var(--mut);font-weight:600;}
  .ca-stk-h a{color:var(--accent);cursor:pointer;font-weight:700;}
  .ca-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .ca-chip{display:inline-flex;align-items:center;gap:7px;padding:.42rem .7rem;border:1px solid var(--line2);border-radius:9px;background:var(--card2);color:var(--ink);font:700 12.5px var(--font);cursor:pointer;transition:all .12s ease;}
  .ca-chip:hover{border-color:var(--accent);}
  .ca-chip.on{border-color:transparent;background:linear-gradient(180deg,var(--a-400),var(--accent));color:#fff;box-shadow:0 2px 9px rgba(30,95,209,.24);}
  .ca-chip .rk-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .ca-chip-n{font-size:10px;opacity:.65;font-weight:700;}
  .ca-foot{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:17px;}
  .ca-savedlist{display:flex;flex-direction:column;gap:9px;}
  .ca-saved{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:.7rem .85rem;border:1px solid var(--line);border-radius:11px;background:var(--card2);}
  .ca-saved.on{border-color:var(--accent);background:var(--a-50);}
  .ca-saved-l b{font:800 13px var(--font);color:var(--navy);display:block;}
  .ca-saved-l span{font-size:11px;color:var(--mut);}
  .ca-saved-r{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
  .ca-badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);background:var(--a-50);border:1px solid var(--a-200);border-radius:7px;padding:.22rem .5rem;}
  .ca-bench-none{font-size:12px;color:var(--mut);font-weight:600;padding:.4rem 0;}
  .ca-srchint{display:block;font-size:11px;color:var(--mut);margin-top:7px;line-height:1.4;}
  /* IPSA card (Home) */
  .ipsa-row{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;}
  .ipsa-now{display:flex;flex-direction:column;gap:2px;}
  .ipsa-val{font:800 27px var(--font);color:var(--navy);letter-spacing:-.6px;font-variant-numeric:tabular-nums;}
  .ipsa-val small{font-size:13px;color:var(--mut);font-weight:700;margin-left:5px;letter-spacing:0;}
  .ipsa-pts{font-size:11px;color:var(--mut);font-weight:600;}
  .ipsa-cells{display:flex;gap:10px;flex-wrap:wrap;}
  .ipsa-cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:86px;padding:.55rem .85rem;border:1px solid var(--line);border-radius:11px;background:var(--card2);}
  .ipsa-cl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);}
  .ipsa-cv{font:800 17px var(--font);font-variant-numeric:tabular-nums;}
  .ipsa-chart{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  tbody td{padding:.72rem .9rem;border-bottom:1px solid var(--line);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--soft);}
  .tw{overflow-x:auto;}
  .chip{border-radius:6px;padding:.16rem .5rem;font-size:11px;font-weight:700;display:inline-block;}
  .badge{border-radius:6px;padding:.12rem .5rem;font-size:10px;font-weight:600;display:inline-block;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .tk{display:flex;align-items:center;gap:8px;font-weight:700;}

  /* selector */
  .sel{display:flex;gap:8px;flex-wrap:wrap;}
  .selb{display:flex;align-items:center;gap:7px;padding:.5rem .85rem;border-radius:10px;border:1px solid var(--line2);
        background:var(--card);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700;color:var(--muted);box-shadow:var(--sh);transition:all .12s;}
  .selb:hover{border-color:var(--indigo);color:var(--ink);}
  .selb.on{color:#fff;border-color:transparent;}

  /* heatmap */
  .heat{border-collapse:separate;border-spacing:4px;width:auto;}
  .heat .cell{width:62px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;}
  .heat .hh{font-size:10px;font-weight:800;text-align:center;padding:3px;}
  .heat .rh{font-size:10px;font-weight:800;text-align:right;padding-right:9px;white-space:nowrap;}

  /* svg chart */
  .chart{width:100%;height:auto;display:block;max-width:880px;margin:0 auto;}
  .chart text{font-family:var(--font);}

  /* locked */
  .locked{background:linear-gradient(180deg,#fff,var(--soft));border:1.5px dashed var(--line2);border-radius:var(--r);
          padding:3.2rem 2rem;text-align:center;box-shadow:var(--sh);}
  .lbadge{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,var(--indigo),var(--accent2));
          display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 10px 26px rgba(79,70,229,.32);}
  .tag{display:inline-block;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:.25rem .6rem;font-size:10.5px;font-weight:600;color:var(--muted);}
  .note{font-size:12px;color:var(--muted);line-height:1.6;}
  .footer{flex-shrink:0;border-top:1px solid var(--line);padding:.5rem 1.6rem;display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);background:var(--card);letter-spacing:.3px;}
  /* market tiles + refinamientos */
  .mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .mstat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:.8rem .95rem;box-shadow:var(--sh);position:relative;overflow:hidden;}
  .mstat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));}
  .ml{font-size:9.5px;letter-spacing:1.1px;color:var(--faint);font-weight:800;text-transform:uppercase;}
  .mv{font-size:1.5rem;font-weight:800;line-height:1.05;margin-top:6px;letter-spacing:-.5px;}
  .ms{font-size:10.5px;color:var(--muted);margin-top:6px;}
  .card>.hd{background:linear-gradient(180deg,#fff,var(--soft));}
  @media(max-width:820px){.mstats{grid-template-columns:1fr;}}
  /* simulación + subtabs + título */
  .subtabs{margin:1px 0 10px 15px;padding-left:11px;border-left:1px solid rgba(255,255,255,.13);display:flex;flex-direction:column;}
  .btn{padding:.5rem .9rem;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--indigo);font-weight:700;font-size:12px;cursor:pointer;box-shadow:var(--sh);font-family:var(--font);}
  .btn:hover{background:var(--soft2);}
  .simhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .simamt .l{font-size:9px;letter-spacing:1px;color:var(--faint);font-weight:800;text-transform:uppercase;display:block;margin-bottom:6px;}
  .amtwrap{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:.45rem .8rem;background:var(--soft);}
  .amtwrap input{border:none;background:transparent;font-family:var(--font);font-size:17px;font-weight:800;color:var(--ink);width:150px;outline:none;}
  .amtwrap>span{color:var(--muted);font-weight:800;}
  .simlist{display:flex;flex-direction:column;gap:7px;}
  .simrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;padding:.55rem .8rem;border:1px solid var(--line);border-radius:10px;background:var(--soft);}
  .simrow.on{background:var(--card);border-color:var(--line2);box-shadow:var(--sh);}
  .simchk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;}
  .simchk input{width:16px;height:16px;accent-color:var(--indigo);cursor:pointer;}
  .simsec{font-size:10px;color:var(--faint);font-weight:600;}
  .simw{display:flex;align-items:center;gap:5px;min-width:90px;justify-content:flex-end;}
  .winp{width:64px;border:1px solid var(--line2);border-radius:8px;padding:.35rem .5rem;font-family:var(--font);font-size:13px;font-weight:800;text-align:right;color:var(--ink);outline:none;}
  .winp:focus{border-color:var(--indigo);}
  .simw>span{color:var(--muted);font-weight:700;font-size:12px;}
  .simoff{color:var(--faint);font-size:11px;}
  .simb{font-size:11px;color:var(--muted);font-weight:600;min-width:130px;text-align:right;}
  .simsum{margin-top:13px;font-size:12.5px;color:var(--muted);}
  .simwarn{color:var(--amber);font-size:11px;font-weight:600;}
  .genrow{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;}
  .genl{font-size:10px;letter-spacing:.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:8px;line-height:1.3;}
  .gl{text-transform:none!important;}
  .helpline{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.5;}
  .pbtns{display:flex;gap:6px;}
  .pbtn,.nbtn{padding:.48rem .85rem;border-radius:9px;border:1px solid var(--line2);background:var(--card);color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;font-family:var(--font);}
  .nbtn{padding:.48rem .75rem;min-width:38px;}
  .pbtn:hover,.nbtn:hover{border-color:var(--indigo);color:var(--ink);}
  .pbtn.on,.nbtn.on{background:var(--indigo);color:#fff;border-color:transparent;}
  .btn-pri{background:var(--indigo);color:#fff;border-color:transparent;}
  .btn-pri:hover{background:#1A52B8;}
  .genhint{margin-top:13px;font-size:11.5px;color:var(--muted);}
  .altchips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px;}
  .altchip{border:1px solid;border-radius:7px;padding:.22rem .6rem;font-size:11px;font-weight:800;background:var(--card);}
  .altmets{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;}
  .altm{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.72rem .55rem;text-align:center;}
  .altml{font-size:10px;letter-spacing:.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-bottom:6px;}
  .altmv{font-size:1.42rem;font-weight:800;color:var(--ink);line-height:1.05;letter-spacing:-.3px;}
  .charttip{position:fixed;z-index:200;background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:.5rem .75rem;font-size:13.5px;font-weight:800;color:var(--ink);box-shadow:var(--shL);pointer-events:none;display:none;line-height:1.45;}
  .charttip b{display:block;color:var(--faint);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
  #projsvg{cursor:crosshair;}
  .projctrl{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:15px;}
  .ttr{display:block;color:var(--muted);font-weight:600;font-size:10.5px;margin-top:3px;}
  .pinp{width:118px;border:1px solid var(--line2);border-radius:8px;padding:.4rem .6rem;font-family:var(--font);font-size:13px;font-weight:700;text-align:right;color:var(--ink);outline:none;}
  .pinp:focus{border-color:var(--indigo);}
  input[type=date]{border:1px solid var(--line2);border-radius:9px;padding:.45rem .7rem;font-family:var(--font);font-size:13px;color:var(--ink);outline:none;}
  #wipsa{border:none;background:transparent;font-family:var(--font);font-size:15px;font-weight:800;color:var(--ink);outline:none;}
  .wbtn{border:1px solid var(--line2);background:var(--card);border-radius:6px;width:25px;height:25px;cursor:pointer;font-size:12px;color:var(--muted);line-height:1;}
  .wbtn:hover{border-color:var(--indigo);color:var(--indigo);}
  .wbtn.del:hover{border-color:var(--red);color:var(--red);}

  /* ════════════════ Investor · SISTEMA DE DISEÑO ════════════════ */
  body{background:var(--bg);color:var(--ink);
    font-feature-settings:"cv05" 1,"ss01" 1,"zero" 1;text-rendering:optimizeLegibility;}
  .tnum,table td,table th,.tile .v,.kv,.hstat .v,.metric-hero,.amtwrap input,.winp,.pinp{
    font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 1;}
  .mono{font-family:var(--mono);letter-spacing:-.2px;}

  /* ── Sidebar ── */
  aside{background:var(--side-grad);border-right:1px solid rgba(255,255,255,.06);
    box-shadow:inset -1px 0 0 rgba(0,0,0,.25);}
  .brand{display:flex;align-items:center;gap:12px;padding:1.35rem 1.2rem;
    border-bottom:1px solid rgba(255,255,255,.08);}
  .brand-mark{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(127,176,242,.22);border-radius:12px;flex-shrink:0;}
  .logomark{color:#fff;}
  .beye{font-size:8px;letter-spacing:1.9px;color:var(--brand-cyan);font-weight:800;text-transform:uppercase;margin-bottom:5px;}
  .bt{font:800 22px var(--font);line-height:1.05;color:#FFFFFF;letter-spacing:-.5px;display:flex;align-items:center;}
  .wm-dot{width:6px;height:6px;border-radius:50%;margin-left:5px;align-self:flex-end;margin-bottom:3px;
    background:var(--brand-grad);box-shadow:0 0 0 3px rgba(34,211,238,.18);}
  .modbtn{background:transparent;border:1px solid transparent;padding:.64rem .68rem;
    transition:background .16s var(--ease),color .16s,box-shadow .16s,transform .12s;}
  .modbtn:hover{background:rgba(255,255,255,.06);color:#fff;}
  .modbtn:active{transform:translateY(.5px);}
  .modbtn.on{position:relative;color:#fff;
    background:linear-gradient(135deg,rgba(61,139,255,.30),rgba(34,211,238,.12));
    border-color:rgba(120,170,246,.40);
    box-shadow:0 6px 18px rgba(6,18,40,.5),inset 0 0 0 1px rgba(255,255,255,.04);}
  .modbtn.on::before{content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:3px;background:var(--brand-grad);box-shadow:0 0 10px rgba(34,211,238,.5);}
  .modbtn .mi{transition:background .16s,color .16s;}
  .modbtn.on .mi{background:rgba(34,211,238,.20);color:#9CF0E8;}
  .tab.on{background:rgba(61,139,255,.16);color:#fff;border-left:2px solid var(--brand-cyan);font-weight:700;}
  .tab.on .num{background:var(--brand-grad);color:#06231F;}

  /* ── Topbar (glass + live-dot + theme toggle) ── */
  .topbar{height:60px;background:var(--glass);
    -webkit-backdrop-filter:saturate(150%) blur(12px);backdrop-filter:saturate(150%) blur(12px);
    border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(14,28,54,.03),var(--sh-xs);}
  .tbar{width:3px;height:32px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--brand-cyan));}
  .crumb{color:var(--accent);}
  .ptitle{color:var(--navy);}
  .hstat .v.up{color:var(--green);} .hstat .v.down{color:var(--red);}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);position:relative;display:inline-block;}
  .live-dot::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--green);
    opacity:.4;animation:livePulse 1.8s var(--ease-out) infinite;}
  @keyframes livePulse{0%{transform:scale(1);opacity:.45;}70%,100%{transform:scale(2.4);opacity:0;}}
  .mkpill{display:flex;align-items:center;gap:7px;padding:.32rem .65rem;border-radius:var(--r-pill);
    background:var(--card2);border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--muted);}
  .iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:.15s var(--ease);box-shadow:var(--sh-xs);}
  .iconbtn:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px);}
  .iconbtn:active{transform:translateY(0);}

  /* ── Cards ── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
    transition:box-shadow .2s var(--ease),border-color .2s ease;}
  .card:hover{box-shadow:var(--sh-md);border-color:var(--line2);}
  .card.feature{position:relative;}
  .card.feature::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--brand-grad);opacity:.9;z-index:1;}
  .card>.hd{padding:.95rem 1.25rem;background:linear-gradient(180deg,var(--card2),var(--card));border-bottom:1px solid var(--line);}
  .card .ct{font:800 15px var(--font);color:var(--navy);letter-spacing:-.2px;}
  .card .cs{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4;}
  .card.term{background:var(--surface);} .card.term>.hd{background:var(--surface);}

  /* ── KPI Tiles ── */
  .tile{border-radius:12px;box-shadow:var(--sh-xs);background:var(--card);border:1px solid var(--line);
    transition:transform .16s var(--ease),box-shadow .16s ease,border-color .16s ease;position:relative;overflow:hidden;}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--line2);}
  .tile .edge{border-radius:0 3px 3px 0;}
  .tile.pos .edge{background:linear-gradient(180deg,var(--green),#0A6E49);}
  .tile.neg .edge{background:linear-gradient(180deg,var(--red),#B42727);}
  .tile.neu .edge,.tile.info .edge{background:var(--brand-grad);}
  .tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
    background:radial-gradient(circle,rgba(46,111,224,.06),transparent 70%);opacity:0;transition:opacity .25s ease;pointer-events:none;}
  .tile:hover::after{opacity:1;}

  /* ── Badges / Chips / dots ── */
  .chip{border-radius:var(--r-xs);padding:.16rem .5rem;font:700 11px var(--font);
    display:inline-flex;align-items:center;gap:5px;line-height:1.4;border:1px solid transparent;}
  .badge{border-radius:var(--r-xs);padding:.14rem .5rem;font:700 10px var(--font);letter-spacing:.2px;
    display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;}
  .badge.pos,.chip.pos{color:var(--green);background:var(--greenbg);border-color:var(--green-line);}
  .badge.neg,.chip.neg{color:var(--red);background:var(--redbg);border-color:var(--red-line);}
  .badge.warn,.chip.warn{color:var(--amber);background:var(--amberbg);border-color:var(--amber-line);}
  .badge.neu,.chip.neu{color:var(--data);background:var(--data-bg);border-color:transparent;}
  .badge.info,.chip.info{color:var(--a-600);background:var(--a-50);border-color:var(--a-100);}
  .badge.vio,.chip.vio{color:var(--violet);background:var(--violet-bg);border-color:transparent;}
  .lgdot{box-shadow:0 0 0 2px var(--card),0 1px 2px rgba(14,28,54,.18);}

  /* ── Tablas (terminal-grade) ── */
  .tw{overflow:auto;border-radius:var(--r-sm);}
  table{border-collapse:separate;border-spacing:0;}
  thead th{position:sticky;top:0;z-index:2;background:var(--soft);color:var(--muted);
    border-bottom:1px solid var(--line2);box-shadow:0 1px 0 var(--line2);}
  thead th.num,tbody td.num,.tw th.r,.tw td.r{text-align:right;font-variant-numeric:tabular-nums;}
  tbody td{border-bottom:1px solid var(--line);color:var(--ink);}
  tbody tr:nth-child(even) td{background:var(--line3);}
  tbody tr{transition:background .1s ease;}
  tbody tr:hover td{background:var(--soft2);}
  tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--accent);}
  tbody tr:last-child td{border-bottom:none;}
  td.pos{color:var(--green);font-weight:700;} td.neg{color:var(--red);font-weight:700;}

  /* ── Inputs ── */
  input,select,textarea{background:var(--card2);color:var(--ink);border:1px solid var(--line2);
    border-radius:var(--r-sm);transition:border-color .14s,box-shadow .14s,background .14s;}
  input::placeholder,textarea::placeholder{color:var(--faint);}
  input:hover,select:hover{border-color:var(--a-200);}
  input:focus,select:focus,textarea:focus,.winp:focus,.pinp:focus{
    background:var(--card);border-color:var(--accent);box-shadow:var(--ring);outline:none;}
  .amtwrap{background:var(--card2);border:1px solid var(--line2);transition:border-color .15s,box-shadow .15s,background .15s;}
  .amtwrap:focus-within{border-color:var(--accent);box-shadow:var(--ring);background:var(--card);}
  .amtwrap input{border:none;background:transparent;box-shadow:none;}
  .amtwrap input:focus{box-shadow:none;}

  /* ── Botones ── */
  .btn{border-radius:var(--r-sm);font:700 12.5px var(--font);border:1px solid var(--line2);
    background:var(--card);color:var(--accent);box-shadow:var(--sh-xs);display:inline-flex;align-items:center;gap:7px;
    transition:transform .13s var(--ease),box-shadow .13s,background .13s,border-color .13s;}
  .btn:hover{background:var(--soft2);transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.985);}
  .btn-pri{color:#fff;border:none;background:linear-gradient(135deg,var(--a-400),var(--accent));
    box-shadow:0 2px 8px rgba(30,95,209,.32),inset 0 1px 0 rgba(255,255,255,.18);}
  .btn-pri:hover{transform:translateY(-1px);background:linear-gradient(135deg,var(--a-400),var(--accent));
    box-shadow:0 6px 18px rgba(30,95,209,.40),inset 0 1px 0 rgba(255,255,255,.22);}
  .btn-pri:active{transform:translateY(0);box-shadow:0 2px 6px rgba(30,95,209,.30);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);box-shadow:none;}
  .btn-ghost:hover{background:var(--soft2);color:var(--ink);transform:none;}
  .selb{background:var(--card);color:var(--muted);border:1px solid var(--line2);box-shadow:var(--sh-xs);transition:.14s;}
  .selb:hover{border-color:var(--a-200);color:var(--ink);}
  .selb.on{color:#fff;border-color:transparent;background:linear-gradient(180deg,var(--a-400),var(--accent));box-shadow:0 2px 9px rgba(30,95,209,.28);}
  .pbtn,.nbtn{background:var(--card);color:var(--muted);border:1px solid var(--line2);transition:.13s var(--ease);}
  .pbtn:hover,.nbtn:hover{border-color:var(--accent);color:var(--ink);}
  .pbtn.on,.nbtn.on{background:linear-gradient(180deg,var(--a-400),var(--accent));color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(30,95,209,.26);}

  /* ── Heatmap / charts / tooltip ── */
  .heat .cell{font-variant-numeric:tabular-nums;transition:transform .1s ease,box-shadow .1s ease,filter .1s ease;}
  .heat .cell:hover{transform:scale(1.06);box-shadow:var(--sh-md);filter:brightness(1.05);z-index:2;}
  .charttip{background:var(--card);border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--ink);
    box-shadow:var(--shL);font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .note{color:var(--muted);}
  .locked{background:linear-gradient(180deg,var(--card),var(--surface));border:1.5px dashed var(--line2);}
  .footer{background:var(--card);border-top:1px solid var(--line);color:var(--faint);}
  .tag{background:var(--surface);border:1px solid var(--line);color:var(--muted);}

  /* ── Microinteracciones ── */
  :where(button,a,input,select,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:var(--ring);}
  /* contenedores segmentados con overflow:hidden recortarían el outline → inset */
  .op-side button:focus-visible,.cfg-seg button:focus-visible,.tnav button:focus-visible{outline-offset:-2px;}
  @keyframes riseIn{from{opacity:.4;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .wrap>.card,.wrap>.grid,.wrap>.tiles,.wrap>.mf-grid{animation:riseIn .28s var(--ease-out) both;}
  .wrap>*:nth-child(2){animation-delay:.03s;} .wrap>*:nth-child(3){animation-delay:.06s;}
  .wrap>*:nth-child(4){animation-delay:.09s;} .wrap>*:nth-child(5){animation-delay:.11s;}
  @media(prefers-reduced-motion:reduce){.wrap>.card,.wrap>.grid,.wrap>.tiles,.wrap>.mf-grid{animation:none;}}
  ::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--faint);}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

  /* ════════════════ MULTIFACTOR ════════════════ */
  .mf-grid{display:grid;gap:16px;}
  .mfdisc{display:flex;gap:11px;align-items:flex-start;padding:.85rem 1.1rem;border-radius:var(--r-sm);
    background:var(--amberbg);border:1px solid var(--amber-line);color:var(--amber);font-size:11.5px;line-height:1.5;font-weight:600;}
  .mfdisc b{color:var(--amber);}
  .factbar{display:flex;flex-wrap:wrap;gap:8px;}
  .factchip{display:flex;align-items:center;gap:7px;padding:.4rem .7rem;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);font-size:11px;font-weight:700;color:var(--muted);}
  .factchip .fd{width:9px;height:9px;border-radius:3px;}
  .zc{display:inline-block;min-width:42px;text-align:center;border-radius:var(--r-xs);padding:.14rem .4rem;
    font:800 11.5px var(--font);font-variant-numeric:tabular-nums;}
  .stylebadges{display:flex;flex-wrap:wrap;gap:6px;}
  .radarwrap{display:flex;gap:20px;flex-wrap:wrap;align-items:center;justify-content:center;}
  .attrbar{display:flex;height:30px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface);}
  .attrseg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;}
  .attrleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:9px;font-size:10.5px;color:var(--muted);font-weight:600;}
  .attrleg span{display:flex;align-items:center;gap:5px;}
  .attrleg i{width:10px;height:10px;border-radius:3px;display:inline-block;}

  /* ════════════════ PRO / ROADMAP ════════════════ */
  .hero-pro{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:1.7rem 1.8rem;color:#fff;
    background:linear-gradient(125deg,#0A1E3D 0%,#15407F 55%,#1E5FD1 100%);box-shadow:var(--sh-lg);}
  .hero-pro::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(34,211,238,.28),transparent 65%);pointer-events:none;}
  .hero-pro h1{font:800 25px var(--font);letter-spacing:-.5px;margin-bottom:8px;position:relative;}
  .hero-pro p{font-size:13px;opacity:.9;max-width:680px;line-height:1.6;position:relative;}
  .hero-pro .ku{position:relative;display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;}
  .hero-pro .ku .l{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;opacity:.7;font-weight:800;}
  .hero-pro .ku .v{font-size:18px;font-weight:800;margin-top:3px;}
  .diff{display:inline-flex;align-items:center;gap:6px;padding:.2rem .6rem;border-radius:var(--r-pill);font-size:10.5px;font-weight:800;letter-spacing:.3px;}
  .diff.low{background:var(--greenbg);color:var(--green);border:1px solid var(--green-line);}
  .diff.med{background:var(--amberbg);color:var(--amber);border:1px solid var(--amber-line);}
  .diff.high{background:var(--redbg);color:var(--red);border:1px solid var(--red-line);}
  .phase{display:flex;gap:14px;align-items:flex-start;padding:.9rem 0;border-bottom:1px solid var(--line);}
  .phase:last-child{border-bottom:none;}
  .phase .pn{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--brand-grad);color:#06231F;
    font:800 13px var(--font);display:flex;align-items:center;justify-content:center;}
  .phase .pt{font-weight:800;color:var(--navy);font-size:13px;}
  .phase .peta{font-size:10.5px;color:var(--data);font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
  .phase .pd{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .stack{display:grid;gap:9px;}
  /* mock cotizaciones en vivo */
  .qrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;
    padding:.6rem .85rem;border:1px solid var(--line);border-radius:10px;background:var(--card2);}
  .qrow .qt{font-weight:800;color:var(--ink);} .qrow .qn{font-size:10.5px;color:var(--faint);}
  .qrow .qp{font-weight:800;font-variant-numeric:tabular-nums;}
  .delaytag{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--amber);
    background:var(--amberbg);padding:.1rem .4rem;border-radius:var(--r-xs);border:1px solid var(--amber-line);}
  /* mock copiloto IA */
  .chatbox{display:flex;flex-direction:column;gap:11px;max-height:420px;overflow-y:auto;padding:.4rem;}
  .msg{max-width:82%;padding:.7rem .9rem;border-radius:14px;font-size:12.5px;line-height:1.55;}
  .msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--a-400),var(--accent));color:#fff;border-bottom-right-radius:5px;}
  .msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px;}
  .msg.a .who{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--data);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
  .msg.a code{font-family:var(--mono);font-size:11px;background:var(--card2);padding:.05rem .3rem;border-radius:4px;border:1px solid var(--line);}
  .chatin{display:flex;gap:8px;margin-top:12px;}
  .chatin input{flex:1;padding:.6rem .85rem;}
  .toollog{font-family:var(--mono);font-size:10.5px;color:var(--data);background:var(--data-bg);
    border:1px dashed var(--data);border-radius:8px;padding:.4rem .6rem;margin:4px 0;display:inline-block;}
  .codeblk{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:.8rem 1rem;overflow-x:auto;color:var(--ink);line-height:1.6;white-space:pre;}
  .codeblk .cm{color:var(--faint);} .codeblk .kw{color:var(--accent);font-weight:700;} .codeblk .st{color:var(--green);}
  .srcs{font-size:10.5px;color:var(--muted);line-height:1.7;}
  .srcs a{color:var(--accent);text-decoration:none;} .srcs a:hover{text-decoration:underline;}
  .prov{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .provc{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:var(--card2);}
  .provc .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;}
  .provc .pname{font-weight:800;color:var(--navy);font-size:13px;}
  .provc .pmeta{font-size:11px;color:var(--muted);line-height:1.6;}
  .provc .pmeta b{color:var(--ink);}


  /* ════════════════ COPILOTO IA (BYOK) ════════════════ */
  .cp-fab{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;align-items:center;gap:7px;
    padding:.42rem .68rem .42rem .5rem;border-radius:var(--r-pill);border:none;cursor:pointer;color:#fff;opacity:.92;
    background:linear-gradient(135deg,#1E5FD1,#22D3EE);box-shadow:0 6px 18px rgba(30,95,209,.34),inset 0 1px 0 rgba(255,255,255,.25);
    font:800 11.5px var(--font);transition:transform .16s var(--ease),box-shadow .16s,opacity .16s;}
  .cp-fab:hover{transform:translateY(-2px);opacity:1;box-shadow:0 12px 30px rgba(30,95,209,.48);}
  .cp-fab:active{transform:translateY(0);}
  .cp-fab .spark{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;}
  .cp-fab .spark::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#22D3EE;opacity:.35;animation:livePulse 2.2s var(--ease-out) infinite;}
  .cp-fab.hide{display:none;}

  .cp-panel{position:fixed;top:0;right:0;bottom:0;width:436px;max-width:96vw;z-index:320;display:flex;flex-direction:column;
    background:var(--card);border-left:1px solid var(--line2);box-shadow:-18px 0 50px rgba(14,28,54,.20);
    transform:translateX(102%);transition:transform .32s var(--ease-out);}
  .cp-panel.open{transform:translateX(0);}
  :root[data-theme="dark"] .cp-panel{box-shadow:-18px 0 50px rgba(0,0,0,.5);}
  .cp-head{flex-shrink:0;display:flex;align-items:center;gap:11px;padding:.9rem 1rem;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--card2),var(--card));}
  .cp-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1E5FD1,#22D3EE);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(30,95,209,.4);}
  .cp-htitle{font:800 14px var(--font);color:var(--navy);letter-spacing:-.2px;line-height:1.1;}
  .cp-hsub{font-size:10px;color:var(--data);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px;margin-top:2px;}
  .cp-sel{margin-left:auto;font:700 11px var(--font);color:var(--muted);background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:.32rem .5rem;cursor:pointer;}
  .cp-x{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.14s;}
  .cp-x:hover{color:var(--red);border-color:var(--red);}
  .cp-body{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:12px;}
  .cp-foot{flex-shrink:0;border-top:1px solid var(--line);padding:.75rem .85rem;background:var(--card2);}

  /* mensajes */
  .cp-msg{max-width:88%;padding:.65rem .85rem;border-radius:14px;font-size:12.5px;line-height:1.55;word-wrap:break-word;}
  .cp-msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--a-400),var(--accent));color:#fff;border-bottom-right-radius:5px;}
  .cp-msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:5px;}
  .cp-msg.a .who{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--data);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .cp-msg.a strong{color:var(--navy);font-weight:800;} :root[data-theme="dark"] .cp-msg.a strong{color:#fff;}
  .cp-msg.a code{font-family:var(--mono);font-size:11px;background:var(--card2);padding:.03rem .3rem;border-radius:4px;border:1px solid var(--line);color:var(--accent);}
  .cp-msg.a ul{margin:.3rem 0 .3rem 1.05rem;} .cp-msg.a li{margin:.15rem 0;}
  .cp-msg.a p{margin:.4rem 0;} .cp-msg.a p:first-child{margin-top:0;} .cp-msg.a p:last-child{margin-bottom:0;}
  .cp-msg.err{align-self:flex-start;background:var(--redbg);border:1px solid var(--red-line);color:var(--red);font-weight:600;font-size:11.5px;}
  .cp-tool{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--data);
    background:var(--data-bg);border:1px dashed var(--data);border-radius:9px;padding:.32rem .6rem;}
  .cp-tool .dotp{width:6px;height:6px;border-radius:50%;background:var(--data);}
  .cp-typing{align-self:flex-start;display:flex;gap:4px;padding:.7rem .9rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:5px;}
  .cp-typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:cpb 1.2s infinite ease-in-out;}
  .cp-typing i:nth-child(2){animation-delay:.18s;} .cp-typing i:nth-child(3){animation-delay:.36s;}
  @keyframes cpb{0%,80%,100%{transform:translateY(0);opacity:.5;}40%{transform:translateY(-4px);opacity:1;}}

  /* sugerencias + input */
  .cp-sugs{display:flex;flex-direction:column;gap:7px;}
  .cp-sug{text-align:left;border:1px solid var(--line2);background:var(--card2);color:var(--ink);border-radius:11px;padding:.55rem .75rem;
    font:600 12px var(--font);cursor:pointer;transition:.14s;line-height:1.4;}
  .cp-sug:hover{border-color:var(--accent);background:var(--a-50);}
  .cp-inwrap{display:flex;gap:8px;align-items:flex-end;}
  .cp-in{flex:1;resize:none;min-height:42px;max-height:120px;border:1px solid var(--line2);border-radius:11px;padding:.6rem .75rem;
    font:500 12.5px var(--font);background:var(--card);color:var(--ink);outline:none;transition:.14s;}
  .cp-in:focus{border-color:var(--accent);box-shadow:var(--ring);}
  .cp-send{flex-shrink:0;width:42px;height:42px;border-radius:11px;border:none;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--a-400),var(--accent));box-shadow:0 2px 8px rgba(30,95,209,.3);
    display:flex;align-items:center;justify-content:center;transition:.14s;}
  .cp-send:hover{transform:translateY(-1px);} .cp-send:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .cp-disc{font-size:9.5px;color:var(--faint);text-align:center;margin-top:7px;line-height:1.4;}

  /* setup (BYOK) */
  .cp-setup{display:flex;flex-direction:column;gap:13px;}
  .cp-setup .ic{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#1E5FD1,#22D3EE);display:flex;align-items:center;justify-content:center;color:#fff;align-self:center;box-shadow:0 8px 22px rgba(30,95,209,.34);}
  .cp-setup h3{font:800 16px var(--font);color:var(--navy);text-align:center;}
  .cp-setup p{font-size:12px;color:var(--muted);line-height:1.6;}
  .cp-setup label{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
  .cp-setup input{width:100%;border:1px solid var(--line2);border-radius:10px;padding:.6rem .75rem;font:600 12.5px var(--mono);background:var(--card);color:var(--ink);outline:none;margin-top:5px;}
  .cp-setup input:focus{border-color:var(--accent);box-shadow:var(--ring);}
  .cp-warn{font-size:10.5px;color:var(--amber);background:var(--amberbg);border:1px solid var(--amber-line);border-radius:9px;padding:.6rem .7rem;line-height:1.55;}
  .cp-link{color:var(--accent);text-decoration:none;font-weight:700;} .cp-link:hover{text-decoration:underline;}
  .cp-setbtn{width:100%;padding:.65rem;border-radius:11px;border:none;cursor:pointer;color:#fff;font:800 13px var(--font);
    background:linear-gradient(135deg,var(--a-400),var(--accent));box-shadow:0 3px 12px rgba(30,95,209,.32);}
  .cp-setbtn:hover{transform:translateY(-1px);}
  @media(max-width:520px){.cp-panel{width:100vw;} .cp-fab span.lbl{display:none;}}


  /* ════════════════ PERFIL DE INVERSIONISTA ════════════════ */
  .qcard{margin-bottom:14px;}
  .qhd{display:flex;gap:11px;align-items:flex-start;margin-bottom:11px;}
  .qnum{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--brand-grad);color:#06231F;font:800 12px var(--font);display:flex;align-items:center;justify-content:center;}
  .qtxt{font:700 13.5px var(--font);color:var(--navy);line-height:1.35;}
  .qopts{display:grid;gap:7px;}
  .qopt{display:flex;align-items:center;gap:10px;padding:.6rem .8rem;border:1px solid var(--line2);border-radius:10px;background:var(--card2);
    cursor:pointer;font:600 12.5px var(--font);color:var(--ink);transition:.13s var(--ease);text-align:left;}
  .qopt:hover{border-color:var(--a-200);background:var(--a-50);}
  .qopt.on{border-color:transparent;background:linear-gradient(180deg,var(--a-400),var(--accent));color:#fff;box-shadow:0 2px 9px rgba(30,95,209,.26);}
  .qopt .qb{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);}
  .qopt.on .qb{border-color:#fff;background:radial-gradient(circle,#fff 38%,transparent 42%);}
  .prof-hero{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:1.6rem 1.7rem;color:#fff;box-shadow:var(--sh-lg);}
  .prof-hero.cons{background:linear-gradient(125deg,#0A4A3A,#0B8457);}
  .prof-hero.mod{background:linear-gradient(125deg,#0A1E3D,#1E5FD1);}
  .prof-hero.agr{background:linear-gradient(125deg,#5B1A1E,#CE2F3B);}
  .prof-hero::after{content:"";position:absolute;right:-50px;top:-50px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);}
  .prof-hero .pl{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;opacity:.8;}
  .prof-hero h1{font:800 28px var(--font);letter-spacing:-.5px;margin:6px 0 8px;position:relative;}
  .prof-hero p{font-size:13px;opacity:.94;line-height:1.6;max-width:640px;position:relative;}
  .prof-bar{height:9px;border-radius:6px;background:rgba(255,255,255,.22);margin-top:14px;overflow:hidden;position:relative;}
  .prof-bar i{display:block;height:100%;background:#fff;border-radius:6px;}
  .prof-scale{display:flex;justify-content:space-between;font-size:10px;font-weight:700;opacity:.85;margin-top:5px;}
  .prof-scale5{display:flex;gap:6px;margin-top:14px;position:relative;}
  .prof-scale5 span{flex:1;text-align:center;font:800 11px var(--font);padding:5px 0;border-radius:7px;background:rgba(255,255,255,.16);opacity:.7;}
  .prof-scale5 span.on{background:#fff;color:var(--navy);opacity:1;box-shadow:0 2px 9px rgba(0,0,0,.18);transform:scale(1.06);}
  /* question groups */
  .prof-grp{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;padding-bottom:13px;border-bottom:1px solid var(--line);}
  .prof-grp-tag{flex:0 0 auto;width:34px;height:34px;border-radius:9px;color:#fff;font:800 12px var(--font);display:flex;align-items:center;justify-content:center;}
  .prof-grp-n{font:800 15px var(--font);color:var(--navy);}
  .prof-grp-s{font-size:11.5px;color:var(--mut);margin-top:2px;line-height:1.4;}
  /* filas del cuestionario de perfil: pregunta arriba (ancho completo), opciones en grilla pareja abajo */
  .pqrow{display:block;padding:14px 0;border-bottom:1px dashed var(--line);}
  .pqrow:last-child{border-bottom:none;padding-bottom:2px;}
  .pqrow .qtxt{margin-bottom:11px;font-size:13.5px;}
  .pqrow .qopts{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px;}
  .qrow{padding:11px 0;border-bottom:1px dashed var(--line);}
  .qrow:last-child{border-bottom:none;padding-bottom:2px;}
  .qrow .qtxt{margin-bottom:9px;}
  .qhint{font-weight:600;color:var(--mut);font-size:11px;}
  .qopt .qb.sq{border-radius:5px;}
  .qopt.on .qb.sq{background:#fff;}
  /* dimension breakdown */
  .prof-dim{margin-bottom:15px;}
  .prof-dim:last-child{margin-bottom:0;}
  .prof-dim-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px;}
  .prof-dim-n{font:800 13.5px var(--font);color:var(--navy);}
  .prof-dim-s{font-size:11px;color:var(--mut);margin-top:1px;}
  .prof-dim-v{flex:0 0 auto;font-size:11px;color:var(--mut);font-weight:700;text-align:right;white-space:nowrap;}
  .prof-dim-v b{font-size:16px;color:var(--navy);font-weight:800;}
  .prof-dim-bar{height:8px;border-radius:5px;background:var(--surface);overflow:hidden;}
  .prof-dim-bar i{display:block;height:100%;border-radius:5px;transition:width .4s var(--ease);}
  .prof-dim-lvl{font-size:10.5px;font-weight:700;color:var(--mut);margin-top:4px;}
  .prof-flags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .prof-flag{font:700 11px var(--font);padding:.34rem .62rem;border-radius:7px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);}
  .prof-flag.warn{background:#FEF3E2;border-color:#F4C77B;color:#9A5B0B;}
  .prof-flag.block{background:#FDECEC;border-color:#F1B0B0;color:#A52121;}
  .prof-flag.ok{background:#E6F6EF;border-color:#9BD9BE;color:#0A6B47;}
  .prof-flag.info{background:#EEF1FB;border-color:#BAC6EE;color:#3653A4;}
  [data-theme="dark"] .prof-flag.warn{background:#3A2C12;border-color:#6B4F1E;color:#F0C078;}
  [data-theme="dark"] .prof-flag.block{background:#3A1A1A;border-color:#6B2A2A;color:#F0A0A0;}
  [data-theme="dark"] .prof-flag.ok{background:#10311F;border-color:#1E6B47;color:#7AD6A8;}
  [data-theme="dark"] .prof-flag.info{background:#1A2240;border-color:#33437A;color:#A0B4F0;}
  /* allocation bar */
  .prof-alloc-bar{display:flex;height:26px;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);}
  .prof-alloc-bar span{display:block;height:100%;}
  .prof-alloc-leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;font-size:11.5px;font-weight:700;color:var(--ink);}
  .prof-alloc-leg span{display:flex;align-items:center;gap:6px;}
  .prof-alloc-leg i{width:11px;height:11px;border-radius:3px;display:inline-block;}
  /* goal inputs */
  .prof-goal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px;}
  .prof-goal label{display:flex;flex-direction:column;gap:5px;font:700 11px var(--font);color:var(--mut);}
  .prof-goal input,.prof-goal select{padding:.5rem .6rem;border:1px solid var(--line2);border-radius:9px;background:var(--card);font:700 13px var(--font);color:var(--ink);}
  .prof-goal input:focus,.prof-goal select:focus{outline:none;border-color:var(--accent);}

  /* ════════════════ IMPORTAR ACCIONES ════════════════ */
  .imp-drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:1.7rem;text-align:center;background:var(--surface);transition:.15s;cursor:pointer;}
  .imp-drop:hover,.imp-drop.drag{border-color:var(--accent);background:var(--a-50);}
  .imp-drop .di{width:48px;height:48px;border-radius:14px;background:var(--brand-grad);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 6px 18px rgba(30,95,209,.3);}
  .imp-drop b{color:var(--navy);font-size:14px;} .imp-drop span{color:var(--muted);font-size:12px;}
  .imp-steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .imp-step{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--faint);padding:.35rem .7rem;border-radius:var(--r-pill);background:var(--card2);border:1px solid var(--line);}
  .imp-step.on{color:#fff;background:var(--accent);border-color:transparent;}
  .imp-step.done{color:var(--green);border-color:var(--green-line);background:var(--greenbg);}
  .imp-table-prev{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);}
  .imp-table-prev table{font-size:11.5px;} .imp-table-prev th{font-size:9px;}
  .imp-cfgrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
  .imp-cfgrow .genl{margin-bottom:7px;}
  .imp-tmpl{font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.7rem .9rem;overflow-x:auto;white-space:pre;color:var(--ink);line-height:1.6;}
  .imp-banner{display:flex;align-items:center;gap:11px;padding:.7rem 1rem;border-radius:var(--r-sm);background:var(--data-bg);border:1px solid var(--data);color:var(--data);font-size:12px;font-weight:700;}
  .imp-banner .btn{margin-left:auto;}


  /* ════════════════ CONFIGURACIÓN (modal) ════════════════ */
  .iconbtn.gear svg{transition:transform .4s var(--ease);}
  .iconbtn.gear:hover svg{transform:rotate(60deg);}
  .cfg-back{position:fixed;inset:0;z-index:330;background:rgba(8,16,30,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;}
  .cfg-back.open{display:flex;animation:cfgFade .18s ease;}
  @keyframes cfgFade{from{opacity:0}to{opacity:1}}
  .cfg-modal{width:740px;max-width:96vw;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line2);
    border-radius:var(--r-lg);box-shadow:var(--sh-lg);animation:cfgRise .26s var(--ease-out);}
  @keyframes cfgRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  /* layout con pestañas: nav de categorías a la izquierda, contenido a la derecha */
  .cfg-layout{display:flex;flex:1;min-height:0;}
  .cfg-nav{flex:0 0 168px;border-right:1px solid var(--line);padding:.7rem .55rem;display:flex;flex-direction:column;gap:3px;background:var(--soft);overflow-y:auto;}
  .cfg-nav button{display:flex;align-items:center;gap:9px;padding:.55rem .7rem;border:none;background:none;border-radius:9px;
    font:700 12.5px var(--font);color:var(--muted);cursor:pointer;text-align:left;transition:.13s var(--ease);white-space:nowrap;}
  .cfg-nav button svg{flex:0 0 auto;opacity:.8;}
  .cfg-nav button:hover{background:var(--card);color:var(--ink);}
  .cfg-nav button.on{background:linear-gradient(180deg,var(--a-400),var(--accent));color:#fff;box-shadow:0 2px 9px rgba(30,95,209,.3);}
  .cfg-nav button.on svg{opacity:1;}
  .cfg-body{flex:1;min-width:0;overflow-y:auto;padding-bottom:.4rem;}
  .cfg-body .cfg-sec+.cfg-sec{border-top:1px solid var(--line);}
  @media(max-width:640px){
    .cfg-layout{flex-direction:column;}
    .cfg-nav{flex:0 0 auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:.5rem .55rem;}
  }
  .cfg-head{display:flex;align-items:center;gap:11px;padding:1rem 1.2rem;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--card2),var(--card));position:sticky;top:0;z-index:2;}
  .cfg-head .cp-mark{width:34px;height:34px;}
  .cfg-htitle{font:800 15px var(--font);color:var(--navy);letter-spacing:-.2px;}
  .cfg-sec{padding:1.05rem 1.2rem;border-top:1px solid var(--line);}
  .cfg-sec:first-of-type{border-top:none;}
  .cfg-sl{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;align-items:center;gap:8px;}
  .cfg-sl .cd{width:7px;height:7px;border-radius:50%;background:var(--brand-grad);}
  .cfg-row{display:flex;align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap;}
  .cfg-row+.cfg-row{margin-top:11px;}
  .cfg-fldrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:12px;}
  .cfg-fld{display:flex;flex-direction:column;gap:5px;font:700 10.5px var(--font);color:var(--muted);}
  .cfg-fld input{padding:.45rem .55rem;border:1px solid var(--line2);border-radius:9px;background:var(--card);font:700 13px var(--font);color:var(--ink);}
  .cfg-fld input:focus{outline:none;border-color:var(--accent);}
  /* resultado neto en contabilidad */
  .net-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .net-it{display:flex;flex-direction:column;gap:2px;}
  .net-it span{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--mut);}
  .net-it b{font:800 16px var(--font);color:var(--navy);}
  .net-it.big b{font-size:21px;}
  .net-it.big span{color:var(--accent);}
  .net-op{font:800 18px var(--font);color:var(--faint);padding:0 2px;align-self:flex-end;line-height:1.8;}
  .cfg-k{font-size:12.5px;color:var(--ink);font-weight:600;}
  .cfg-k b{color:var(--navy);} .cfg-sub{font-size:10.5px;color:var(--faint);margin-top:2px;}
  .cfg-seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--card2);}
  .cfg-seg button{border:none;background:transparent;padding:.42rem .8rem;font:700 12px var(--font);color:var(--muted);cursor:pointer;}
  .cfg-seg button.on{color:#fff;background:linear-gradient(180deg,var(--a-400),var(--accent));}
  .cfg-pill{font-size:10px;font-weight:800;padding:.18rem .5rem;border-radius:var(--r-pill);}
  .cfg-pill.ok{color:var(--green);background:var(--greenbg);border:1px solid var(--green-line);}
  .cfg-pill.no{color:var(--amber);background:var(--amberbg);border:1px solid var(--amber-line);}

  /* ════════════════ IMPORT · archivos cargados ════════════════ */
  .imp-files{display:flex;flex-direction:column;gap:8px;}
  .imp-frow{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:11px;padding:.55rem .75rem;border:1px solid var(--line);border-radius:10px;background:var(--card2);}
  .imp-frow .fdot{width:10px;height:10px;border-radius:3px;}
  .imp-frow input.tk{width:120px;border:1px solid var(--line2);border-radius:8px;padding:.32rem .5rem;font:800 12px var(--font);color:var(--ink);background:var(--card);text-align:left;}
  .imp-frow .src{font-size:10.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .imp-frow .meta{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;}
  .imp-frow .rm{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:12px;}
  .imp-frow .rm:hover{color:var(--red);border-color:var(--red);}

  /* ════════════════ PULIDO VISUAL v2 ════════════════ */
  .iconbtn{position:relative;overflow:hidden;}
  .iconbtn:hover{box-shadow:0 4px 13px rgba(30,95,209,.16);}
  .iconbtn:active{transform:translateY(0) scale(.93);transition-duration:.06s;}
  .iconbtn.gear:hover svg{transform:rotate(75deg) scale(1.04);}
  .topbar{position:relative;}
  .topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,var(--a-400) 38%,var(--accent) 62%,transparent);opacity:.34;}
  .tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);}
  .tile::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;border-radius:8px 8px 0 0;
    background:var(--brand-grad);opacity:0;transition:opacity .18s var(--ease-out);}
  .tile{position:relative;}
  .tile:hover::before{opacity:.85;}
  .mkpill .live-dot{box-shadow:0 0 0 0 rgba(14,140,94,.5);animation:lvPulse 2.4s ease-out infinite;}
  @keyframes lvPulse{0%{box-shadow:0 0 0 0 rgba(14,140,94,.5)}70%{box-shadow:0 0 0 6px rgba(14,140,94,0)}100%{box-shadow:0 0 0 0 rgba(14,140,94,0)}}
  .btn-pri{transition:transform .14s var(--ease-out),box-shadow .14s var(--ease-out),filter .14s;}
  .btn-pri:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(30,95,209,.34);filter:saturate(1.06);}
  .btn-pri:active{transform:translateY(0);box-shadow:0 2px 7px rgba(30,95,209,.3);}
  .cfg-modal::-webkit-scrollbar{width:9px;}
  .cfg-modal::-webkit-scrollbar-thumb{border-radius:6px;background:var(--line2);border:2px solid var(--card);}
  .cfg-seg button{transition:color .15s,background .2s var(--ease-out);}
  .imp-frow{transition:border-color .15s,box-shadow .15s,transform .12s;}
  .imp-frow:hover{border-color:var(--line2);box-shadow:var(--sh-xs);transform:translateX(1px);}
  .badge.pos{position:relative;}

  /* ════════════════ MERCADOS · indicadores en vivo ════════════════ */
  .mkt-gl{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);
    margin:18px 0 11px;display:flex;align-items:center;gap:8px;}
  .mkt-gl:first-child{margin-top:2px;}
  .mkt-gl .cd{width:7px;height:7px;border-radius:50%;background:var(--brand-grad);}
  .mkt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:12px;}
  .mkt-tile{position:relative;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card2);
    padding:.85rem .95rem;overflow:hidden;transition:transform .15s var(--ease-out),box-shadow .15s,border-color .15s;}
  .mkt-tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--line2);}
  .mkt-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand-grad);opacity:.7;}
  .mkt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .mkt-name{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1px;}
  .mkt-val{font:800 19px var(--font);color:var(--navy);letter-spacing:-.4px;margin-top:5px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
  .mkt-na{color:var(--faint);font-weight:700;}
  .mkt-chg{font-size:11px;font-weight:800;padding:.08rem .4rem;border-radius:var(--r-pill);}
  .mkt-chg.up{color:var(--green);background:var(--greenbg);}
  .mkt-chg.dn{color:var(--red);background:var(--redbg);}
  .mkt-spark{display:block;width:100%;height:26px;margin:8px 0 4px;}
  .mkt-date{font-size:10px;color:var(--faint);font-weight:600;}
  .mkt-manform{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .mkt-manform input{border:1px solid var(--line2);border-radius:9px;padding:.5rem .6rem;font:600 12.5px var(--font);color:var(--ink);background:var(--card);}
  .mkt-manform input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,209,.16);}

  /* ════════════════ NAV SUPERIOR (Mercados / Perfil) ════════════════ */
  .tnav{display:flex;gap:8px;}
  .topnav{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 .95rem;border-radius:11px;
    border:1px solid var(--line2);background:var(--card);color:var(--muted);font:700 13px var(--font);
    cursor:pointer;transition:.15s var(--ease);box-shadow:var(--sh-xs);white-space:nowrap;}
  .topnav svg{opacity:.82;flex:0 0 auto;}
  .topnav:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 13px rgba(30,95,209,.16);}
  .topnav.on{color:#fff;background:linear-gradient(180deg,var(--a-400),var(--accent));border-color:transparent;box-shadow:0 3px 11px rgba(30,95,209,.32);}
  .topnav.on svg{opacity:1;}
  .topnav-home{font-weight:800;}
  .topnav-home:not(.on){color:var(--accent);border-color:var(--accent);background:var(--a-50);}
  .beta-tag{font:800 8px var(--font);letter-spacing:.6px;text-transform:uppercase;padding:2px 5px 1px;border-radius:6px;
    background:#7C3AED;color:#fff;line-height:1;margin-left:-1px;box-shadow:0 1px 3px rgba(124,58,237,.3);}
  .topnav-beta:not(.on){border-color:rgba(124,58,237,.42);}
  .topnav-beta:not(.on) svg{color:#7C3AED;opacity:.95;}
  .topnav.on .beta-tag{background:rgba(255,255,255,.28);color:#fff;box-shadow:none;}
  @media(max-width:1080px){.topnav{padding:0 .62rem;font-size:12px;}.topnav .beta-tag{display:none;}}

  /* ════════════════ META DE ANÁLISIS (ventana de datos) ════════════════ */
  .eval-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 16px;padding:.5rem .85rem;
    border:1px solid var(--line);border-radius:10px;background:var(--card2);font-size:11.5px;color:var(--muted);font-weight:600;}
  .eval-meta svg{color:var(--accent);opacity:.85;flex-shrink:0;}
  .eval-meta b{color:var(--navy);font-weight:800;}
  .eval-meta .dot{color:var(--faint);}

  /* ════════════════════════ OVERHAUL PRO v3 ════════════════════════ */
  /* ---- Sidebar: más aire, jerarquía y acabado premium ---- */
  aside{width:252px;background:linear-gradient(174deg,#081A37 0%,#0E2A55 54%,#0A2046 100%);
    box-shadow:inset -1px 0 0 rgba(255,255,255,.05),5px 0 26px rgba(5,14,33,.30);}
  .brand{padding:1.45rem 1.25rem 1.25rem;gap:13px;border-bottom:1px solid rgba(255,255,255,.08);
    background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);}
  .brand-mark{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:none;border:none;border-radius:0;
    filter:drop-shadow(0 7px 18px rgba(37,99,235,.42));}
  .beye{font-size:8px;letter-spacing:2.1px;color:#8FA6CE;opacity:.95;margin-bottom:6px;font-weight:800;}
  .bt{font-size:25px;letter-spacing:-.6px;font-weight:850;line-height:1.08;
    background:linear-gradient(176deg,#FFFFFF 0%,#CADFF7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;}
  .wm-dot{margin-bottom:5px;box-shadow:0 0 0 3px rgba(34,211,238,.22),0 0 11px rgba(34,211,238,.55);}

  .snav{padding:1rem .72rem .85rem;}
  .sgroup{font-size:8px;letter-spacing:2.5px;color:#5D77A1;padding:.35rem .72rem .6rem;margin-top:.1rem;}
  .modbtn{padding:.74rem .72rem;font-size:13px;font-weight:650;color:#C0D3EB;border-radius:12px;gap:12px;margin-bottom:5px;
    border:1px solid transparent;background:transparent;}
  .modbtn:hover{background:rgba(255,255,255,.06);color:#fff;transform:none;}
  .modbtn .mi{width:33px;height:33px;border-radius:10px;background:rgba(255,255,255,.06);color:#8FB9F5;
    border:1px solid rgba(255,255,255,.05);box-shadow:none;}
  .modbtn.on{color:#fff;background:linear-gradient(135deg,rgba(56,132,255,.32),rgba(34,211,238,.11));
    border-color:rgba(125,172,247,.42);box-shadow:0 11px 26px rgba(4,14,34,.55),inset 0 0 0 1px rgba(255,255,255,.05);}
  .modbtn.on .mi{background:linear-gradient(135deg,#3D8BFF,#22D3EE);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(34,150,238,.55);}
  .modbtn.on::before{left:-7px;height:23px;}
  .modbtn.slim{padding:.55rem .72rem;font-size:12.5px;margin-bottom:3px;}
  .modbtn.slim .mi{width:27px;height:27px;border-radius:8px;}

  .subtabs{margin:3px 0 15px 17px;padding-left:13px;border-left:1px solid rgba(255,255,255,.10);}
  .tab{padding:.52rem .7rem;font-size:12px;color:#94A9C7;border-radius:8px;border-left:none;margin-bottom:1px;}
  .tab:hover{background:rgba(255,255,255,.055);color:#fff;}
  .tab .num{width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.07);color:#9FB8D8;font-size:9.5px;
    display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
  .tab.on{background:rgba(61,139,255,.17);color:#fff;font-weight:700;border-left:none;}
  .tab.on .num{background:linear-gradient(135deg,#3D8BFF,#22D3EE);color:#fff;}

  .sfoot{padding:1rem 1.2rem;font-size:9.5px;color:#647CA4;line-height:1.95;background:rgba(0,0,0,.16);
    border-top:1px solid rgba(255,255,255,.07);}
  .sfoot b{color:#A3B9D8;font-weight:700;}

  /* ---- Topbar + título que resalta ---- */
  .topbar{height:66px;gap:16px;padding:0 1.5rem;box-shadow:0 1px 0 var(--line),0 8px 22px rgba(15,38,80,.05);}
  .tbar{width:4px;height:40px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--accent2));
    box-shadow:0 0 15px rgba(34,211,238,.45);}
  .crumb{font-size:8.5px;letter-spacing:1.8px;color:var(--indigo);margin-bottom:5px;opacity:.95;font-weight:800;}
  .ptitle{font-size:20px;font-weight:850;letter-spacing:-.5px;color:var(--navy);}

  /* ---- Barra de contexto de Análisis + Nuevo análisis ---- */
  .eval-meta{padding:.62rem .6rem .62rem .95rem;gap:10px;}
  .em-spacer{flex:1;}
  .em-tag{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:.2rem .55rem;border-radius:var(--r-pill);
    color:var(--muted);background:var(--card);border:1px solid var(--line2);white-space:nowrap;}
  .em-tag.imp{color:var(--accent);border-color:var(--accent);background:rgba(30,95,209,.06);}
  .em-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;
    background:linear-gradient(180deg,var(--a-400),var(--accent));color:#fff;font:800 11.5px var(--font);
    padding:.42rem .75rem;border-radius:9px;cursor:pointer;box-shadow:0 3px 11px rgba(30,95,209,.30);transition:.14s var(--ease-out);white-space:nowrap;}
  .em-btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px rgba(30,95,209,.40);filter:saturate(1.05);}
  .em-btn:active{transform:translateY(0);}
  .em-btn svg{width:13px;height:13px;}

  /* ════════ Multifactor: nota discreta (sin caja amarilla) ════════ */
  .mfdisc{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:var(--r-lg);font-weight:500;}
  .mfdisc b{color:var(--navy);}
  .mfdisc>span:first-child{display:none;}
  /* ════════ Análisis guardados (proyectos de importación) ════════ */
  .impset-list{display:flex;flex-direction:column;gap:9px;}
  .impset{display:flex;align-items:center;gap:12px;padding:.6rem .8rem;border:1px solid var(--line);border-radius:11px;background:var(--card2);transition:border-color .15s,box-shadow .15s,transform .12s;}
  .impset:hover{border-color:var(--line2);box-shadow:var(--sh-xs);transform:translateX(1px);}
  .impset.on{border-color:var(--accent);background:rgba(30,95,209,.05);box-shadow:0 0 0 1px var(--accent) inset;}
  .impset-dot{width:9px;height:9px;border-radius:3px;background:var(--line2);flex-shrink:0;}
  .impset.on .impset-dot{background:var(--brand-grad);}
  .impset-main{flex:1;min-width:0;}
  .impset-name{width:100%;max-width:340px;border:1px solid transparent;background:transparent;font:800 13px var(--font);color:var(--navy);padding:.2rem .35rem;border-radius:7px;letter-spacing:-.2px;}
  .impset-name:hover{border-color:var(--line);}
  .impset-name:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px rgba(30,95,209,.14);}
  .impset-meta{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:2px;padding-left:.35rem;}
  .impset-act{padding:.4rem .7rem;font-size:12px;}
  .impset-del{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;flex-shrink:0;}
  .impset-del:hover{color:var(--red);border-color:var(--red);}

  /* ════════════ Operar: compra/venta ════════════ */
  .op-form{display:flex;flex-direction:column;gap:14px;}
  .op-side{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--card2);width:max-content;}
  .op-side .opbtn{border:none;background:transparent;padding:.5rem 1.15rem;font:800 13px var(--font);color:var(--muted);cursor:pointer;transition:.14s var(--ease-out);}
  .op-side .opbtn.buy.on{color:#fff;background:linear-gradient(180deg,#1BAE6E,#0E8C5E);}
  .op-side .opbtn.sell.on{color:#fff;background:linear-gradient(180deg,#E0574E,#C0392B);}
  .op-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px;}
  .op-grid .genl{margin-bottom:6px;}
  .op-grid input,.op-grid select{width:100%;padding:.55rem .6rem;border:1px solid var(--line2);border-radius:9px;background:var(--card);font:600 13px var(--font);color:var(--ink);}
  .op-grid input:focus,.op-grid select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,209,.14);}
  .op-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;}
  .op-amt{font-size:13px;color:var(--muted);font-weight:600;}
  .op-amt b{color:var(--navy);font-size:17px;font-weight:850;margin-left:5px;}

  /* ════════════ Inyectar capital: filas compra ════════════ */
  .inj-head,.inj-row{display:grid;grid-template-columns:1fr 120px 130px 110px 34px;gap:10px;align-items:center;}
  .inj-head{padding:0 .2rem 3px;font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
  .inj-list{display:flex;flex-direction:column;gap:8px;}
  .inj-row select,.inj-row input{width:100%;padding:.5rem .55rem;border:1px solid var(--line2);border-radius:9px;background:var(--card);font:600 12.5px var(--font);color:var(--ink);}
  .inj-row select:focus,.inj-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,209,.14);}
  .inj-row input[type=number]{text-align:right;}
  .inj-monto{font-size:12.5px;font-weight:800;color:var(--navy);text-align:right;}
  .inj-rm{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--muted);cursor:pointer;}
  .inj-rm:hover{color:var(--red);border-color:var(--red);}
  .inj-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:15px;}
  @media(max-width:720px){.inj-head{display:none}.inj-row{grid-template-columns:1fr 1fr;}}

  /* ════════════════ ACCESO CONTROLADO (login) ════════════════ */
  .auth-gate{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1100px 620px at 72% -12%,#143a78 0%,#0A1E3D 56%,#06142C 100%);}
  .auth-gate.open{display:flex;animation:agFade .3s ease;}
  @keyframes agFade{from{opacity:0}to{opacity:1}}
  .auth-card{width:404px;max-width:94vw;background:var(--card);border:1px solid var(--line2);border-radius:20px;
    box-shadow:0 34px 90px rgba(3,10,26,.62);padding:2rem 1.9rem 1.55rem;animation:agRise .4s var(--ease-out);}
  @keyframes agRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .auth-brand{display:flex;align-items:center;gap:13px;margin-bottom:1.45rem;}
  .auth-mark{width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex-shrink:0;filter:drop-shadow(0 9px 22px rgba(37,99,235,.45));}
  .auth-eye{font-size:8px;letter-spacing:2.1px;color:var(--accent);font-weight:800;text-transform:uppercase;margin-bottom:5px;}
  .auth-wm{font:850 23px var(--font);letter-spacing:-.5px;color:var(--navy);line-height:1;}
  .auth-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand-grad);margin-left:4px;vertical-align:baseline;}
  .auth-h{font:850 20px var(--font);color:var(--navy);letter-spacing:-.4px;}
  .auth-sub{font-size:12px;color:var(--muted);margin:5px 0 18px;line-height:1.5;}
  .auth-f{margin-bottom:13px;}
  .auth-f label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .auth-f input{width:100%;padding:.72rem .8rem;border:1px solid var(--line2);border-radius:11px;background:var(--card2);font:600 14px var(--font);color:var(--ink);}
  .auth-f input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,95,209,.15);background:var(--card);}
  .auth-msg{font-size:11.5px;color:var(--amber);background:var(--amberbg);border:1px solid var(--amber-line);border-radius:9px;padding:.55rem .7rem;margin-bottom:13px;font-weight:600;}
