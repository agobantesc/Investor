/* "jul-24" → "2024-07-15" (día medio del mes, para no chocar con fechas diarias de seguimiento) */
function labelToDate(lab){const M={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,oct:10,nov:11,dic:12};const p=(""+lab).split("-");const mo=M[(p[0]||"").toLowerCase()]||1;const yy=parseInt(p[1],10);const yr=isNaN(yy)?2025:(yy<100?2000+yy:yy);
  // representante mensual en DÍA HÁBIL: si el 15 cae sábado/domingo se corre a viernes/lunes (si no, el saneo de fin de semana borraría el dato mensual)
  let day=15;const wd=new Date(Date.UTC(yr,mo-1,15)).getUTCDay();if(wd===6)day=14;else if(wd===0)day=16;
  return yr+"-"+String(mo).padStart(2,"0")+"-"+String(day).padStart(2,"0");}
/* histórico de precios por acción + IPSA: universo de análisis (todo el historial disponible) + lo ingresado en los seguimientos */
function consolidatedSeries(){
  const tick={},names={},cols={},ipsaMap={};
  // 1) base del sistema (PRICEDB): TODAS las acciones con data histórica cargada
  try{if(typeof PRICEDB!=="undefined"&&PRICEDB){
    if(PRICEDB.px&&Object.keys(PRICEDB.px).length){
      Object.keys(PRICEDB.tickers||{}).forEach(t=>{const m=PRICEDB.tickers[t]||{};names[t]=m.n||t;cols[t]=m.c||cols[t]||"#1E5FD1";});
      Object.keys(PRICEDB.px).forEach(t=>{names[t]=names[t]||t;Object.keys(PRICEDB.px[t]).forEach(d=>{const v=PRICEDB.px[t][d];if(v>0&&isFinite(v))(tick[t]=tick[t]||{})[d]=v;});});
    }
    // el índice se incluye aunque aún no haya acciones en la base (p.ej. se cargó primero la planilla del IPSA)
    Object.keys(PRICEDB.ipsa||{}).forEach(d=>{const v=PRICEDB.ipsa[d];if(v>0&&isFinite(v))ipsaMap[d]=v;});
  }}catch(e){}
  // (sin fallback sintético: las métricas del Home usan SOLO datos reales — base del sistema + seguimientos)
  // 2) overlay: precios reales ingresados en los seguimientos (añaden fechas recientes / sobrescriben)
  allTrackedProjects().forEach(({p})=>{
    (p.holdings||[]).forEach(hd=>{names[hd.t]=hd.n||names[hd.t]||hd.t;cols[hd.t]=cols[hd.t]||hd.c||"#1E5FD1";});
    (p.weeks||[]).forEach(w=>{
      if(w.ev)return;   // semana de OPERACIÓN (compra/venta/aporte): es CONTABILIDAD, no un cierre de mercado → nunca alimenta la serie del índice ni de precios (evita días fantasma como un 29/06 arrastrado)
      if(!isTradingDay(w.date))return;   // solo días hábiles en la serie de mercado
      if(w.ipsa!=null&&isFinite(w.ipsa)&&w.ipsa>0&&w.ipsaFresh!==false)ipsaMap[w.date]=w.ipsa;   // no superpone IPSA arrastrado (cierre sin valor real del índice)
      const fresh=w.fresh;   // si el cierre marcó qué tickers son REALES de ese día, ignora los arrastrados (carry-forward) para no generar retornos 0% espurios
      const pr=w.prices||{};Object.keys(pr).forEach(t=>{if(fresh&&fresh.indexOf(t)<0)return;const v=pr[t];if(v==null||!isFinite(v)||v<=0)return;(tick[t]=tick[t]||{})[w.date]=v;});
    });
  });
  return {tick,names,cols,ipsaMap};
}
function periodKey(dateStr,freq){
  if(freq==="mensual")return (""+dateStr).slice(0,7);
  if(freq==="semanal"){const d=new Date(dateStr+"T00:00:00");const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const ys=new Date(Date.UTC(t.getUTCFullYear(),0,1));const wk=Math.ceil((((t-ys)/864e5)+1)/7);return t.getUTCFullYear()+"-W"+String(wk).padStart(2,"0");}
  return ""+dateStr;
}
/* reduce un mapa fecha→valor a puntos por período (último de cada período) */
function resampleMap(map,freq){const dates=Object.keys(map).sort();const byP={};dates.forEach(d=>{byP[periodKey(d,freq)]={d,v:map[d]};});return Object.keys(byP).sort().map(k=>byP[k]);}
/* quita del FINAL las RACHAS de valores idénticos: son arrastres (carry-forward), no cierres reales.
   Exige ≥2 repeticiones seguidas: un único cierre plano puede ser real (papel ilíquido) y no se toca. */
function dropTrailingFlat(rs){let k=0;const n=rs.length;while(n-2-k>=0&&rs[n-1-k].v===rs[n-2-k].v)k++;return k>=2?rs.slice(0,n-k):rs;}
/* base MÓVIL: fecha as-of ~7 días (semanal) o ~1 mes calendario (mensual) ANTES de lastD en el mapa.
   El período calendario en curso es PARCIAL (un "mensual" el día 3 compararía solo 3 días y mostraría
   cualquier cosa): los retornos de vitrina (Home) usan el período móvil completo. Devuelve null en diario
   o con datos ralos (→ se usa el par de períodos consecutivos de siempre). */
function pdTrailingBase(map,lastD,freq){
  if(freq==="diario")return null;
  const t0=new Date(lastD+"T00:00:00");if(freq==="semanal")t0.setDate(t0.getDate()-7);else{const d0=t0.getDate();t0.setMonth(t0.getMonth()-1);if(t0.getDate()!==d0)t0.setDate(0);}   // 31-mar − 1 mes = 28-feb, no 3-mar (sin desborde de fin de mes)
  const tgt=localDay(t0);let base=null;
  for(const d of Object.keys(map).sort()){if(d>lastD)break;if(d<=tgt)base=d;}
  if(base==null||base===lastD)return null;
  const off=(new Date(tgt+"T00:00:00")-new Date(base+"T00:00:00"))/864e5;
  return off>(freq==="semanal"?5:12)?null:base;   // demasiado lejos del objetivo → no hay datos finos para un período móvil real
}
function periodIndex(dateStr,freq){const d=new Date(dateStr+"T00:00:00");if(freq==="mensual")return d.getFullYear()*12+d.getMonth();if(freq==="semanal"){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);return Math.round(t.getTime()/(7*864e5));}return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
/* ¿dos puntos resampleados son de períodos consecutivos? (en diario se toleran fines de semana/feriado) */
function gapOK(d0,d1,freq){if(freq==="diario"){const g=(new Date(d1+"T00:00:00")-new Date(d0+"T00:00:00"))/864e5;return g>0&&g<=4;}return (periodIndex(d1,freq)-periodIndex(d0,freq))===1;}
/* métricas por acción a partir del historial real ingresado (no del análisis) */
function seguimientoStats(freq){
  const C=consolidatedSeries();
  // REGLA 2: cada acción muestra su ÚLTIMO registro disponible a esta frecuencia (con su fecha), no se exige que sea el más reciente del sistema.
  // Solo se requiere que el último tramo sea entre períodos CONSECUTIVOS (retorno real a la cadencia elegida); una acción solo-mensual no aparece en diario porque no tiene dos días consecutivos.
  // Nota: Sharpe y α de Jensen NO se calculan aquí. Son métricas anualizadas de horizonte largo y anualizar la
  // ventana corta del toggle (pocos días/semanas) las dispara; el Sharpe y el α de cada cartera se ven en Proyectos.
  const out=[];
  Object.keys(C.tick).forEach(t=>{
    const rs=dropTrailingFlat(resampleMap(C.tick[t],freq));if(rs.length<2)return;   // ignora arrastres finales (carry-forward): usa el último movimiento real
    const vals=rs.map(x=>x.v);
    // solo retornos entre períodos consecutivos (evita que un hueco se cuente como un período y distorsione la anualización)
    const rets=[];for(let i=1;i<vals.length;i++){if(gapOK(rs[i-1].d,rs[i].d,freq))rets.push(vals[i]/vals[i-1]-1);}
    // rentabilidad del último período: MÓVIL si hay datos finos (pdTrailingBase) y, si no, el último par de
    // períodos CONSECUTIVOS — en ese ORDEN, el mismo que ipsaSnapshot: el ranking del Home y la tarjeta del
    // índice aplican reglas idénticas, y una acción con base móvil válida no queda excluida por un hueco
    const lastD=rs[rs.length-1].d,tb=pdTrailingBase(C.tick[t],lastD,freq);
    let lastRet=null;
    if(tb!=null&&C.tick[t][tb]>0)lastRet=rs[rs.length-1].v/C.tick[t][tb]-1;
    else if(gapOK(rs[rs.length-2].d,rs[rs.length-1].d,freq)&&rets.length)lastRet=rets[rets.length-1];
    if(lastRet==null)return;
    out.push({t,name:C.names[t]||t,col:C.cols[t]||"#1E5FD1",ret:lastRet*100,n:vals.length,series:vals,lastDate:lastD});
  });
  return out;
}

/* agrega un punto de valoración (precios de cierre) a TODOS los proyectos con seguimiento */
function applyPlatformPrices(date,ipsa,priceMap){
  if(!validBaseDate(date))return {nProj:0,nCli:0,nSkip:0,invalid:true};   // fecha que no corresponde (fin de semana o futura): no se registra nada
  // FUENTE ÚNICA DE LA VERDAD: con la fuente automática configurada, el IPSA nunca se ingresa a mano —
  // un valor manual erróneo ensuciaba el histórico del índice. El índice lo escribe solo la sincronización.
  if(typeof AUTOPX_URL!=="undefined"&&AUTOPX_URL)ipsa=null;
  try{pricedbUpsertDay(date,ipsa,priceMap);}catch(e){}   // el cierre diario también alimenta la base del sistema
  let nProj=0,nCli=0,nSkip=0;
  CLIENTS.forEach(c=>{
    const projs=clientProjects(c.id)||[];let touched=false;
    projs.forEach(p=>{
      const ws=p.weeks||[];if(!ws.length)return;
      const last=ws[ws.length-1];
      if(new Date(date+"T00:00:00")<new Date(last.date+"T00:00:00")){nSkip++;return;}
      const newPrices=Object.assign({},last.prices||{});let any=false;const freshT=[];
      (p.holdings||[]).forEach(hd=>{const v=priceMap[hd.t];if(v!=null&&isFinite(v)&&v>0){newPrices[hd.t]=v;any=true;freshT.push(hd.t);}});   // freshT = cierres REALES de hoy (no los arrastrados)
      if(!any)return;   // solo proyectos que tienen alguna de las acciones cargadas
      const ipsaFresh=(ipsa!=null&&isFinite(ipsa)&&ipsa>0);   // ¿el IPSA es un cierre REAL de hoy? (si no, se arrastra el anterior y NO debe contaminar la serie del índice)
      const ip=ipsaFresh?ipsa:(last.ipsa||0);

let homeStkFreq="diario";
/* ══ INVESTOR SCORE (v3 · piedra angular, riesgo descontado + candado de confianza) ══
   Puntuación 0–100 por acción, recalculada CADA DÍA desde la data del sistema (12 meses de precios +
   fundamentos reales), INDEPENDIENTE del análisis activo. Rankea por PERCENTIL dentro del universo.
   Filosofía: TODO riesgo relevante se DESCUENTA dentro del puntaje — no hay "buen score pero ojo…".
   Bloques (con dato presente):
   • RIESGO-RETORNO 45% (≥40% siempre): Sharpe 40% + α de Jensen 25% AMORTIGUADO por confiabilidad
     (× r²/(r²+0,05): un α con r²≈0 es ruido) + Sortino 20% + Resistencia a caídas 15% (1−drawdown máx).
   • FUNDAMENTOS 30%: Valorización (P/U + P/B) 30% + Calidad (ROE + margen) 30% + Dividendos 20% +
     Upside del consenso de analistas 20% — solo con dato real, lo ausente no cuenta ni se inventa.
   • TENDENCIA/MOMENTUM 25%: momentum 6m 45% + posición en el rango 52 semanas 30% + tendencia 1m 25%
     (evita "atrapar un cuchillo cayendo": una acción barata pero en caída fuerte NO sube por serlo).
   Luego se aplica un CANDADO DE CONFIANZA: el puntaje se acerca al neutro (50) según la calidad de los
   datos (nº de observaciones + cobertura de fundamentos + confiabilidad estadística). Así una acción
   solo llega a un puntaje alto si sus métricas SON buenas Y los datos que las sostienen son sólidos —
   nunca una recomendación fuerte sobre data débil. NO usa noticias/macro (irían con ruido): eso lo
   aporta el agente al justificar. Educativo, no asesoría financiera. */
let _invScore=null;
function investorScoreCompute(){
  let tickers=(typeof pricedbTickers==="function")?pricedbTickers():[];
  if(tickers.length<3||!Object.keys(PRICEDB.ipsa||{}).length)return null;
  let R=null;
  for(let it=0;it<4;it++){
    R=caResolve(12,{tickers,bench:"IPSA"});
    if(R&&R.ok)break;
    const lim=(R&&R.chk&&R.chk.limiting)?R.chk.limiting.map(x=>x.t):[];
    if(!lim.length)return null;
    tickers=tickers.filter(t=>lim.indexOf(t)<0);
    if(tickers.length<3)return null;
  }
  if(!R||!R.ok)return null;
  const imp=pricedbToIMP(R.freq,{tickers,lastN:R.lastN,bench:"IPSA"});
  if(!imp||!imp.assets||imp.assets.length<3)return null;
  const nRet=imp.n||((imp.assets[0]&&imp.assets[0].rets&&imp.assets[0].rets.length)||0);
  const pct=(vals,v,invert)=>{const a=vals.filter(x=>x!=null&&isFinite(x));if(a.length<2||v==null||!isFinite(v))return null;let c=0;a.forEach(x=>{if(invert?x>v:x<v)c++;else if(x===v)c+=0.5;});return Math.round((c-0.5)/(a.length-1)*100);};
  const wavg=(parts)=>{let sw=0,sv=0;parts.forEach(([v,w])=>{if(v!=null){sv+=v*w;sw+=w;}});return sw>0?sv/sw:null;};
  const or50=v=>v==null?50:v;
  const F=t=>((typeof fundGet==="function"&&fundGet(t))||{});
  // ── métricas por acción (de precios reales, siempre presentes) ──
  const alphaAdj=s=>(+s.a24.jensen)*((s.a24.r2||0)/((s.a24.r2||0)+0.05));   // α amortiguado por r²
  const sortinoOf=s=>{const rr=(s.rets||[]).map(x=>x/100);if(rr.length<3)return null;const m=rr.reduce((a,b)=>a+b,0)/rr.length;const dd=Math.sqrt(rr.reduce((a,x)=>a+(x<0?x*x:0),0)/rr.length);return dd>1e-9?m/dd:(m>0?5:0);};
  const mddOf=s=>{const pr=s.prices||[];if(pr.length<3)return 0;let peak=pr[0],mx=0;for(const v of pr){if(v>peak)peak=v;const d=peak>0?1-v/peak:0;if(d>mx)mx=d;}return mx;};   // caída máx pico-a-valle en la ventana
  const momOf=s=>{const pr=s.prices||[],n=pr.length;if(n<8)return null;const a=Math.max(0,n-1-Math.min(n-2,26)),b=Math.max(a+1,n-3);return pr[a]>0?(pr[b]/pr[a]-1)*100:null;};   // momentum ~6m saltando el último mes
  const trendOf=s=>{const pr=s.prices||[],n=pr.length;if(n<5)return null;const a=Math.max(0,n-5);return pr[a]>0?(pr[n-1]/pr[a]-1)*100:null;};   // tendencia ~1 mes
  const posOf=s=>{const f=F(s.t);if(f.hi52!=null&&f.lo52!=null&&f.hi52>f.lo52&&f.px>0)return Math.max(0,Math.min(1,(f.px-f.lo52)/(f.hi52-f.lo52)))*100;const pr=s.prices||[];if(pr.length<2)return null;const mn=Math.min(...pr),mx=Math.max(...pr);return mx>mn?(pr[pr.length-1]-mn)/(mx-mn)*100:50;};
  // arrays para percentiles
  const A=imp.assets;
  const sharpes=A.map(s=>s.a24.sharpe),alphasAdj=A.map(alphaAdj),sortinos=A.map(sortinoOf),mdds=A.map(mddOf),moms=A.map(momOf),poss=A.map(posOf),trends=A.map(trendOf);
  // ¿la utilidad reciente parece NO RECURRENTE? Forward P/U MUCHO mayor que trailing = la utilidad base va a
  // caer (p.ej. revalorización contable IFRS de un operador de malls): NO tratarla como "barata" ni "rentable".
  const nonRecOf=f=>(f.fpe!=null&&f.pe!=null&&f.pe>0&&f.fpe>f.pe*2.5);
  // P/U EFECTIVO = el más CONSERVADOR (mayor) de trailing y forward: solo es "barata" si lo es en ambos
  const epeOf=f=>{if(f.pe!=null&&f.fpe!=null)return Math.max(f.pe,f.fpe);return f.pe!=null?f.pe:(f.fpe!=null?f.fpe:null);};
  const pbs=[],dys=[],nms=[],ups=[],epes=[],roesEff=[];
  A.forEach(s=>{const f=F(s.t);pbs.push(f.pb);dys.push(f.dy);nms.push(f.nm);epes.push(epeOf(f));
    roesEff.push(nonRecOf(f)?null:f.roe);   // ROE se descarta si la utilidad no es recurrente (no contar dos veces la misma ganancia contable)
    ups.push((f.target!=null&&f.px>0)?(f.target/f.px-1)*100:null);});
  const obsFactor=Math.max(0,Math.min(1,nRet/40));   // ≥40 retornos (~9m semanal) = muestra suficiente
  const rows=A.map(s=>{
    const f=F(s.t);
    // RIESGO-RETORNO (técnico) — retorno ajustado por riesgo + resistencia a caídas; todo de precios reales
    const rr=Math.round(wavg([[or50(pct(sharpes,s.a24.sharpe)),0.40],[or50(pct(alphasAdj,alphaAdj(s))),0.25],[or50(pct(sortinos,sortinoOf(s))),0.20],[or50(pct(mdds,mddOf(s),true)),0.15]]));
    // FUNDAMENTOS — solo con dato real; valorización con P/U EFECTIVO (conservador), ROE sin utilidades no recurrentes
    const _nonRec=nonRecOf(f);
    const valz=wavg([[pct(epes,epeOf(f),true),0.6],[pct(pbs,f.pb,true),0.4]]);
    const qualz=wavg([[pct(roesEff,_nonRec?null:f.roe),0.6],[pct(nms,f.nm),0.4]]);
    const upv=(f.target!=null&&f.px>0)?(f.target/f.px-1)*100:null;
    const fundS0=wavg([[valz,0.30],[qualz,0.30],[pct(dys,f.dy),0.20],[pct(ups,upv),0.20]]);
    const fundS=fundS0!=null?Math.round(fundS0):null;
    // TENDENCIA/MOMENTUM — situación reciente de la acción
    const trS0=wavg([[pct(moms,momOf(s)),0.45],[pct(poss,posOf(s)),0.30],[pct(trends,trendOf(s)),0.25]]);
    const trS=trS0!=null?Math.round(trS0):null;
    // combinación de bloques (renormalizando si falta fundamentos; el técnico siempre ≥40%)
    const blend=fundS==null
      ? wavg([[rr,0.60],[or50(trS),0.40]])

    if(!p.hasData)return `<button class="home-fundwide nodata" data-gohome="${p.cliId}|${p.pid}"><div class="fw-head"><span class="rk-dot" style="background:${p.col}"></span><span class="fw-name">${nm}</span><span class="fw-pct nd">— sin seguimiento</span></div><div class="fw-stats">${stat("Aportado",fmtCLP(p.val))}${sd?stat("Inicio",sd,null,"ntr"):""}${stat("β",(p.beta||0).toFixed(2),null,"ntr")}<div class="fw-stat" style="flex:1 1 200px"><span class="fw-sl">&nbsp;</span><span class="fw-hint">Registra su compra inicial para ver su evolución</span></div></div></button>`;
    const spark=lineSpark(p.series&&p.series.length>1?p.series:[1,1],pos?green:red,112);
    return `<button class="home-fundwide" data-gohome="${p.cliId}|${p.pid}"><div class="fw-head"><span class="rk-dot" style="background:${p.col}"></span><span class="fw-name">${nm}</span><span class="fw-pct" style="color:${pos?green:red}">${(pos?"+":"")+p.pct.toFixed(2)}<span>%</span></span></div><div class="fw-chart">${spark}</div><div class="fw-stats">${stat("Valor",fmtCLP(p.val))}${stat("Aportado",fmtCLP(p.inv))}${stat("Ganancia",(p.gain>=0?"+":"−")+fmtCLP(Math.abs(p.gain)),pos?green:red)}${sd?stat("Inicio",sd,null,"ntr"):""}${stat("β",(p.beta||0).toFixed(2),null,"ntr")}</div></button>`;};
  const fundsInner=funds.length
    ? (funds.length<=2
      ? `<div class="home-fundgrid n${funds.length}">${funds.map(fundWide).join("")}</div>`
      : `<div class="home-cartgrid">${funds.slice(0,12).map(fundCard).join("")}</div>${funds.length>12?`<div class="note" style="margin:11px 0 0">+${funds.length-12} fondos más · <a data-go="proyectos|hub" style="color:var(--accent);cursor:pointer;font-weight:700">ver todos →</a></div>`:""}`)
    : `<div class="note" style="margin:0">Aún no tienes fondos en gestión. Arma una cartera en el <b>Constructor</b> y registra su compra inicial.</div>`;
  const fundsCard=card("Fondos administrados",`${funds.length} cartera${funds.length!==1?"s":""} en gestión · valor, rentabilidad bruta y β · haz clic para entrar`,fundsInner);
  // indicadores que se movieron
  const movers=MIND_DEF.filter(d=>d.spark).map(d=>({d,chg:mindChange(d.k),o:MIND&&MIND[d.k]})).filter(x=>x.chg!=null&&x.o).sort((a,b)=>Math.abs(b.chg)-Math.abs(a.chg)).slice(0,4);
  const mvRows=movers.length?movers.map(x=>`<div class="home-mv"><div class="mv-top"><span class="mv-name">${x.d.label}</span><span class="mv-chg" style="color:${x.chg>=0?green:red}">${(x.chg>=0?"▲ +":"▼ ")+x.chg.toFixed(2)}%</span></div><div class="mv-val">${mindFmt(x.o.valor,x.d.dec,x.d.unit)}</div>${mindSparkSVG(MINDH[x.d.k])||""}</div>`).join("")
    :`<div class="note" style="margin:0">${mindBusy?"Cargando indicadores de mercado…":"Cargando indicadores… (también en Mercados)"}</div>`;
  const mvCard=card("Indicadores que se movieron","Mayores variaciones recientes · dólar, euro, cobre, UF (mindicador.cl)",`<div class="home-mvgrid">${mvRows}</div>`);
  // acciones destacadas — rankings desde los precios reales de los seguimientos
  const stats=seguimientoStats(homeStkFreq);
  const _rkD=d=>d?(""+d).slice(8,10)+"/"+(""+d).slice(5,7)+"/"+(""+d).slice(2,4):"";
  const stkBlock=(title,sub,arr,valFn,colFn,startRank)=>{const rows=arr.map((s,i)=>`<div class="home-stk"><span class="stk-pos">${(startRank||1)+i}</span><span class="rk-dot" style="background:${s.col}"></span><span class="rk-body"><span class="rk-name">${s.t}</span><span class="rk-cli">${(""+s.name).replace(/</g,"&lt;")}${s.lastDate?' · al '+_rkD(s.lastDate):''}</span></span><span class="stk-spk">${mindSparkSVG(s.series&&s.series.length>1?s.series:[1,1],colFn(s))}</span><span class="rk-pct" style="color:${colFn(s)}">${valFn(s)}</span></div>`).join("");
    return `<div class="stk-block"><div class="stk-bh"><b>${title}</b><span>${sub}</span></div>${rows||'<div class="note" style="margin:6px 0 0;font-size:11px">Sin datos suficientes</div>'}</div>`;};
  const perWord=homeStkFreq==="diario"?"último día":homeStkFreq==="semanal"?"última semana móvil (7 días)":"último mes móvil";
  const perPhrase=homeStkFreq==="semanal"?"de la última semana móvil (7 días)":"del "+perWord;
  const byRet=[...stats].sort((a,b)=>b.ret-a.ret);
  const byWorst=[...stats].sort((a,b)=>a.ret-b.ret);
  // partimos las acciones en la mitad por rentabilidad: la mejor mitad a la izquierda, la peor a la derecha
  // (sin duplicar y mostrando hasta MAXBLK en cada columna); el toggle diario/semanal/mensual cambia el período.
  const MAXBLK=9, half=Math.ceil(stats.length/2), bestN=Math.min(MAXBLK,half), worstN=Math.min(MAXBLK,stats.length-bestN);
  const bestArr=byRet.slice(0,bestN), worstArr=byWorst.slice(0,worstN);
  const _stkTT={diario:"Retorno vs el cierre del día hábil anterior",semanal:"Retorno de los últimos ~7 días (móvil)",mensual:"Retorno de los últimos ~30 días (móvil, no lo que va del mes)"};
  const freqSeg=`<div class="home-hdacts"><div class="home-seg" role="group" aria-label="Frecuencia de los rankings">${["diario","semanal","mensual"].map(f=>`<button data-stkfreq="${f}" class="${homeStkFreq===f?"on":""}" title="${_stkTT[f]}">${f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join("")}</div></div>`;
  const stkInner=stats.length?`<div class="stk-cols">
    ${stkBlock("Mejor rentabilidad","retorno "+perPhrase,bestArr,s=>(s.ret>=0?"+":"")+s.ret.toFixed(2)+"%",s=>s.ret>=0?green:red,1)}
    ${stkBlock("Peor rentabilidad","retorno "+perPhrase,worstArr,s=>(s.ret>=0?"+":"")+s.ret.toFixed(2)+"%",s=>s.ret>=0?green:red,1)}</div>`
    :`<div class="note" style="margin:0">Aún no hay suficiente historial para rankear acciones. Usa <b>↻ Actualizar precios</b> para cargar cierres, o registra operaciones en tus proyectos.</div>`;
  const stkCard=card("Acciones destacadas",`Mejores y peores por rentabilidad ${perPhrase} (convención móvil, igual que el IPSA de arriba) · cada acción con su último dato disponible (y su fecha) · los cierres se cargan en <b>⚙ Configuración → Datos</b> · el Sharpe y el α de Jensen de cada cartera están en <b>Proyectos</b>`,stkInner,freqSeg);
  const newsCard=homeNewsCard();
  // ── INVESTOR SCORE · Top 10 — la puntuación diaria del sistema (independiente del análisis activo) ──
  const scoreCard=(()=>{
    let sc=null;try{sc=investorScore();}catch(e){}
    if(!sc||!sc.rows||sc.rows.length<3)return "";
    const top=sc.rows.slice(0,10);
    const scCol=v=>v>=70?green:v>=55?indigo:v>=40?amber:red;
    const row=(r,i)=>`<div class="home-stk" title="Sharpe ${r.sharpe} · σ ${r.sig}% · caída máx ${r.maxDD}% · momentum 6m ${r.mom6m!=null?(r.mom6m>=0?"+":"")+r.mom6m+"%":"—"} · confianza ${r.confianza}%${r.alertas&&r.alertas.length?" · "+r.alertas.join("; "):""}"><span class="stk-pos">${i+1}</span><span class="rk-dot" style="background:${r.c}"></span><span class="rk-body"><span class="rk-name">${r.t}</span><span class="rk-cli">Riesgo-ret. ${r.rr}${r.fund!=null?" · Fund. "+r.fund:" · sin fund."}${r.tend!=null?" · Tend. "+r.tend:""} · conf. ${r.confianza}%</span></span><span class="rk-pct" style="color:${scCol(r.score)};font-size:17px">${r.score}</span></div>`;
    const colA=top.slice(0,5).map((r,i)=>row(r,i)).join(""),colB=top.slice(5).map((r,i)=>row(r,i+5)).join("");
    const _fc=sc.rows.filter(r=>r.fund!=null).length;
    const tramoNota=`<div class="note" style="margin:11px 0 0;font-size:11px">Léelo por <b>tramos</b>, no por el puesto exacto: con 12 meses de datos, diferencias menores a ~5 puntos NO son significativas (son estadísticamente el mismo nivel). Verde ≥70 = candidatos fuertes · azul 55–69 = sólidos · ámbar 40–54 = neutros · rojo &lt;40 = evitar. El puntaje ya descuenta todo el riesgo relevante.</div>`;
    return card("Investor Score · Top 10",`Puntuación diaria (0–100) de las ${sc.n} acciones del sistema — <b>45% riesgo-retorno</b> (Sharpe + α confiable + Sortino + resistencia a caídas) · 30% fundamentos (${_fc}/${sc.n} reales) · 25% tendencia · con <b>candado de confianza</b> por calidad de datos, así todo riesgo ya está descontado en el número · pasa el cursor para ver el detalle · se recalcula cada día · educativo, no asesoría financiera`,
      `<div class="stk-cols"><div class="stk-block">${colA}</div><div class="stk-block">${colB}</div></div>`+tramoNota);
  })();
  return greetStrip+hero+tiles+ipsaCard+fundsCard+`<div class="home-grid2 home-grid-news">${newsCard}${mvCard}</div>`+scoreCard+stkCard;
}
function attachHome(){
  document.querySelectorAll("[data-gohome]").forEach(b=>b.onclick=()=>{const a=b.dataset.gohome.split("|"),cid=a[0],pid=a[1];
    try{if(cid!==activeClient){activeClient=cid;localStorage.setItem("inv_active_client",cid);if(typeof clientLoad==="function")clientLoad();}}catch(e){}
    const np=+pid;activeId=(isFinite(np)&&String(np)===pid)?np:pid;try{saveProjects();syncProj();}catch(e){}
    modulo="inv";page="seguimiento";render();});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const[m,pg]=b.dataset.go.split("|");modulo=m;page=pg;render();});
  document.querySelectorAll("[data-stkfreq]").forEach(b=>b.onclick=()=>{homeStkFreq=b.dataset.stkfreq;render();});
  document.querySelectorAll("[data-openprices]").forEach(b=>b.onclick=()=>{platformPricesOpen();});
  try{attachMultiHover("ipsahome");}catch(e){}
  document.querySelectorAll("[data-newsretry]").forEach(b=>b.onclick=()=>{try{newsFetch(true);}catch(e){}});
  const _wx=document.querySelector("[data-welcomehide]");if(_wx)_wx.onclick=()=>{try{localStorage.setItem("inv_welcome_hide","1");}catch(e){}render();};
  if(!MIND&&!mindBusy&&typeof mindFetch==="function"){try{mindFetch();}catch(e){}}
  if(typeof newsFetch==="function"){try{newsFetch();}catch(e){}}
}
/* topbar switcher */
function clientMenuClose(){const m=document.getElementById("clientMenu");if(m)m.classList.remove("open");}
function renderClientBar(){
  const co=activeClientObj();
  const cn=document.getElementById("clientName");if(cn)cn.textContent=co.name;
  const cdot=document.querySelector("#clientBtn .cli-dot");if(cdot)cdot.style.background=co.color||"#1E5FD1";
  const cm=document.getElementById("clientMenu");
  if(cm){cm.innerHTML=CLIENTS.map(c=>`<button class="cli-item ${c.id===activeClient?"on":""}" data-cliid="${c.id}"><span class="cli-dot" style="background:${c.color||"#1E5FD1"}"></span><span style="flex:1;text-align:left">${(""+c.name).replace(/</g,"&lt;")}</span>${c.id===activeClient?'<span class="cli-chk">✓</span>':""}</button>`).join("")+`<div class="cli-sep"></div><button class="cli-item act" data-cliadd>+ Nuevo cliente</button><button class="cli-item act" data-cligo>⚙ Gestionar clientes</button>`;
    cm.querySelectorAll("[data-cliid]").forEach(b=>b.onclick=()=>{clientMenuClose();clientSwitch(b.dataset.cliid);});
    const ca=cm.querySelector("[data-cliadd]");if(ca)ca.onclick=()=>{clientMenuClose();clientFormOpen();};
    const cg=cm.querySelector("[data-cligo]");if(cg)cg.onclick=()=>{clientMenuClose();modulo="clientes";render();};}
  const cb=document.getElementById("clientBtn");if(cb&&!cb._b){cb._b=1;cb.onclick=e=>{e.stopPropagation();const m=document.getElementById("clientMenu");if(m)m.classList.toggle("open");};}
}

let uiScale=(parseFloat(localStorage.getItem("inv_ui_scale"))||0.8);
function applyScale(s){uiScale=s;const app=document.getElementById("app");if(app){if(s&&Math.abs(s-1)>0.001){app.style.zoom=s;app.style.height=(100/s)+"vh";}else{app.style.zoom="";app.style.height="";}}try{localStorage.setItem("inv_ui_scale",s);}catch(e){}}
applyScale(uiScale);
try{document.addEventListener("click",clientMenuClose);}catch(e){}
/* monousuario: ya no hay gestión de clientes. Se conserva un único cliente interno (c_me) para no romper
   el almacenamiento; cualquier cliente extra deja de mostrarse (sus datos quedan inertes, no se borran). */
function removeExampleClients(){try{
  const before=CLIENTS.length;
  CLIENTS=CLIENTS.filter(c=>c.id==="c_me");
  if(!CLIENTS.length)CLIENTS=[{id:"c_me",name:"Administración",color:"#1E5FD1"}];
  if(CLIENTS.length!==before)saveClients();
  if(activeClient!=="c_me"){activeClient="c_me";try{localStorage.setItem("inv_active_client","c_me");clientLoad();}catch(e){}}
}catch(e){}}
try{removeExampleClients();}catch(e){}
try{pricedbAutoSeed();}catch(e){}
try{analysisMigrateDatos();}catch(e){}
render();
try{autobkTick();}catch(e){}
try{autopxAutoRun();}catch(e){}   // sincroniza los cierres del día desde la fuente automática (si está configurada)
authInit();
</script>
