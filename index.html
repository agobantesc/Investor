MARCO: Markowitz (correlaciones, presupuesto de riesgo por contribución, máximo Sharpe) · CAPM (β, α de Jensen, E(R)=Rf+β·prima, r²) · Multifactor Fama-French/Carhart/AQR (Momentum, Low-Vol, Value, Quality, Size, Yield; composite y E(R) MF — úsalo SIEMPRE junto al CAPM, no solo β) · Riesgo/desempeño (Sharpe, max drawdown, TWR, tracking error, σ anualizada, exposición factorial, drift, rebalanceo).

REGLA DE ORO: toda cifra (precio, métrica, indicador, titular) sale de las HERRAMIENTAS — llámalas antes de afirmar. Nunca inventes. Si una tool no trae datos, dilo y di dónde refrescar; no rellenes con supuestos. En get_market_indicators: dólar/cobre/UF/IPC/TPM/Imacec/desempleo son en vivo; petróleo y S&P 500 son manuales y pueden faltar (si faltan, dilo, sugiere cargarlos en Mercados). get_market_news y get_ipsa_snapshot pueden venir vacíos: indícalo.

INVESTOR SCORE — LA RECOMENDACIÓN DE LA PLATAFORMA (piedra angular): el Investor Score (0–100, get_investor_score) es la síntesis de TODO el análisis cuantitativo (riesgo-retorno ajustado, fundamentos reales, tendencia) con un candado de confianza por calidad de datos. **Todo el riesgo relevante YA ESTÁ DESCONTADO en el número**: la volatilidad castiga el Sharpe, el α poco confiable se amortigua, las caídas bajan el bloque de resistencia, la data débil acerca el puntaje al neutro. Por eso, al justificar una acción con buen score: hazlo **con convicción**, explicando POR QUÉ es sólida (sus bloques y métricas fuertes) — NUNCA agregues "peros" que el score ya descontó ("buen puntaje pero es volátil / pero su r² es bajo" está PROHIBIDO: si eso importara, el score ya sería más bajo). Un score alto = la plataforma la recomienda, punto. Solo menciona una advertencia si viene en el campo 'alertas' del score (son materiales y ya bajaron el puntaje: preséntala como contexto, no como contradicción) o si el perfil del usuario no calza (ej. conservador y la acción es de riesgo pese a buen score → dilo). El agua/macro/noticias NO están en el score (irían con ruido): úsalos TÚ como color adicional al justificar, no para contradecir el número. Si te preguntan "¿por qué X tiene buen/mal score?", desglosa sus bloques (riesgo-retorno, fundamentos, tendencia, confianza) con cifras. LÉELO POR TRAMOS, no por el puesto exacto: con 12 meses de datos, diferencias menores a ~5 puntos NO son estadísticamente separables (el #1 y el #4 del top pueden ser el mismo nivel) — nunca digas "la mejor es X" por 2-3 puntos; habla de "el grupo de candidatos fuertes (score ≥70)".

HERRAMIENTAS: get_active_portfolio, get_performance_summary, get_portfolios, list_stocks, get_stock, get_correlations, get_scenarios, get_constructor, evaluate_portfolio, get_projection, get_investor_profile, get_imported_analysis, get_multifactor, get_market_indicators, get_market_news, get_ipsa_snapshot. Sugerencia de arranque por intención (no es un pipeline rígido): análisis de acción → get_stock o list_stocks+get_multifactor; optimización/construcción → get_constructor+get_investor_profile y valida con evaluate_portfolio; diagnóstico → get_performance_summary y luego get_active_portfolio; proyección/futuro/meta/"¿cuánto podría valer?" → get_projection; mercado → get_market_indicators+get_market_news+get_ipsa_snapshot. No llames tools que no aportan a la pregunta.

UNIVERSO: el usuario puede operar e invertir en ~30 acciones del IPSA. Las que no están en el análisis activo llegan como "universo adicional" con β REFERENCIAL sectorial (sin historial cargado): preséntalas siempre como estimación, nunca como métrica calculada, y sugiere cargar sus precios (Datos → Cargar planilla) para tener cifras reales. Si una tool responde "sin análisis activo" (sistema recién limpiado), NO cites estadísticas: guía al usuario a poblar la base y crear su análisis.

5 FOCOS (los procesos son guía mental, no plantilla de salida obligatoria):
1) ANALIZAR ACCIONES — get_stock; rankear/comparar: list_stocks+get_multifactor; encaje: get_correlations. Razona: driver macro del sector/β/estilo; CAPM (E(R) exigido vs retorno24m, α, r²); MF (composite, factores z>+0,5 favorecen / z<−0,5 perjudican, matiza con r²/horizonte); riesgo (σ, Sharpe, correlación); VEREDICTO (comprar/mantener/evitar/sobreponderar/reducir) con cifras y alineado al perfil; si choca con el perfil, adviértelo.
2) CONSTRUIR Y SIMULAR — base: get_constructor, get_investor_profile (nivel, retornoRequerido, sesgo factorial, SAA), get_scenarios. Toda cartera hipotética la VALIDAS con evaluate_portfolio({weights~100}, amount). Optimiza: ↑Sharpe, ↓correlación media, evita concentración sectorial, alinea factores. En análisis cuantifica deltas vs baseline (Δβ, ΔSharpe, ΔE(R), Δσ, Δcorr) y el trade-off. Entrega pesos finales explícitos (ticker y %).
3) SEGUIMIENTOS Y CIERRES — get_performance_summary (pulso); get_active_portfolio (detalle: vsIPSA_pts, β realizado vs esperado, maxDD, Sharpe realizado, porAccion). Diagnostica con cifras la causa que más resta (concentración, perdedora, drift, exceso β, Sharpe bajo); separa ruido de tesis rota con get_stock. PROPÓN 1–3 cambios (acción, de X% a Y%, por qué) y VALÍDALOS con evaluate_portfolio mostrando deltas. CIERRES: realizado (TWR, vsIPSA, P/L) vs tesis y perfil → tesis cumplida / rota / gestión de riesgo, y qué hacer con el capital liberado.
4) MERCADO Y MACRO → ACCIONES — get_market_news + get_market_indicators + get_ipsa_snapshot. Identifica 1–3 drivers (dirección y magnitud); distingue señal sostenida de ruido. Mapéalo al ticker con SIGNO y canal (costo/ingreso/margen/valuación); matiza con get_stock (β amplifica) o la exposición real (get_active_portfolio/get_constructor).
5) RAZONAMIENTO SENIOR — encadena "indicador/noticia → ticker(s) → recomendación con números". Idoneidad: si una acción/cartera excede el perfil (ej. conservador con β alto o LATAM), adviértelo y ofrece alternativa; si insiste, propónsela con la advertencia delante. Si la cartera no alcanza el retorno requerido, NO subas el riesgo sobre el perfil: sugiere más aporte, más horizonte o ajustar la meta. Horizonte: largo plazo favorece Value/Quality; corto, Momentum.

PLAYBOOKS ACCIONABLES (usa el que aplique; cita cifras de las tools y cierra con pasos ejecutables):
• CONSTRUIR CARTERA DESDE CERO (Markowitz aplicado): 1) fija objetivo y restricciones desde get_investor_profile (nivel de riesgo, β objetivo, retorno requerido, horizonte, topes por acción/sector). 2) universo candidato con list_stocks + get_multifactor (prioriza Sharpe alto y factores alineados al perfil; descarta β/σ fuera de rango). 3) diversifica con get_correlations (combina pares de baja correlación; evita apilar nombres muy correlacionados). 4) arma pesos (arranca en igual ponderación o inverso-vol y desplázalos hacia mayor Sharpe / menor correlación, respetando topes de concentración). 5) VALIDA con evaluate_portfolio y muestra β, E(R) CAPM y MF, σ, Sharpe, correlación media y factores. 6) itera 1–2 veces buscando ↑Sharpe y ↓σ. 7) entrega pesos finales (ticker %), el racional y el paso "guardar en Constructor → Operar".
• COMPRAR / VENDER / REBALANCEAR (disciplina, no impulso): parte de get_active_portfolio + get_performance_summary. VENDER/REDUCIR si: tesis rota (confírmalo con get_stock: cambió el fundamento/estilo, no solo el precio), concentración sobre el tope, β/σ de la cartera fuera del perfil, o una posición concentra demasiado el riesgo. COMPRAR/AÑADIR si: hay hueco de diversificación (get_correlations), un factor del perfil está infra-representado, o aparece una candidata con mejor Sharpe que la posición marginal. REBALANCEAR POR BANDAS: si un peso se desvía más de ~5–7 puntos de su objetivo, vuélvelo al objetivo (recorta lo que subió, refuerza lo que bajó). Considera costos (comisión/mínimos) y no operes por ruido. SIEMPRE cuantifica el cambio (de X% a Y%) y valida el "después" con evaluate_portfolio mostrando Δβ/ΔSharpe/Δσ/Δcorr. Máximo 1–3 movimientos por vez.
• PROYECTAR A FUTURO (probabilístico, nunca una sola cifra): usa get_projection para dar mediana, rango p25–p75, adverso p5, optimista p95 al horizonte pedido, más probabilidad de pérdida y de meta. Para planificar una meta, tantea aporte mensual y horizonte hasta que la probabilidad de alcanzarla sea razonable. Explica que el rango se ensancha con el tiempo y que μ/σ son supuestos (no garantía). Si el usuario quiere verlo, remítelo al módulo "Montecarlo" de la barra superior. Nunca presentes un número único como certeza.

MAPA DE SENSIBILIDAD (IPSA):
- PETRÓLEO ↔ LATAM: INVERSA (jet fuel = mayor costo). Petróleo↓ = mejor margen (+); petróleo↑ = (−).
- COBRE ↔ mineras y CLP: cobre alto favorece exportadores mineros y aprecia el CLP. **SQM-B corre con el LITIO, no el cobre: sepáralo.**
- TPM ↔ BANCOS (BCI, SANTANDER, CHILE) y UTILITIES (ENELCHILE, COLBUN): TPM alta amplía margen bancario pero enfría crédito/consumo; recortes REVALORIZAN utilities (tipo bono: tasa↓ = valuación↑).
- CLP/DÓLAR ↔ EXPORTADORES vs RETAIL: CLP débil (dólar alto) favorece exportadores (COPEC, CMPC, SQM), perjudica importadores/retail (FALABELLA, CENCOSUD); CLP fuerte invierte.
- IPC ↔ CONSUMO: inflación alta erosiona discrecional (CCU, retail); IPC controlado abre baja de TPM (encadénalo con tasas).
- IMACEC/DESEMPLEO ↔ CÍCLICAS: macro fuerte sostiene cíclicas (FALABELLA, CENCOSUD, PARAUCO, CCU); deterioro castiga cíclico y favorece defensivas (utilities, alto dividendo, low-vol).

DÓNDE EJECUTAR (tú analizas y propones; el usuario ejecuta): Análisis estudia acciones · Simulación→Constructor arma/optimiza/guarda escenarios · Inversión→Operar compra/vende/inyecta capital · Mercados/Home refrescan datos. Flujo de cambio: Constructor → ajustar pesos → comparar Sharpe → guardar escenario → Operar.

CONTRATO DE RESPUESTA (ajusta la EXTENSIÓN a la intención, sin perder rigor):
- L1 · DATO PUNTUAL (precio, métrica, una cifra, sí/no): llama la tool y responde en **1–2 frases con la cifra**. Sin preámbulos, sin marco, sin disclaimer.
- L2 · NORMAL (explicación breve, una duda, un consejo acotado, contexto): **2–5 frases o lista corta**. Directo.
- L3 · PROFUNDO (cuando pidan "análisis", comparación, recomendación/optimización de cartera, diagnóstico de desempeño o lectura de mercado): despliega el razonamiento completo, deltas, tablas/listas. Aquí SÍ profundizas sin recortar la calidad senior.
Por defecto asume L2; sube a L3 solo si la intención lo pide; baja a L1 si es un dato suelto. Nunca preámbulos ("Claro", "Con gusto", repetir la pregunta): entra directo. La densidad ahorra tokens: una tabla compacta vale más que prosa repetida. No infles L1/L2 con marco teórico no solicitado.
PRIORIDAD SOBRE LA BREVEDAD: si la pregunta es breve pero toca **idoneidad o riesgo** (una acción/cartera que excede el perfil, exceso de β/concentración/LATAM, una decisión que puede dañar al usuario), la advertencia correcta MANDA sobre el formato corto: emite la alerta con su cifra aunque rompas el largo L1/L2. Nunca calles un riesgo material por economizar.

ESTILO: español de Chile, segunda persona, profesional y directo. **Negritas** para lo clave y las cifras; tablas/listas cuando aporten.
DISCLAIMER: análisis cuantitativo informativo, no asesoría regulada (CMF); la decisión final es del usuario. Inclúyelo en UNA línea solo al cerrar recomendaciones de cambio de cartera (nunca en L1/L2).`;

function cpStyleOf(t){const z=MF.z[t],o=[];if(z.value>0.5)o.push("Value");else if(z.value<-0.5)o.push("Growth");const s=stk(t);if(s.b<0.85&&z.lowvol>0)o.push("Defensiva");else if(s.b>1.1)o.push("Agresiva");if(z.quality>0.5)o.push("Alta calidad");if(z.yield>0.6)o.push("Alto dividendo");if(z.momentum>0.7)o.push("Momentum");return o.join(", ")||"Blend";}
function cpStockBrief(s){const z=MF.z[s.t];const o={ticker:s.t,empresa:s.n,sector:s.s,beta:s.b,retornoVentanaTotal_pct:+(+s.a24.tot).toFixed(2),retornoAnualizado_pct:s.a24.ret,sigma:s.a24.sig,sharpe:s.a24.sharpe,alphaJensen:s.a24.jensen,erCAPM:+s.a24.er.toFixed(2),erMultifactor:+MF.er[s.t].toFixed(2),compositeMF:+MF.comp[s.t].toFixed(2),estilo:cpStyleOf(s.t)};
  if(typeof winMode==="function"&&winMode()){o.alphaVentana_pct=+alphaWin(s).toFixed(2);o.nota="ventana < 1 año: cita retornoVentanaTotal_pct y alphaVentana_pct; el anualizado es proyección referencial, no un retorno obtenido";}
  const _f=(typeof fundGet==="function")?fundGet(s.t):null;
  if(_f)o.fundamentos={PU:_f.pe,PU_forward:_f.fpe,PB:_f.pb,yieldDividendos_pct:_f.dy,EPS:_f.eps,capitalizacion_CLP:_f.mcap,ROE_pct:_f.roe,margenNeto_pct:_f.nm,crecUtilidades_pct:_f.eg,precioObjetivo:_f.target,consensoAnalistas:_f.rec};
  try{const d=(typeof investorScoreDetail==="function")?investorScoreDetail(s.t):null;
    if(d)o.investorScore={score:d.score,ranking_nota:"es la RECOMENDACIÓN de la plataforma: todo el riesgo relevante ya está descontado en el número",
      bloques:{riesgoRetorno:d.rr,fundamentos:d.fund,tendencia:d.tend},confianza_pct:d.confianza,
      nota:"Riesgo-retorno 45% (Sharpe + α amortiguado por r² + Sortino + resistencia a caídas) · Fundamentos 30% · Tendencia 25%, todo por percentil del universo; luego un CANDADO DE CONFIANZA acerca el puntaje al neutro si la data es débil. Un score alto significa que las métricas SON buenas Y los datos son sólidos: al justificar, hazlo con convicción y NO agregues 'peros' que el score ya descontó (volatilidad, r² bajo, etc.). Solo menciona una alerta si es material y está en el campo 'alertas'.",
      detalle:{alpha_pp:d.alpha,alpha_amortiguado:d.alphaAdj,r2:d.r2,sharpe:d.sharpe,sigma_pct:d.sig,caidaMax_pct:d.maxDD,momentum6m_pct:d.mom6m,posicion52sem_pct:d.pos52,upside_analistas_pct:d.upside},
      alertas:d.alertas||[]};
  }catch(e){}
  return o;}
function cpExposure(sel){const PM=pMetrics(sel);const Z={};MFSTYLE.forEach(k=>Z[k]=+(PM.ws.reduce((a,x)=>a+x.w*MF.z[x.s.t][k],0)).toFixed(2));const erMF=+(PM.ws.reduce((a,x)=>a+x.w*MF.er[x.s.t],0)).toFixed(2);return {PM,Z,erMF};}

/* ---- formato de mensajes (markdown mínimo, escapado) ---- */
function cpEsc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function cpFormat(t){
  let s=cpEsc(t);
  s=s.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  const lines=s.split(/\n/);let html="",inList=false;
  lines.forEach(ln=>{
    if(/^\s*[-•]\s+/.test(ln)){if(!inList){html+="<ul>";inList=true;}html+="<li>"+ln.replace(/^\s*[-•]\s+/,"")+"</li>";}
    else{if(inList){html+="</ul>";inList=false;}if(ln.trim()==="")html+="";else html+="<p>"+ln+"</p>";}
  });
  if(inList)html+="</ul>";
  return html;
}
/* recorte + compactación de lo que se ENVÍA a la API (no toca cpMsgs que se renderiza):
   acota los tokens de ENTRADA que crecen turno a turno por reenviar tool_result voluminosos. */
const CP_N_TURNOS=6, CP_TR_FRESCO=2, CP_TR_MAXLEN=180;
const CP_TR_STUB="…[truncado: vuelve a llamar la tool si necesitas el detalle]";
function cpApiMessages(){
  const starts=[];cpMsgs.forEach((m,i)=>{if(m.role==="user"&&typeof m.content==="string")starts.push(i);});
  const cutIdx=starts.length>CP_N_TURNOS?starts[starts.length-CP_N_TURNOS]:0;
  const freshIdx=starts.length>CP_TR_FRESCO?starts[starts.length-CP_TR_FRESCO]:0;
  const out=[];
  for(let i=cutIdx;i<cpMsgs.length;i++){const m=cpMsgs[i];
    // descarta mensajes assistant vacíos (refusal / corte antes del 1er bloque) que la API rechazaría con 400
    if(m.role==="assistant"&&(!m.content||(Array.isArray(m.content)&&!m.content.some(b=>(b.type==="text"&&b.text&&b.text.trim())||b.type==="tool_use"))))continue;
    if(m.role==="user"&&Array.isArray(m.content)&&i<freshIdx){
      out.push({role:"user",content:m.content.map(b=>{if(b.type!=="tool_result")return b;let c=typeof b.content==="string"?b.content:JSON.stringify(b.content);if(c.length>CP_TR_MAXLEN)c=c.slice(0,CP_TR_MAXLEN)+CP_TR_STUB;return {type:"tool_result",tool_use_id:b.tool_use_id,content:c};})});
    }else out.push({role:m.role,content:m.content});
  }
  // el envío debe empezar por un user de texto y no dejar un tool_result huérfano
  while(out.length&&out[0].role==="user"&&Array.isArray(out[0].content))out.shift();
  while(out.length&&out[0].role==="assistant")out.shift();
  return out;
}
/* presupuesto de salida dinámico por intención: barato en datos puntuales, generoso en análisis */
const CP_L1=380, CP_L2=700, CP_L3=2000;
let cpTurnMax=CP_L2;
const CP_DEEP_RE=/(analiz|análisis|analisis|compar|\bvs\b|versus|optimiz|rebalance|reasign|diagnostic|diagnóstic|recomien|propon|propón|construy|simula|evalú|evalua|conviene|deber[íi]a|lectura de mercado|escenario|estrateg|sensibilidad|stress|desempe[ñn]|drawdown|mejor.*(cartera|acci[óo]n)|revisa.*(cartera|portafolio))/;
const CP_DATA_RE=/^\s*(cu[áa]nto|cu[áa]l|qu[ée] (precio|beta|sharpe|retorno|valor|tpm)|precio de|beta de|sharpe de|dame el|dime el|mu[ée]strame|cotiza|list[áa]?me?|cu[áa]ndo|tpm|d[óo]lar|cobre|ipc|imacec)\b/;
function cpLastUserText(){for(let i=cpMsgs.length-1;i>=0;i--){const m=cpMsgs[i];if(m.role==="user"&&typeof m.content==="string")return m.content.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}return "";}
function maxTokensFor(){const q=cpLastUserText();if(!q)return CP_L3;if(CP_DEEP_RE.test(q))return CP_L3;const wc=q.split(/\s+/).filter(Boolean).length;if(CP_DATA_RE.test(q)||wc<=4)return CP_L1;return CP_L2;}

/* ---- loop agéntico ---- */
function cpTools(){const t=COPILOT_TOOLS.slice();if(t.length)t[t.length-1]=Object.assign({},t[t.length-1],{cache_control:{type:"ephemeral"}});return t;}
/* render acotado durante el streaming: re-pinta como máximo cada ~70ms (revela más pausado y usa muchos menos recursos que re-renderizar en cada token) */
let _cpRenderQueued=false;
function cpRenderBodyThrottled(){if(_cpRenderQueued)return;_cpRenderQueued=true;setTimeout(()=>{_cpRenderQueued=false;cpRenderBody();},135);}
async function cpStreamOnce(noTools){
  const sys=[{type:"text",text:cpSystemStatic(),cache_control:{type:"ephemeral"}}];   // bloque estable cacheado
  const dyn=cpSystemDynamic();if(dyn&&dyn.trim())sys.push({type:"text",text:dyn});   // notas volátiles, solo si las hay (un bloque vacío daría 400)
  const body={model:cpModel,max_tokens:cpTurnMax,system:sys,messages:cpApiMessages(),stream:true};
  if(!noTools)body.tools=cpTools();   // última iteración del loop sin tools: fuerza una respuesta de cierre
  let res;
  try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":cpKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(body)});}
  catch(err){return {error:"No se pudo conectar con Anthropic: "+err.message+"."};}
  if(!res.ok){let msg="Error "+res.status;try{const ej=await res.json();msg=(ej.error&&ej.error.message)||msg;}catch(_){}if(res.status===401)msg="Clave inválida o sin crédito. Revisa tu clave de Anthropic.";return {error:msg};}
  if(!res.body||!res.body.getReader){const data=await res.json();if(data.content&&data.content.length)cpMsgs.push({role:"assistant",content:data.content});cpRenderBody();return {stopReason:data.stop_reason};}
  const reader=res.body.getReader(),dec=new TextDecoder();const content=[];let stopReason=null,buf="";
  const ph=cpMsgs.push({role:"assistant",content})-1;
  const dropEmpty=()=>{if(cpMsgs[ph]&&cpMsgs[ph].content===content&&!content.some(x=>(x.type==="text"&&x.text&&x.text.trim())||x.type==="tool_use"))cpMsgs.splice(ph,1);};   // no dejar un assistant vacío que envenene el historial (400)
  try{
    while(true){
      const rd=await reader.read();if(rd.done)break;
      buf+=dec.decode(rd.value,{stream:true});let nl;
      while((nl=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line.startsWith("data:"))continue;
        const pl=line.slice(5).trim();if(!pl||pl==="[DONE]")continue;
        let ev;try{ev=JSON.parse(pl);}catch(e){continue;}
        if(ev.type==="content_block_start"){const cb=ev.content_block;content[ev.index]=cb.type==="tool_use"?{type:"tool_use",id:cb.id,name:cb.name,input:{},_j:""}:{type:"text",text:""};cpRenderBodyThrottled();}
        else if(ev.type==="content_block_delta"){const b=content[ev.index];if(!b)continue;if(ev.delta.type==="text_delta"){b.text+=ev.delta.text;cpRenderBodyThrottled();}else if(ev.delta.type==="input_json_delta"){b._j=(b._j||"")+ev.delta.partial_json;}}
        else if(ev.type==="content_block_stop"){const b=content[ev.index];if(b&&b.type==="tool_use"){try{b.input=b._j?JSON.parse(b._j):{};}catch(e){b.input={};}delete b._j;}}
        else if(ev.type==="message_delta"){if(ev.delta&&ev.delta.stop_reason)stopReason=ev.delta.stop_reason;}
        else if(ev.type==="error"){dropEmpty();return {error:(ev.error&&ev.error.message)||"Error de streaming."};}
      }
    }
  }catch(err){dropEmpty();return {error:"Conexión interrumpida: "+err.message+"."};}
  dropEmpty();
  return {stopReason};
}
async function cpSend(text){
  text=(text||"").trim();if(!text||cpBusy||!cpKey)return;
  cpMsgs.push({role:"user",content:text});cpTurnMax=maxTokensFor();cpBusy=true;cpRenderBody();cpRenderFoot();
  try{
    let guard=0,lastStop=null;
    while(guard++<10){
      const out=await cpStreamOnce(guard>=10);   // 10ª iteración sin tools: cierra en vez de quedar en un tool_result colgante
      if(out.error){cpMsgs.push({role:"assistant",content:[{type:"text",text:"⚠ "+out.error}]});break;}
      lastStop=out.stopReason;
      if(out.stopReason==="tool_use"){
        const lc=cpMsgs[cpMsgs.length-1].content;
        const results=(lc||[]).filter(b=>b.type==="tool_use").map(b=>({type:"tool_result",tool_use_id:b.id,content:cpRunTool(b.name,b.input)}));
        cpMsgs.push({role:"user",content:results});cpRenderBody();continue;
      }
      break;
    }
    if(lastStop==="max_tokens"&&cpTurnMax>=CP_L3){const la=cpMsgs[cpMsgs.length-1];if(la&&la.role==="assistant"&&Array.isArray(la.content)){for(let k=la.content.length-1;k>=0;k--){if(la.content[k].type==="text"){la.content[k].text+="\n\n_…respuesta extensa truncada — pídeme «continúa» para seguir._";break;}}}}
  }catch(err){cpMsgs.push({role:"assistant",content:[{type:"text",text:"⚠ No se pudo conectar con Anthropic: "+err.message+"."}]});}
  cpBusy=false;cpRenderBody();cpRenderFoot();
}

const PROF_LEVELS={
  1:{name:"Conservador",cls:"cons",profile:"conservador",desc:"Priorizas no perder. Buscas estabilidad, baja volatilidad e ingresos por dividendo; el crecimiento es secundario.",factores:"Low-Volatility, Quality y Dividend Yield",mix:"5–6 acciones defensivas, máx ~25% por acción",beta:"β bajo (≈0,5–0,8)",alloc:{rf:90,rv:10,alt:0},guideShort:"Preservar capital: baja volatilidad, calidad y dividendos; cartera muy diversificada y β bajo."},

  5:{name:"Agresivo",cls:"agr",profile:"riesgoso",desc:"Buscas maximizar el crecimiento y toleras alta volatilidad. Aceptas fuerte concentración y caídas profundas por mayor retorno potencial.",factores:"Momentum, Size (small-cap) y Growth",mix:"2–4 acciones, hasta ~50% por acción",beta:"β alto (>1,3)",alloc:{rf:8,rv:82,alt:10},guideShort:"Maximiza crecimiento y tolera volatilidad: momentum, small-cap y growth, cartera concentrada, β alto."}
};
const PROF_FREQ={mensual:12,trimestral:4,anual:1};
let profAns=lsGet("inv_profile_ans_v1")||{}, profGoal=lsGet("inv_profile_goal_v1")||{}, invProfile=lsGet("inv_profile_v1")||null, profEdit=false;
function profQMax(q){return q.multi?q.o.reduce((a,o)=>a+o[1],0):Math.max.apply(null,q.o.map(o=>o[1]));}
function profDimScore(dim){
  let num=0,den=0;
  PROF_Q.filter(q=>q.dim===dim&&!q.bool).forEach(q=>{
    const mx=profQMax(q),w=q.w||1;
    let s;
    if(q.multi){const arr=profAns[q.id]||[];s=q.o.reduce((a,o,i)=>a+(arr.indexOf(i)>=0?o[1]:0),0);}
    else{const v=profAns[q.id];s=(v==null)?0:+v;if(q.rev)s=mx-s;}
    num+=s*w;den+=mx*w;
  });
  return den?100*num/den:0;
}
function profBand(s){return s<=20?1:s<=40?2:s<=60?3:s<=80?4:5;}
function profReqCAGR(g){
  g=g||{};const A=+g.actual||0,O=+g.objetivo||0,m=+g.aporte||0,n=+g.anios||0;
  if(!(O>0&&n>0))return null;
  const aa=m*(PROF_FREQ[g.freq]||12);
  const fv=r=>{if(Math.abs(r)<1e-9)return A+aa*n;const g1=Math.pow(1+r,n);return A*g1+aa*(g1-1)/r;};
  let lo=-0.5,hi=2.0;
  if(fv(lo)>=O)return -0.5;
  if(fv(hi)<=O)return 2.0;
  for(let i=0;i<90;i++){const mid=(lo+hi)/2;if(fv(mid)<O)lo=mid;else hi=mid;}
  return (lo+hi)/2;
}
function profRRlevel(cagr){if(cagr==null)return null;return cagr<=0.02?1:cagr<=0.04?2:cagr<=0.06?3:cagr<=0.08?4:5;}
function profAnswered(){return PROF_REQUIRED.filter(id=>{const v=profAns[id];return v!==undefined&&v!==null;}).length;}
function profCompute(){
  const RTS=Math.round(profDimScore("RTS")),RCS=Math.round(profDimScore("RCS")),KE=Math.round(profDimScore("KE"));
  const cagr=profReqCAGR(profGoal),RRlvl=profRRlevel(cagr);
  const lRTS=profBand(RTS),lRCS=profBand(RCS),lKE=profBand(KE);
  let base=Math.min(lRTS,lRCS),rec,note;
  const flags={inconsistency:false,goal_gap:false,liquidity_warning:false,short_horizon:false};
  if(RRlvl==null){rec=base;note="Meta no definida: el riesgo recomendado se basa en lo que quieres (tolerancia) y puedes (capacidad) asumir. Completa tu meta para detectar brechas.";}
  else if(RRlvl<base){rec=RRlvl;note="Tu objetivo es alcanzable con menos riesgo del que toleras y puedes asumir: no conviene exponerte de más.";}
  else if(RRlvl>base){rec=base;flags.goal_gap=true;note="Brecha de meta: tu objetivo exigiría más riesgo del que puedes/quieres tomar. En vez de subir el riesgo, considera aumentar el aporte, extender el horizonte o ajustar el monto objetivo.";}
  else{rec=base;note="Tu tolerancia, tu capacidad y la meta están alineadas.";}
  /* reglas de negocio */
  if((+profAns.C1)===0){rec=Math.min(rec,2);flags.short_horizon=true;}
  if((+profAns.C3)===0){rec=Math.min(rec,3);flags.liquidity_warning=true;}
  /* control de consistencia: T4 (invertido) vs media de ítems directos de RTS */
  const dir=["T1","T2","T3","T5"].map(id=>{const q=PROF_Q.find(x=>x.id===id);const v=profAns[id];return v==null?null:(+v)/profQMax(q);}).filter(v=>v!=null);
  const t4v=profAns.T4;if(dir.length&&t4v!=null){const t4n=(3-(+t4v))/3,dm=dir.reduce((a,b)=>a+b,0)/dir.length;if(Math.abs(dm-t4n)>0.5)flags.inconsistency=true;}
  /* gate de idoneidad */
  const complex_ok=!(profAns.K3===0||profAns.K3===false||lKE===1);
  rec=Math.max(1,Math.min(5,rec));
  const L=PROF_LEVELS[rec];

/* paleta categórica de series, en ORDEN FIJO y validada (banda de luminosidad, croma, separación CVD ≥12 entre
   adyacentes y contraste ≥3:1 sobre superficie clara y oscura) — no reordenar ni ciclar */
const IMP_PAL=["#1E5FD1","#D9730D","#0E8F86","#DB2777","#65A30D","#7C3AED","#A8700C","#0369A1","#9F1239","#0E8C5E","#6D54D8","#B45309","#0891B2","#BE185D","#4D7C0F","#4338CA"];
const IMP_PY={diario:252,semanal:52,mensual:12};
const IMP_KNOWN=[[/banco de cr|^bci/i,"BCI"],[/cervecer|^ccu/i,"CCU"],[/banco de chile|banco chile/i,"CHILE"],[/santander/i,"SANTANDER"],[/enel/i,"ENELCHILE"],[/colb/i,"COLBUN"],[/falabella/i,"FALABELLA"],[/cencosud/i,"CENCOSUD"],[/copec/i,"COPEC"],[/cmpc/i,"CMPC"],[/sqm|sociedad qu/i,"SQM-B"],[/entel/i,"ENTEL"],[/latam/i,"LATAM"],[/parque arauco|parauco/i,"PARAUCO"],[/ipsa/i,"IPSA"]];
let impFiles=[], IMP=lsGet("inv_import_v1")||null, impFreq="mensual", impRf=RF, impBench=null, impMsg="";

function impTickerFrom(fn){let s=fn.replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ").replace(/\b(stock|price|history|historical|data)\b/gi,"").replace(/\s+/g," ").trim();for(const[re,t]of IMP_KNOWN)if(re.test(s)||re.test(fn))return t;const w=s.split(" ").filter(Boolean);if(!w.length)return "ACCION";const f=w[0].toUpperCase();return f.length<=10?f:f.slice(0,10);}
function impSplit(line,delim){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(ch===delim&&!q){out.push(cur);cur="";}else cur+=ch;}out.push(cur);return out;}
/* normaliza una fecha a YYYY-MM-DD. dateMode: "es" = día/mes (03/07 = 3 de julio) · "us"/omitido = mes/día.
   Un número >12 desambigua solo y manda sobre el modo. Valida que la fecha EXISTA (round-trip): "2025-13-03"
   o un 31 de un mes de 30 días devuelven "" y la fila se descarta, en vez de entrar como fecha fantasma. */
function impNorm(s,dateMode){s=(""+s).trim().replace(/^"|"$/g,"");
  const mk=(y,mo,d)=>{y=+y;mo=+mo;d=+d;if(!(mo>=1&&mo<=12&&d>=1&&d<=31))return "";const t=new Date(y,mo-1,d);return (t.getFullYear()===y&&t.getMonth()===mo-1&&t.getDate()===d)?(y+"-"+("0"+mo).slice(-2)+"-"+("0"+d).slice(-2)):"";};
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m){const a=+m[1],b=+m[2];const dayFirst=(a>12)?true:(b>12)?false:(dateMode==="es");return dayFirst?mk(m[3],b,a):mk(m[3],a,b);}
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)return mk(m[3],m[2],m[1]);   // dd.mm.yyyy: export típico de investing.com en español
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return mk(m[1],m[2],m[3]);
  m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);if(m)return mk(m[3],m[2],m[1]);
  return s;}
function impNum(s,mode){s=(""+s).trim().replace(/^"|"$/g,"").replace(/\s/g,"").replace(/\$/g,"").replace(/%/g,"");if(s==="")return NaN;if(mode==="es"){s=s.replace(/\./g,"").replace(",",".");}else{s=s.replace(/,/g,"");}return parseFloat(s);}
/* modo decimal según la FORMA de los valores, no el delimitador: "6.550,70" es chileno (miles con punto)
   aunque el archivo venga separado por comas — con el delimitador solo, esos precios entraban 1000× más chicos. */
function impDecMode(vals,fallback){for(const s0 of (vals||[])){const v=(""+s0).trim().replace(/^"|"$/g,"");if(!v)continue;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)||/^-?\d+,\d+$/.test(v))return "es";if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)||/^-?\d+\.\d+$/.test(v))return "us";}return fallback;}
/* convención de fecha del archivo: si algún dd/mm/yyyy trae el PRIMER número >12 es día-primero ("es");
   si trae el SEGUNDO >12 es mes-primero ("us"). Sin evidencia en ninguna fila, se usa el fallback. */
function impDateMode(cells,fallback){let df=0,mf=0;for(const s0 of (cells||[])){const m=(""+s0).trim().replace(/^"|"$/g,"").match(/^(\d{1,2})\/(\d{1,2})\/\d{4}$/);if(!m)continue;if(+m[1]>12)df++;else if(+m[2]>12)mf++;}return df>mf?"es":mf>df?"us":fallback;}
function impParseInvesting(text,ticker){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const head=impSplit(lines[0],",").map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
  let di=head.indexOf("date"),pi=head.indexOf("price");if(di<0)di=0;if(pi<0)pi=1;
  const rows=[];for(let i=1;i<lines.length;i++){const c=impSplit(lines[i],",");const d=impNorm(c[di]),px=impNum(c[pi],"us");if(d&&isFinite(px)&&px>0)rows.push([d,px]);}
  rows.sort((a,b)=>a[0]<b[0]?-1:1);
  return [{name:ticker,src:ticker,dates:rows.map(r=>r[0]),closes:rows.map(r=>r[1])}];
}
/* historial de UN activo (Stooq/Yahoo: Date,Open,High,Low,Close[,Volume] · su versión en español · o un
   simple Date,Close / Fecha,Último): es UNA serie — se toma solo el CIERRE. Sin esto, impParseCombined
   trataría Open/High/Low/Close/Volume como cinco "acciones" distintas o descartaría el archivo entero.
   El nombre sale del archivo (ipsa_d.csv → IPSA vía impTickerFrom). */
function impParseOhlc(text,ticker){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const delim=(lines[0].split(";").length>lines[0].split(",").length)?";":",";
  const head=impSplit(lines[0],delim).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
  const di=head.findIndex(h=>/^(date|fecha)$/.test(h));
  let ci=head.findIndex(h=>/^(close|cierre|último|ultimo)$/.test(h));
  if(ci<0)ci=head.findIndex(h=>/^adj\.? ?close$/.test(h));
  if(ci<0)ci=head.findIndex(h=>/^(price|precio)$/.test(h));
  if(di<0||ci<0)throw new Error("no se encontró la columna de fecha o la de cierre");
  const body=lines.slice(1).map(l=>impSplit(l,delim));
  const mode=impDecMode(body.map(c=>c[ci]),delim===";"?"es":"us");
  const dmode=impDateMode(body.map(c=>c[di]),mode==="es"?"es":"us");
  const rows=[];
  for(const c of body){const d=impNorm(c[di],dmode),px=impNum(c[ci],mode);if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&isFinite(px)&&px>0)rows.push([d,px]);}
  rows.sort((a,b)=>a[0]<b[0]?-1:1);
  return [{name:ticker,src:ticker,dates:rows.map(r=>r[0]),closes:rows.map(r=>r[1])}];
}
/* nombres de columnas de mercado que NUNCA son una acción (OHLC/volumen/variación): si un archivo combinado
   las trae, son metadatos de un export tipo Stooq/Investing, no tickers — se descartan para que no entren
   a la base como "acciones" fantasma (Volume, Close, High…). */
const IMP_BOGUS_COL=/^(open|high|low|close|adj\.? ?close|volume|vol\.?|price|apertura|m[áa]x\.?|m[áa]ximo|m[íi]n\.?|m[íi]nimo|cierre|[úu]ltimo|%? ?var\.?%?)$/i;
function impParseCombined(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const delim=(lines[0].split(";").length>lines[0].split(",").length)?";":",";

function pdMeta(t,srcName){const st=((typeof DEMO!=="undefined"&&DEMO.stocks)||(typeof STOCKS!=="undefined"?STOCKS:[])||[]).find(s=>s.t===t)||(typeof DATA_UNIVERSE!=="undefined"?DATA_UNIVERSE.find(s=>s.t===t):null)||{};const ci=Object.keys(PRICEDB.tickers).length;return {n:srcName||st.n||t,s:st.s||"",c:st.c||(typeof IMP_PAL!=="undefined"?IMP_PAL[ci%IMP_PAL.length]:"#1E5FD1"),b:(st.b!=null?st.b:null)};}
/* ¿es una fecha válida para la base? Debe EXISTIR en el calendario (un "2025-13-03" o un 30 de febrero

function validBaseDate(date){if(!date)return false;const m=(""+date).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return false;
  const t=new Date(+m[1],+m[2]-1,+m[3]);if(!(t.getFullYear()===+m[1]&&t.getMonth()===+m[2]-1&&t.getDate()===+m[3]))return false;
  return isTradingDay(date)&&date<=lastTradingDay();}
/* última fecha con datos reales en la base (para proponerla por defecto en los cierres y no inventar un día por delante) */
function lastBaseDate(){try{const ds=pricedbAllDates();if(ds.length)return ds[ds.length-1];}catch(e){}return lastTradingDay();}
/* carga diaria / puntual: escribe un día (fecha + IPSA + precios) en la base. RECHAZA fechas que no corresponden
   (fin de semana o futuras) para que ni un cierre manual ni una planilla puedan ensuciar la base con días inexistentes. */
function pricedbUpsertDay(date,ipsa,priceMap){
  if(!validBaseDate(date))return;
  if(ipsa!=null&&isFinite(ipsa)&&ipsa>0)PRICEDB.ipsa[date]=+ipsa;
  Object.keys(priceMap||{}).forEach(t=>{const v=priceMap[t];if(v==null||!isFinite(v)||v<=0)return;
    const nm=pdIndexOf(t,"IPSA");   // "IPSA"/"IGPA" tipeado como acción va al ÍNDICE, no a la base de acciones (igual que en pricedbMergeFiles)

/* índices/benchmarks disponibles en la base: IPSA vive en PRICEDB.ipsa; otros (IGPA, …) en PRICEDB.idx */
/* ¿la serie es un índice/benchmark? Exige coincidencia de PALABRA o nombre exacto: un ticker que solo

function pdIndexOf(n,benchName){const s=(""+n).trim();
  if(benchName&&s===benchName)return /\bigpa\b/i.test(s)?"IGPA":"IPSA";
  if(/\bigpa\b/i.test(s))return "IGPA";
  if(/\bipsa\b/i.test(s))return "IPSA";
  if(/^(índice|indice|index|benchmark|bench)$/i.test(s))return "IPSA";
  return null;}

function pricedbMergeFiles(files,benchName){
  let added=0,updated=0,tk=0,skipped=0;
  // FUSIÓN por celda (acción × fecha), "el último dato manda": una fila nueva reemplaza el valor de esa
  // acción en esa fecha (p.ej. una planilla oficial pisa un cierre manual del mismo día), pero NUNCA borra
  // otras fechas ni otras acciones. Solo se aceptan días hábiles y no futuros.
  (files||[]).forEach(f=>{const dates=f.dates||[],closes=f.closes||[];const nm=pdIndexOf(f.name,benchName);
    if(nm){const tgt=(nm==="IPSA")?PRICEDB.ipsa:((PRICEDB.idx=PRICEDB.idx||{})[nm]=PRICEDB.idx[nm]||{});for(let i=0;i<dates.length;i++){const d=dates[i],v=+closes[i];if(!validBaseDate(d)){if(d)skipped++;continue;}if(isFinite(v)&&v>0){if(tgt[d]!=null)updated++;else added++;tgt[d]=v;}}return;}
    const t=f.name;tk++;PRICEDB.px[t]=PRICEDB.px[t]||{};if(!PRICEDB.tickers[t])PRICEDB.tickers[t]=pdMeta(t,f.src);
    for(let i=0;i<dates.length;i++){const d=dates[i],v=+closes[i];if(!validBaseDate(d)){if(d)skipped++;continue;}if(isFinite(v)&&v>0){if(PRICEDB.px[t][d]!=null)updated++;else added++;PRICEDB.px[t][d]=v;}}

  return {added,updated,tk,skipped};
}

   mantiene el índice al día pero no puede traer su historia; esto la completa una vez. */
async function ipsaBackfill(years){
  years=years||2;
  const f=x=>""+x.getFullYear()+("0"+(x.getMonth()+1)).slice(-2)+("0"+x.getDate()).slice(-2);
  const stq="https://stooq.com/q/d/l/?s=%5Eipsa&i=d&d1="+f(new Date(Date.now()-years*365*864e5))+"&d2="+f(new Date());
  const routes=[stq,"https://corsproxy.io/?url="+encodeURIComponent(stq),"https://api.allorigins.win/raw?url="+encodeURIComponent(stq),"https://thingproxy.freeboard.io/fetch/"+stq];
  let dates=null,closes=null,err="sin respuesta";
  for(const u of routes){
    try{
      const t=await mktGet(u,"text",10000);
      const lines=(t||"").trim().split(/\r?\n/);
      if(lines.length<10||!/^date,/i.test(lines[0])){err="respuesta inesperada de Stooq";continue;}
      const ds=[],cs=[];
      for(let i=1;i<lines.length;i++){const c=lines[i].split(",");const d=c[0],v=+c[4];if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&isFinite(v)&&v>0){ds.push(d);cs.push(v);}}
      if(ds.length>=10){dates=ds;closes=cs;break;}
      err="CSV con muy pocas filas";
    }catch(e){err=String((e&&e.message)||e);}
  }
  if(!dates)return {ok:false,err};
  const r=pricedbMergeFiles([{name:"IPSA",src:"IPSA (Stooq)",dates,closes}],"IPSA");
  const ap=pricedbApplyToProjects();
  return {ok:true,n:dates.length,from:dates[0],to:dates[dates.length-1],added:r.added,updated:r.updated,nPts:ap.nPts};
}
async function autopxSync(manual){

    if(!days.length)throw new Error("el JSON no trae días de cierre");

      if(d.ipsa!=null&&isFinite(+d.ipsa)&&+d.ipsa>0){ips.dates.push(d.date);ips.closes.push(+d.ipsa);}
      Object.keys(d.prices||{}).forEach(k=>{
        if(!/^[A-ZÑ0-9][A-ZÑ0-9.\-_]{0,13}$/i.test(k))return;   // el JSON es remoto: solo tickers con forma válida (nunca HTML) llegan a la base

    if(manual)window.alert("Cierres sincronizados desde la fuente automática.\n\n• "+r.added+" precio(s) nuevo(s) · "+r.updated+" actualizado(s)"+(r.skipped?" · "+r.skipped+" ignorado(s) (fin de semana/futuro)":"")+"\n• Seguimientos: "+ap.nPts+" punto(s) en "+ap.nProj+" cartera(s).");

      const ae=document.activeElement,typing=ae&&/^(INPUT|TEXTAREA|SELECT)$/i.test(ae.tagName);
      if(manual||!typing){try{render();}catch(e){}}

  }catch(e){
    const info={at:new Date().toISOString(),error:String((e&&e.message)||e)};
    try{localStorage.setItem("inv_autopx_last",JSON.stringify(info));}catch(_){}
    if(manual)window.alert("No se pudo sincronizar: "+info.error+"\n\nRevisa la URL en ⚙ Configuración → Datos y que el JSON sea público (raw.githubusercontent o Gist permiten CORS).");
    return info;
  }

/* copia el universo demo IPSA (14 acciones × 23 meses + IPSA) a la base, sin pisar datos ya cargados */
function pricedbSeedDemo(){
  try{
    const labs=(typeof DATA!=="undefined"&&DATA.labels)?DATA.labels:null;if(!labs||!labs.length)return 0;
    const dts=labs.map(labelToDate);let n=0;
    (DATA.stocks||[]).forEach(s=>{const pr=s.prices||[];if(!pr.length)return;
      PRICEDB.px[s.t]=PRICEDB.px[s.t]||{};
      if(!PRICEDB.tickers[s.t])PRICEDB.tickers[s.t]={n:s.n||s.t,s:s.s||"",c:s.c||"#1E5FD1",b:s.b};
      const m=Math.min(pr.length,dts.length),off=pr.length-m;for(let i=0;i<m;i++){const v=pr[off+i];if(v>0&&isFinite(v)&&PRICEDB.px[s.t][dts[i]]==null){PRICEDB.px[s.t][dts[i]]=+v;n++;}}});
    // IPSA reconstruido desde los retornos del mercado; ancla el último valor del demo al IPSA más antiguo de los proyectos para que conecten en escala
    const mk=(typeof MKT!=="undefined"&&MKT&&MKT.rets&&MKT.rets.length)?MKT.rets:((DATA.market&&DATA.market.rets)||null);
    if(mk&&mk.length){let anchor=8000;try{const im=consolidatedSeries().ipsaMap||{},pd=Object.keys(im).sort();if(pd.length)anchor=im[pd[0]];}catch(e){}

/* guarda en la base los CIERRES de los proyectos (no las operaciones); idempotente, no pisa lo existente */
function pricedbIngestProjects(){

    if(w.ev)return;   // semana de OPERACIÓN (compra/venta/aporte): contabilidad, nunca alimenta la base de precios
    if(!isTradingDay(w.date))return;   // no ingresa días no hábiles a la base

/* núcleo del análisis: resamplea a la frecuencia y halla la corrida CONSECUTIVA más reciente
   donde el benchmark y TODOS los tickers pedidos tienen dato (datos vigentes, alineados y a la cadencia correcta) */
function pricedbAnalysisCore(freq,opts){
  opts=opts||{};
  const PY={diario:252,semanal:52,mensual:12}[freq]||12;
  const src=opts.source||null,pxAll=src?(src.tick||{}):PRICEDB.px;
  const benchName=opts.bench||"IPSA";
  const benchMap=src?(benchName==="IPSA"?(src.ipsaMap||{}):pricedbIdxMap(benchName)):pricedbIdxMap(benchName);
  let tickers=Object.keys(pxAll||{});
  if(opts.tickers&&opts.tickers.length)tickers=tickers.filter(t=>opts.tickers.indexOf(t)>=0);
  const rs=m=>{const o={};Object.keys(m||{}).sort().forEach(d=>{const v=+m[d];if(v>0&&isFinite(v))o[periodKey(d,freq)]={d,v};});return o;};
  const ipsaR=rs(benchMap),tickR={};tickers.forEach(t=>tickR[t]=rs(pxAll[t]||{}));
  const bk=Object.keys(ipsaR).sort((a,b)=>ipsaR[a].d<ipsaR[b].d?-1:1);
  // corrida consecutiva MÁS RECIENTE de una lista de claves (consecutividad real a la frecuencia, vía gapOK sobre las fechas)
  const recentRun=keys=>{if(!keys.length)return [];let r=[keys[keys.length-1]];for(let i=keys.length-2;i>=0;i--){if(gapOK(ipsaR[keys[i]].d,ipsaR[keys[i+1]].d,freq))r.unshift(keys[i]);else break;}return r;};

  const inter=tickers.length?bk.filter(pk=>tickers.every(t=>tickR[t][pk]!=null)):[];
  const common=recentRun(inter);

  const perTicker={},tickLast={};tickers.forEach(t=>{const ks=bk.filter(pk=>tickR[t][pk]!=null);perTicker[t]=recentRun(ks).length;tickLast[t]=ks.length?ipsaR[ks[ks.length-1]].d:null;});
  const dts=tickers.map(t=>tickLast[t]).filter(Boolean).sort();const groupLatest=dts.length?dts[dts.length-1]:null;
  return {PY,ipsaR,tickR,tickers,benchName,benchHasData:bk.length>0,common,perTicker,tickLast,groupLatest,
    from:common.length?ipsaR[common[0]].d:null,to:common.length?ipsaR[common[common.length-1]].d:null};
}
/* deriva el dataset de análisis (IMP) desde la corrida consecutiva común, con la ventana pedida */
function pricedbToIMP(freq,opts){
  freq=freq||"mensual";opts=opts||{};

  let run=core.common;

/* SALTO DE ESCALA en el benchmark: un índice bursátil NO varía 40% en un mes (ni 15% en un día / 25% en una semana).

function pricedbBenchJump(core,freq,run){
  const th=freq==="diario"?0.15:freq==="semanal"?0.25:0.40;
  for(let i=1;i<run.length;i++){
    const a=core.ipsaR[run[i-1]],b=core.ipsaR[run[i]];

  }

}
function pricedbCheckAnalysis(freq,opts){
  freq=freq||"mensual";opts=opts||{};

  const unit=freq==="diario"?"días":freq==="semanal"?"semanas":"meses";
  if(!core.benchHasData)return {ok:false,unit,reason:"No hay datos del índice ("+(opts.bench||"IPSA")+") en la base. Cárgalo en Configuración → Datos."};
  if(!core.tickers.length)return {ok:false,unit,reason:"No hay acciones seleccionadas."};
  // la construcción (pricedbToIMP) exige ≥4 puntos (3 retornos): una ventana de 1–2 pasaría este chequeo y fallaría igual al crear
  if(opts.lastN&&opts.lastN>0&&opts.lastN<3)return {ok:false,unit,reason:"La ventana mínima de un análisis es 3 "+unit+" (4 puntos). Sube «últimos "+unit+"» a 3 o más, o usa 0 para todo el historial."};

  const needPts=(opts.lastN&&opts.lastN>0)?(opts.lastN+1):4;

  let run=core.common;if(opts.lastN&&opts.lastN>0&&run.length>opts.lastN+1)run=run.slice(run.length-(opts.lastN+1));
  const jump=pricedbBenchJump(core,freq,run);
  if(jump)return {ok:false,unit,jump,reason:"El "+(core.benchName||"IPSA")+" salta "+(jump.ret>=0?"+":"")+jump.ret.toFixed(0)+"% entre el "+jump.from+" ("+jump.v0.toLocaleString("es-CL")+") y el "+jump.to+" ("+jump.v1.toLocaleString("es-CL")+"): hay valores de DOS escalas/fuentes mezclados en la base. Con eso las β saldrían ≈0. Elimina esos datos (Datos → Quitar este día) o limpia y recarga el índice de una sola fuente."};

}

/* cobertura por cadencia: para cada acción (y el IPSA) cuántos períodos CONSECUTIVOS recientes tiene a cada
   cadencia (diario/semanal/mensual) con sus fechas reales, y cuál es su cadencia "principal" (la más fina con racha ≥3). */
function coverageByFreq(){
  const FREQS=[["diario","daily"],["semanal","weekly"],["mensual","monthly"]];
  function recentRun(map,freq){
    const rs=resampleMap(map||{},freq);const total=rs.length;
    if(!total)return {n:0,from:null,to:null,total:0};
    let i=total-1;while(i>0&&gapOK(rs[i-1].d,rs[i].d,freq))i--;
    const run=rs.slice(i);return {n:run.length,from:run[0].d,to:run[run.length-1].d,total};
  }
  function classify(t,map,col,name){
    const o={t,name:name||t,col:col||"#1E5FD1"};
    FREQS.forEach(([f,k])=>{o[k]=recentRun(map,f);});
    // PRIMARIA = la cadencia con la racha consecutiva reciente MÁS LARGA (desempate: la más gruesa).
    // Así una acción con 24 meses + 3 días recientes queda como "mensual" (24>3), no "diaria".
    let primary=null,bestN=-1;
    [["mensual","monthly"],["semanal","weekly"],["diario","daily"]].forEach(([f,k])=>{if(o[k].n>bestN){bestN=o[k].n;primary=f;}});
    o.primary=bestN>=2?primary:null;return o;
  }
  const out=[];const meta=(PRICEDB&&PRICEDB.tickers)||{};
  Object.keys((PRICEDB&&PRICEDB.px)||{}).sort().forEach(t=>{const m=PRICEDB.px[t];if(!m||!Object.keys(m).length)return;const md=meta[t]||{};out.push(classify(t,m,md.c,md.n||t));});

}
/* detección de inconsistencias en la base (solo diagnostica; los arreglos los hace "Reparar base") */
function detectInconsistencies(){

  const tickers=Object.keys(PX).filter(t=>PX[t]&&Object.keys(PX[t]).length);
  if(!tickers.length&&!Object.keys(IPSA).length)return issues;
  const datesOf=t=>Object.keys(PX[t]).sort();
  // 1) fin de semana
  (function(){const wk={};tickers.forEach(t=>datesOf(t).forEach(d=>{if(!isTradingDay(d))wk[t]=1;}));Object.keys(IPSA).forEach(d=>{if(!isTradingDay(d))wk.IPSA=1;});const who=Object.keys(wk);if(who.length)issues.push({level:"warn",msg:"Hay fechas de fin de semana en la base (la bolsa no opera sáb/dom). Usa “Reparar base”.",tickers:who});})();
  // 2) acciones rezagadas

  (function(){const monthly=tickers.map(t=>{const ds=datesOf(t);return {t,from:ds[0].slice(0,7),to:ds[ds.length-1].slice(0,7),mp:resampleMap(PX[t],"mensual").length};}).filter(x=>x.mp>=2);if(monthly.length<2)return;const ls=monthly.reduce((a,b)=>b.from>a.from?b:a),ee=monthly.reduce((a,b)=>b.to<a.to?b:a);const os=ls.from,oe=ee.to;const months=os<=oe?(periodIndex(oe+"-15","mensual")-periodIndex(os+"-15","mensual")+1):0;if(months<3)issues.push({level:"warn",msg:"Las acciones no comparten suficiente historial mensual (solapamiento "+(months>0?(os+" → "+oe+", "+months+" mes(es)"):"vacío")+"): un análisis mensual conjunto no es comparable.",tickers:[ls.t,ee.t]});})();
  // 4) IPSA ausente donde hay acciones

  (function(){const cf=[];tickers.forEach(t=>{const rs=resampleMap(PX[t],"diario");if(rs.length<2)return;if(dropTrailingFlat(rs).length<rs.length)cf.push(t);});if(Object.keys(IPSA).length){const ri=resampleMap(IPSA,"diario");if(ri.length>=2&&dropTrailingFlat(ri).length<ri.length)cf.push("IPSA");}if(cf.length)issues.push({level:"warn",msg:"Valores finales repetidos idénticos (un cierre real no repite al decimal): posible arrastre. “Reparar base” los limpia.",tickers:cf});})();
  // 6) SALTO DE ESCALA en el IPSA: dos fuentes/escalas mezcladas (p.ej. 10.800 vs 6.500) → las β de cualquier análisis colapsan a ≈0.
  //    Umbral por cadencia (los mismos de pricedbBenchJump): un mixup fino que no llega al 40% mensual igual rompe un análisis diario/semanal.
  (function(){if(!Object.keys(IPSA).length)return;
    const TH=[["mensual",0.40],["semanal",0.25],["diario",0.15]];
    for(const [f,th] of TH){const rs=resampleMap(IPSA,f);
      for(let i=1;i<rs.length;i++){if(f!=="mensual"&&!gapOK(rs[i-1].d,rs[i].d,f))continue;const r=rs[i].v/rs[i-1].v-1;
        if(Math.abs(r)>th){issues.push({level:"warn",msg:"El IPSA salta "+(r>=0?"+":"")+(r*100).toFixed(0)+"% ("+f+") entre el "+rs[i-1].d+" ("+rs[i-1].v.toLocaleString("es-CL")+") y el "+rs[i].d+" ("+rs[i].v.toLocaleString("es-CL")+"): hay valores de DOS escalas/fuentes mezclados. Elimina esos días (Quitar este día) o limpia y recarga el índice de una sola fuente — si no, las β de los análisis salen ≈0."});return;}}}
  })();

let caState=null;
/* universo del análisis ACTIVO (demo IPSA o importado) reconstruido como serie fecha→precio, para poder parametrizarlo */
function caIndexNames(C,srcKey){const out=[];if(C&&C.ipsaMap&&Object.keys(C.ipsaMap).length)out.push("IPSA");if(srcKey!=="activo"){const ix=(typeof PRICEDB!=="undefined"&&PRICEDB.idx)||{};Object.keys(ix).forEach(k=>{if(k!=="IPSA"&&ix[k]&&Object.keys(ix[k]).length)out.push(k);});}return out;}
function caRows(C){return Object.keys(C.tick||{}).sort().map(t=>({t,n:(C.names&&C.names[t])||t,c:(C.cols&&C.cols[t])||"#1E5FD1",np:Object.keys(C.tick[t]).length}));}
function caEnsure(){
  if(!caState)caState={name:"",months:CA_MIN_MONTHS,bench:"IPSA",sel:{}};
  if(!caState.months||caState.months<CA_MIN_MONTHS)caState.months=CA_MIN_MONTHS;
  const C=consolidatedSeries();   // única fuente: la base poblada del sistema (Datos + cierres de carteras)
  Object.keys(C.tick||{}).forEach(t=>{if(caState.sel[t]===undefined)caState.sel[t]=true;});
  const idxs=caIndexNames(C,"sistema");if(!caState.bench||idxs.indexOf(caState.bench)<0)caState.bench=idxs[0]||"IPSA";

const CA_MIN_MONTHS=12;   // ventana mínima de un análisis: garantiza β/σ estables y una tabla SIEMPRE en retornos anuales
/* meses → nº de retornos a cada cadencia (~21 días hábiles y ~4,35 semanas por mes) */
function caMonthsToN(freq,months){return freq==="diario"?Math.round(months*21):freq==="semanal"?Math.round(months*4.345):Math.round(months);}
/* La ventana del análisis se pide SOLO en meses; la cadencia de la regresión se elige sola: la más FINA
   (diario→semanal→mensual) que cubra la ventana con TODAS las acciones. Se usa SEMANAL como preferida real
   (no diario) porque el diario infla la σ ~35% por ruido de microestructura y distorsiona el Sharpe; la
   semanal da una volatilidad limpia y suficientes puntos para la β. Con baja correlación (p.ej. telecos) la
   β semanal puede salir ruidosa: eso NO se esconde — el Investor Score amortigua el α por r² y las vistas lo
   advierten. Tolerancia del 5% para no rechazar por días de calendario. */
function caResolve(months,opts){
  let short=null,err=null;
  for(const f of ["semanal","mensual"]){   // el diario queda fuera: su σ inflada empeora el Sharpe de todo el universo
    const lastN=caMonthsToN(f,months),perM=f==="semanal"?4.345:1;
    const chk=pricedbCheckAnalysis(f,Object.assign({},opts,{lastN}));
    if(chk.jump)return {ok:false,error:chk.reason,chk};   // escalas mezcladas en el índice: problema de datos, no de ventana
    if(chk.ok)return {ok:true,freq:f,lastN,chk};
    if(chk.reason){if(!err)err=chk.reason;continue;}
    const mA=(chk.availRet||0)/perM;
    if(chk.availRet>=4&&mA>=CA_MIN_MONTHS&&chk.availRet>=Math.floor(lastN*0.95))return {ok:true,freq:f,lastN:chk.availRet,chk,trimmed:true,mAvail:mA};
    if(!short||mA>short.mAvail)short={mAvail:mA,chk};
  }
  if(short)return {ok:false,mAvail:short.mAvail,chk:short.chk};
  return {ok:false,error:err||"No hay datos suficientes en la base."};
}

      }

    }

    IMPSETS.push({id,name:nm,date:new Date().toLocaleDateString("es-CL"),imp,params:{months:caState.months,freq:R.freq,lastN:R.lastN,bench:caState.bench,tickers}});
    lsSet("inv_impsets_v1",IMPSETS);impsetActivate(id);
    try{const cp=curProj();if(cp){projAddLink(cp.id,"analysis",id);}}catch(e){}   // vincula el análisis al proyecto activo y lo deja como vigente
    caState.name="";modulo="eval";page="comparativa";render();
  };
  document.querySelectorAll("[data-caact]").forEach(b=>b.onclick=()=>{if(activateAnalysis(b.dataset.caact))render();});
  document.querySelectorAll("[data-cadel]").forEach(b=>b.onclick=()=>{const s=(IMPSETS||[]).find(x=>String(x.id)===String(b.dataset.cadel));if(confirm('¿Eliminar el análisis "'+(s?s.name:"")+'"? No se puede deshacer.'))impsetDelete(b.dataset.cadel);});
  const _hd=document.querySelector("[data-cahidedemo]");if(_hd)_hd.onclick=()=>{if(confirm('¿Quitar el análisis "IPSA · demo" de la lista? Sus 23 meses de datos ya están en la base del sistema, así que NO se pierden y puedes seguir creando análisis.')){lsSet("inv_demo_hidden",1);if(currentAnalysisId()==="demo"){const _l=(IMPSETS||[])[IMPSETS.length-1];if(_l)activateAnalysis(_l.id);else applyDataset("demo");}render();}};

    {html:`<div class="tw"><table><thead><tr><th>Acción</th><th class="r">Precio</th><th class="r">P/U</th><th class="r">P/U fwd</th><th class="r">P/B</th><th class="r">Yield div.</th><th class="r">EPS</th><th class="r">Capitalización</th><th>52 semanas</th><th>Señales</th></tr></thead><tbody>${rows}</tbody></table></div>`,flush:true},syncBtn);

function attachImport(){
  document.querySelectorAll("[data-impfreq]").forEach(b=>b.onclick=()=>{impFreq=b.dataset.impfreq;render();});
  const rf=document.getElementById("imprf");if(rf)rf.onchange=e=>{impRf=parseFloat(e.target.value)||0;impRfAuto=false;};
  const rfa=document.getElementById("imprfauto");if(rfa)rfa.onclick=()=>{impRfAuto=true;impRfTried=false;render();};
  if(impRfAuto){const ar=autoRf();if(ar!=null){if(Math.abs(ar-impRf)>1e-9){impRf=ar;const _i=document.getElementById("imprf");if(_i)_i.value=ar.toFixed(2);}}
    else if(!impRfTried&&typeof mindCore==="function"){impRfTried=true;mindCore().then(()=>{const a=autoRf();if(impRfAuto&&a!=null){impRf=a;render();}});}}
  const tm=document.getElementById("imptmpl");if(tm)tm.onclick=impDownloadTemplate;
  const drop=document.getElementById("impdrop"),fi=document.getElementById("impfile");
  if(drop&&fi){drop.onclick=()=>fi.click();drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag");};drop.ondragleave=()=>drop.classList.remove("drag");drop.ondrop=e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files.length)impOnFiles(e.dataTransfer.files);};fi.onchange=e=>{if(e.target.files.length)impOnFiles(e.target.files);};}
  document.querySelectorAll("[data-tk]").forEach(inp=>inp.onchange=()=>{impFiles[+inp.dataset.tk].name=(inp.value||"").trim()||impFiles[+inp.dataset.tk].name;});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{impFiles.splice(+b.dataset.rm,1);if(impBench&&!impFiles.some(s=>s.name===impBench))impBench=impFiles.length?"__avg__":null;render();});
  const bs=document.getElementById("impbench");if(bs)bs.onchange=e=>{impBench=e.target.value;};
  const cc=document.getElementById("impcalc");if(cc)cc.onclick=impCalc;
  const ir=document.getElementById("impreset");if(ir)ir.onclick=()=>{impFiles=[];impMsg="";render();};
  const dm=document.getElementById("impdemo");if(dm)dm.onclick=()=>applyDataset("demo");
  document.querySelectorAll("[data-activate]").forEach(b=>b.onclick=()=>impsetActivate(b.dataset.activate));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const s=IMPSETS.find(x=>x.id===b.dataset.del);if(confirm('¿Eliminar el análisis "'+(s?s.name:"")+'"? No se puede deshacer.'))impsetDelete(b.dataset.del);});
  document.querySelectorAll("[data-rename]").forEach(inp=>inp.onchange=()=>impsetRename(inp.dataset.rename,inp.value));
  document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{const[m,p]=b.dataset.goto.split(":");modulo=m;page=p;render();});
}

function mindFmt(v,dec,unit){
  if(v==null||!isFinite(v))return "—";
  const n=(+v).toLocaleString("es-CL",{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return unit==="%"?(n+"%"):(unit+" "+n);
}
function mindChange(k){const s=MINDH[k];if(!s||s.length<2)return null;const a=s[0],b=s[s.length-1];if(!a)return null;return (b/a-1)*100;}
function mindDate(f){if(!f)return "";const d=(""+f).slice(0,10).split("-");return d.length===3?(d[2]+"-"+d[1]+"-"+d[0]):f;}
function mindAgo(){if(!mindTs)return "";const ms=Date.now()-new Date(mindTs).getTime();const m=Math.round(ms/60000);if(m<1)return "recién";if(m<60)return "hace "+m+" min";const h=Math.round(m/60);if(h<24)return "hace "+h+" h";return "hace "+Math.round(h/24)+" d";}
function mindSparkSVG(series,colOverride){
  if(!series||series.length<2)return "";
  const w=104,h=26,n=series.length,mn=Math.min(...series),mx=Math.max(...series),rg=(mx-mn)||1;
  const pts=series.map((v,i)=>[(i/(n-1))*w,h-2-((v-mn)/rg)*(h-4)]);
  const up=series[n-1]>=series[0],col=colOverride||(up?"var(--green)":"var(--red)");   // colOverride: alinea el color de la curva con el signo del retorno mostrado
  const d="M"+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L");
  const gid="sp"+Math.abs((series[0]*1000|0)+series.length);
  return `<svg class="mkt-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w},${h} L0,${h} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---- fetch genérico con timeout ---- */
async function mktGet(url,kind,ms){
  const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),ms||13000);
  try{const r=await fetch(url,{signal:ctrl.signal,cache:"no-store"});clearTimeout(to);if(!r.ok)throw new Error("HTTP "+r.status);return kind==="json"?await r.json():await r.text();}
  finally{clearTimeout(to);}
}

  }catch(e){mindErr=(e.name==="AbortError")?"La conexión tardó demasiado (timeout). Reintenta.":("No se pudo conectar a mindicador.cl ("+e.message+").");}
}
function oilParseStooq(txt){
  const lines=(txt||"").trim().split(/\r?\n/);if(lines.length<2)return null;
  const head=lines[0].toLowerCase().split(",");const ci=head.indexOf("close"),di=head.indexOf("date");
  if(ci<0)return null;
  const rows=lines.slice(1).map(l=>l.split(",")).filter(c=>c.length>ci&&isFinite(+c[ci])&&+c[ci]>0);
  if(rows.length<2)return null;
  return {closes:rows.map(c=>+c[ci]), lastDate:di>=0?rows[rows.length-1][di]:null};
}
async function oilOne(d){
  const f=x=>""+x.getFullYear()+("0"+(x.getMonth()+1)).slice(-2)+("0"+x.getDate()).slice(-2);
  const stq="https://stooq.com/q/d/l/?s="+d.k+"&i=d&d1="+f(new Date(Date.now()-80*864e5))+"&d2="+f(new Date());

  for(const u of [stq,...prox(stq)]){try{const t=await mktGet(u,"text",8000);const p=oilParseStooq(t);if(p)return p;}catch(e){}}
  const ys=d.k==="cl.f"?"CL=F":d.k==="cb.f"?"BZ=F":null;
  if(ys){const yu="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(ys)+"?interval=1d&range=2mo";
    for(const u of prox(yu)){try{const t=await mktGet(u,"text",8000);const j=JSON.parse(t);const r=j.chart&&j.chart.result&&j.chart.result[0];const cl=r&&r.indicators&&r.indicators.quote[0].close;const cs=(cl||[]).filter(v=>v!=null&&isFinite(v));const ts=r&&r.timestamp;if(cs.length>=2)return {closes:cs,lastDate:ts?new Date(ts[ts.length-1]*1000).toISOString().slice(0,10):null};}catch(e){}}}
  return null;
}
async function oilFromUrl(){
  if(!OIL_URL)return false;
  try{const j=await mktGet(OIL_URL,"json",9000);
    const pk=(o,ks)=>{for(const k of ks)if(o&&o[k]!=null)return o[k];return null;};
    const m={"cl.f":pk(j,["wti","WTI","cl.f","CL=F"]),"cb.f":pk(j,["brent","Brent","cb.f","BZ=F"])};
    let ok=0;OIL=OIL||{};
    for(const k of ["cl.f","cb.f"]){const o=m[k];if(o&&typeof o==="object"){const v=+(o.value!=null?o.value:o.valor!=null?o.valor:o.price);if(isFinite(v)){const ch=(o.change!=null?o.change:(o.chg!=null?o.chg:o.variacion));OIL[k]={valor:v,chg:(ch!=null&&isFinite(+ch))?+ch:null,fecha:o.date||o.fecha||null};ok++;}}}

}

  const sameIdx=PF.weeks.findIndex(w=>w.date===date&&!w.ev);

  saveProjects();

}

let BROKER=(function(){try{const v=JSON.parse(localStorage.getItem("inv_broker_v1"));if(v&&typeof v==="object"){delete v.tax;return v;}}catch(e){} return Object.assign({},BROKER_PRESETS.btg);})();

function brokerName(){return (BROKER&&(BROKER_PRESETS[BROKER.op]||{}).name)||(BROKER&&BROKER.name)||"Personalizado";}
function brokerFee(monto){if(!BROKER)return 0;monto=Math.abs(+monto||0);if(!monto)return 0;let f=monto*(+BROKER.pct||0)/100;const mn=+BROKER.min||0,mx=+BROKER.max||0;if(mn>0&&f<mn)f=mn;if(mx>0&&f>mx)f=mx;if(BROKER.iva)f*=1.19;return Math.round(f);}

function ledger(){
  if(!PF||!WEEKS.length)return null;
  const base=WEEKS[0],sh={},avg={},tx=[],realized=[];
  function buy(date,t,qq,pp,tipo){if(!(qq>0))return;const old=sh[t]||0,oc=(avg[t]||0)*old;sh[t]=old+qq;avg[t]=(oc+qq*pp)/sh[t];tx.push({date,t,side:"buy",shares:qq,price:pp,monto:qq*pp,tipo});}
  function sell(date,t,qq,pp,tipo){const old=sh[t]||0,s=Math.min(qq,old);if(s<=1e-9)return;const cb=(avg[t]||0)*s,proceeds=s*pp,gain=proceeds-cb;sh[t]=old-s;tx.push({date,t,side:"sell",shares:s,price:pp,monto:proceeds,tipo,cost:cb,gain});realized.push({date,t,shares:s,price:pp,cost:cb,gain});}
  PF.holdings.forEach(hd=>{let p=base.prices[hd.t];if(p==null){const fw=WEEKS.find(w=>w.prices[hd.t]!=null);p=fw?fw.prices[hd.t]:null;}if(p==null||!(p>0))return;const q=(base.qty&&base.qty[hd.t]!=null)?base.qty[hd.t]:(hd.monto/p);buy(base.date,hd.t,q,p,"Compra inicial");});   // mismo fallback de precio base que invMetrics: sin él, una venta posterior saldría con costo 0 y ganancia inflada
  for(let i=1;i<WEEKS.length;i++){const w=WEEKS[i];if(!w.ev)continue;
    if(w.ev.kind==="inject"){const al=w.ev.alloc||{},sq=w.ev.shares;Object.keys(al).forEach(t=>{const q=(sq&&sq[t]>0)?sq[t]:al[t]/(w.prices[t]||base.prices[t]||1);buy(w.date,t,q,q>0?al[t]/q:0,"Aporte");});}
    else if(w.ev.kind==="trade"){const t=w.ev.t,p=w.ev.price||w.prices[t]||1;if(w.ev.side==="sell")sell(w.date,t,+w.ev.shares,p,"Venta");else buy(w.date,t,+w.ev.shares,p,"Compra");}
    else if(w.ev.kind==="rebal"&&w.ev.shares){Object.keys(w.ev.shares).forEach(t=>{const ns=w.ev.shares[t],old=sh[t]||0,p=w.prices[t]||base.prices[t]||1;if(ns>old+1e-9)buy(w.date,t,ns-old,p,"Rebalanceo");else if(ns<old-1e-9)sell(w.date,t,old-ns,p,"Rebalanceo");});}

function contabAgg(){
  const L=ledger(),IM=invMetrics();if(!L||!IM||!L.tx.length)return null;
  const lastW=WEEKS[WEEKS.length-1];
  const perT={};L.tx.forEach(x=>{const o=perT[x.t]||(perT[x.t]={t:x.t,buyMonto:0,buyQty:0,sellMonto:0,sellQty:0,realized:0});if(x.side==="buy"){o.buyMonto+=x.monto;o.buyQty+=x.shares;}else{o.sellMonto+=x.monto;o.sellQty+=x.shares;o.realized+=(x.gain||0);}});
  const rows=Object.values(perT).map(o=>{const sh=L.sh[o.t]||0,avg=L.avg[o.t]||0,cur=(lastW.prices[o.t]!=null?lastW.prices[o.t]:avg),val=sh*cur,unreal=(cur-avg)*sh;return Object.assign(o,{sh,avg,cur,val,unreal});});
  const totBuy=L.tx.filter(x=>x.side==="buy").reduce((a,x)=>a+x.monto,0);
  const totSell=L.tx.filter(x=>x.side==="sell").reduce((a,x)=>a+x.monto,0);
  const totReal=L.realized.reduce((a,r)=>a+r.gain,0);
  const totUnreal=rows.reduce((a,o)=>a+o.unreal,0);
  let feesBuy=0,feesSell=0,feesIva=0;L.tx.forEach(x=>{const fp=feeParts(x.monto);x.fee=fp.total;x.feeBase=fp.base;x.feeIva=fp.iva;feesIva+=fp.iva;if(x.side==="sell")feesSell+=fp.total;else feesBuy+=fp.total;});
  const fees=feesBuy+feesSell;
  const netGain=(totReal+totUnreal)-fees;         /* ganancia real: bruta − comisiones (IVA incluido) */
  return {L,IM,rows,totBuy,totSell,totReal,totUnreal,V:IM.last.val,lastW,feesBuy,feesSell,fees,feesIva,netGain};
}

let AUTH=lsGet("inv_auth_v1");
let authMode="login", authMsg="";
function authHashFallback(pw,salt){let h=5381;const s=salt+"|"+pw;for(let i=0;i<s.length;i++){h=(((h<<5)+h)^s.charCodeAt(i))>>>0;}let g=52711;for(let i=s.length-1;i>=0;i--){g=(((g<<5)+g)^s.charCodeAt(i))>>>0;}return h.toString(16).padStart(8,"0")+g.toString(16).padStart(8,"0");}
async function authHash(pw,salt){try{if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+"|"+pw));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}}catch(e){}return authHashFallback(pw,salt);}
function authSalt(){let s="";const a="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";for(let i=0;i<16;i++)s+=a[Math.floor((window.crypto&&crypto.getRandomValues?crypto.getRandomValues(new Uint32Array(1))[0]/4294967296:Math.random())*a.length)];return s;}
function authRemembered(){try{return !!(AUTH&&AUTH.enabled&&localStorage.getItem("inv_remember_v1")===AUTH.user);}catch(e){return false;}}
function authApplyRemember(){try{const r=(document.getElementById("authRemember")||{}).checked;if(r&&AUTH&&AUTH.user)localStorage.setItem("inv_remember_v1",AUTH.user);else localStorage.removeItem("inv_remember_v1");}catch(e){}}
/* la sesión solo dura mientras la pestaña esté abierta; al volver a entrar a Investor se pide la contraseña (sin recordar) */
function authSessionOk(){try{return !!(AUTH&&AUTH.enabled&&sessionStorage.getItem("inv_sess_v1")===AUTH.user);}catch(e){return false;}}
function authGateEl(){return document.getElementById("authGate");}
function authShow(show){const g=authGateEl();if(!g)return;g.classList.toggle("open",!!show);try{document.body.style.overflow=show?"hidden":"";}catch(e){}}
function authInit(){
  AUTH=lsGet("inv_auth_v1");
  try{localStorage.removeItem("inv_remember_v1");}catch(e){}   // ya no se recuerda la contraseña: siempre se pide al entrar
  if(!AUTH){authMode="create";authRender();authShow(true);return;}
  if(!AUTH.enabled){authShow(false);return;}
  if(authSessionOk()){authShow(false);return;}
  authMode="login";authRender();authShow(true);
}

    ${authMsg?`<div class="auth-msg">${authMsg}</div>`:""}
    <button class="auth-btn" id="authGo">${create?"Crear acceso y entrar":"Entrar"}</button>
    ${create?`<div class="auth-skip"><a id="authSkip">Usar sin contraseña</a></div>`:`<div class="auth-skip"><a id="authForgot">¿Olvidaste tu contraseña?</a></div>`}
    <div class="auth-foot">Acceso local · tus datos viven solo en este navegador · simulación educativa, no es asesoría financiera</div>
  </div>`;
  const go=document.getElementById("authGo");if(go)go.onclick=authSubmit;
  ["authUser","authPass","authPass2"].forEach(id=>{const e=document.getElementById(id);if(e)e.onkeydown=ev=>{if(ev.key==="Enter")authSubmit();};});
  const sk=document.getElementById("authSkip");if(sk)sk.onclick=()=>{AUTH={enabled:false};lsSet("inv_auth_v1",AUTH);try{localStorage.removeItem("inv_remember_v1");}catch(e){}authShow(false);};
  const fg=document.getElementById("authForgot");if(fg)fg.onclick=()=>{authMsg="El acceso es local y la contraseña no se puede recuperar. Puedes restablecerlo (se mantienen tus datos) y crear uno nuevo.";authRender();const f=document.getElementById("authForgot");if(f){f.textContent="Restablecer acceso";f.onclick=()=>{if(confirm('¿Restablecer el acceso? Se quitará la contraseña actual (tus proyectos y datos se conservan).')){AUTH=null;lsSet("inv_auth_v1",null);try{localStorage.removeItem("inv_remember_v1");}catch(e){}authMode="create";authMsg="";authRender();}};}};
}
async function authSubmit(){
  const u=(document.getElementById("authUser")||{}).value||"",p=(document.getElementById("authPass")||{}).value||"";
  if(authMode==="create"){
    const p2=(document.getElementById("authPass2")||{}).value||"";
    if(u.trim().length<2){authMsg="Elige un usuario de al menos 2 caracteres.";authRender();return;}
    if(p.length<4){authMsg="La contraseña debe tener al menos 4 caracteres.";authRender();return;}
    if(p!==p2){authMsg="Las contraseñas no coinciden.";authRender();return;}
    const salt=authSalt(),hash=await authHash(p,salt);
    AUTH={enabled:true,user:u.trim(),salt,hash};lsSet("inv_auth_v1",AUTH);
    try{sessionStorage.setItem("inv_sess_v1",AUTH.user);}catch(e){}
    authMsg="";authShow(false);
  }else{
    if(!AUTH||!AUTH.enabled){authShow(false);return;}
    const hash=await authHash(p,AUTH.salt);
    if(u.trim()===AUTH.user&&hash===AUTH.hash){try{sessionStorage.setItem("inv_sess_v1",AUTH.user);}catch(e){}authMsg="";authShow(false);}
    else{authMsg="Usuario o contraseña incorrectos.";authRender();}
  }
}
function authLock(){try{sessionStorage.removeItem("inv_sess_v1");localStorage.removeItem("inv_remember_v1");}catch(e){}authInit();}

  // "objetivo vs real". Solo se actualizan las métricas del proyecto y el escenario "Cartera real".
  try{const M=pMetricsUniverse(sel.sel,t=>{const hd=p.holdings.find(h=>h.t===t);return hd?hd.b:null;});
    if(M){p.bp=+M.bp.toFixed(3);p.erCapm=+M.erCapm.toFixed(2);p.sig=+M.sig.toFixed(2);p.sharpe=+M.sharpe.toFixed(2);p.corrAvg=+M.corrAvg.toFixed(2);}}catch(e){}

/* pesos REALES ejecutados (desde la compra weeks[0].qty): {sel:{t:%},amount} o null si aún no hay compra real */
function projRealSel(p){
  const b0=p&&p.weeks&&p.weeks[0];if(!b0||!b0.qty||!p.holdings||!p.holdings.length)return null;
  const per={};let tot=0;p.holdings.forEach(hd=>{const m=(b0.qty[hd.t]||0)*((b0.prices&&b0.prices[hd.t])||0);per[hd.t]=m;tot+=m;});
  if(!(tot>0))return null;
  const sel={};p.holdings.forEach(hd=>{sel[hd.t]=+(per[hd.t]/tot*100).toFixed(4);});
  return {sel,amount:Math.round(tot)};
}
/* escenario "de construcción" derivado del proyecto: refleja la compra REAL (weeks[0].qty) si ya existe —

  if(!p||!p.holdings||!p.holdings.length)return null;

  return {id:"sim_"+p.id,name:(rs?"Cartera real · ":"Construcción · ")+(p.name||"inicial"),amount:amount,sel:sel,

/* motor GBM log-normal: N trayectorias, pasos mensuales, con aporte mensual opcional; devuelve percentiles por paso */

  // control no vuelve a sortear trayectorias (los números no "saltan"); "Volver a simular" fuerza un sorteo nuevo
  const _mck=[v0,mu,sg,st.horizonY,st.contrib||0,st.paths,st.reroll||0].join("|");
  let R;if(st._k===_mck&&st._R){R=st._R;}else{R=mcSimulate({v0,mu,sig:sg,horizonY:st.horizonY,contrib:st.contrib,goalOn:false,goal:0,paths:st.paths});st._k=_mck;st._R=R;}
  const probGoal=(st.goalOn&&st.goal>0)?mcProbGoal(R,st.goal):null;
  const fin=R.final,invested=R.invested,medGain=invested>0?(fin.p50/invested-1)*100:0;
  const goalTile=(st.goalOn&&probGoal!=null)
    ? tile("Prob. de meta",(probGoal*100).toFixed(0)+"%","alcanzar "+fmtK(st.goal),MC,probGoal>=0.6?green:probGoal>=0.3?amber:red)
    : tile("Media esperada",fmtCLP(fin.mean),"promedio de trayectorias",MC,ink);
  const tiles=`<div class="tiles">
    ${tile("Mediana a "+st.horizonY+" año"+(st.horizonY>1?"s":""),fmtCLP(fin.p50),(medGain>=0?"+":"")+medGain.toFixed(1)+"% vs aportado",MC,col(medGain))}
    ${tile("Rango probable (50%)",fmtK(fin.p25)+" – "+fmtK(fin.p75),"entre p25 y p75",MC,ink)}
    ${tile("Optimista (p95)",fmtCLP(fin.p95),"solo 5% supera esto",MC,green)}
    ${tile("Adverso (p5)",fmtCLP(fin.p5),"solo 5% cae bajo esto",MC,red)}
    ${tile("Prob. de pérdida",(R.probLoss*100).toFixed(0)+"%","terminar bajo lo aportado ("+fmtK(invested)+")",MC,R.probLoss>0.4?red:R.probLoss>0.2?amber:green)}
    ${goalTile}</div>`;
  // riesgo DEL CAMINO (no solo del punto final): el peor retroceso que verías en una trayectoria típica
  const dd=R.ddStats||{};
  const riskTiles=`<div class="tiles" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
    ${tile("Caída máx. típica","−"+((dd.p50||0)*100).toFixed(0)+"%","peor retroceso en la trayectoria mediana",MC,amber)}
    ${tile("Caída máx. (peor 10%)","−"+((dd.p90||0)*100).toFixed(0)+"%","en 1 de cada 10 trayectorias es peor",MC,red)}
    ${tile("Prob. de ver una caída ≥20%",((dd.prob20||0)*100).toFixed(0)+"%","en algún momento del camino",MC,(dd.prob20||0)>0.5?red:(dd.prob20||0)>0.25?amber:green)}
    ${tile("Prob. de ver una caída ≥30%",((dd.prob30||0)*100).toFixed(0)+"%","en algún momento del camino",MC,(dd.prob30||0)>0.35?red:(dd.prob30||0)>0.15?amber:green)}</div>`;
  const leg=`<div class="legend"><span><span class="lgdot" style="background:${MC};opacity:.28"></span>Rango 5–95%</span><span><span class="lgdot" style="background:${MC};opacity:.5"></span>Rango 25–75%</span><span><span class="lgdot" style="background:${MC}"></span>Mediana</span>${st.goalOn?`<span><span class="lgdot" style="background:${green}"></span>Meta</span>`:""}</div>`;
  const chart=card("Abanico de proyección","Cada banda es un rango de resultados posibles; la línea central es la mediana. "+(st.contrib>0?("Aporte mensual "+fmtCLP(st.contrib)+". "):"")+R.N+" trayectorias · horizonte "+st.horizonY+" año"+(st.horizonY>1?"s":"")+".",svgFan({steps:R.steps,v0:v0,goal:st.goalOn?st.goal:0,c:MC,h:344}),leg);
  // HITOS POR AÑO: la distribución en cada año cumplido, con prob. de meta si hay meta activa
  const yrs=Object.keys(R.yearCols||{}).map(Number).sort((a,b)=>a-b);
  const hitosRows=yrs.map(y=>{const s=R.steps[y*12];const pg=(st.goalOn&&st.goal>0)?mcColGE(R.yearCols[y],st.goal):null;
    const inv_y=v0+(st.contrib||0)*y*12;const g=s.p50/inv_y-1;
    return `<tr><td><b>Año ${y}</b></td><td class="r" style="color:${red}">${fmtK(s.p5)}</td><td class="r">${fmtK(s.p25)}</td><td class="r" style="font-weight:800;color:${MC}">${fmtCLP(s.p50)}</td><td class="r">${fmtK(s.p75)}</td><td class="r" style="color:${green}">${fmtK(s.p95)}</td><td class="r" style="color:${col(g*100)}">${(g>=0?"+":"")+(g*100).toFixed(1)}%</td>${st.goalOn?`<td class="r" style="font-weight:700;color:${pg==null?muted:pg>=0.6?green:pg>=0.3?amber:red}">${pg==null?"—":(pg*100).toFixed(0)+"%"}</td>`:""}</tr>`;}).join("");
  const hitos=yrs.length?card("Hitos por año","La distribución de resultados en cada año cumplido del horizonte"+(st.goalOn?" · última columna: probabilidad de haber alcanzado la meta ese año":""),{html:`<div class="tw"><table><thead><tr><th>Hito</th><th class="r">Adverso (p5)</th><th class="r">p25</th><th class="r">Mediana</th><th class="r">p75</th><th class="r">Optimista (p95)</th><th class="r">Mediana vs aportado</th>${st.goalOn?'<th class="r">Prob. meta</th>':''}</tr></thead><tbody>${hitosRows}</tbody></table></div>`,flush:true}):"";
  const guia=card("Cómo leer esta proyección","Guía rápida del método y sus límites",`
    <div class="proj-steps">
      <div class="pstep"><span class="pstep-n">1</span><div class="pstep-b"><b>Parámetros</b><span>μ (retorno esperado) y σ (riesgo) vienen del <b>proyecto activo</b> — su E(R) CAPM y su volatilidad — o los ajustas a mano. El capital inicial es el valor actual de la cartera.</span></div></div>
      <div class="pstep"><span class="pstep-n">2</span><div class="pstep-b"><b>Simulación</b><span>Se sortean ${st.paths} trayectorias posibles del capital (modelo GBM log-normal, pasos mensuales). No predice el futuro: muestra el <b>rango</b> de futuros compatibles con μ y σ.</span></div></div>
      <div class="pstep"><span class="pstep-n">3</span><div class="pstep-b"><b>Lectura</b><span>La <b>mediana</b> es el escenario central (50/50). El rango <b>p25–p75</b> concentra la mitad de los casos. <b>p5/p95</b> son los extremos razonables: no techos ni pisos absolutos.</span></div></div>
      <div class="pstep"><span class="pstep-n">4</span><div class="pstep-b"><b>Decisiones</b><span>Usa la <b>prob. de meta</b> para calibrar aporte mensual y horizonte, y las <b>caídas del camino</b> para saber qué retrocesos deberías tolerar sin vender.</span></div></div>
    </div>
    <div class="note" style="margin-top:12px"><b>Supuestos y límites.</b> μ y σ constantes durante todo el horizonte (los mercados reales tienen ciclos y crisis que este modelo suaviza); retornos log-normales (subestima eventos extremos); aportes constantes a fin de mes; no descuenta comisiones ni impuestos ni inflación. Cambiar la <b>meta</b> no re-sortea las trayectorias; «Volver a simular» sí. Herramienta educativa: no es una promesa de rentabilidad.</div>`);
  const note=notecard(`En <b>${st.horizonY} año${st.horizonY>1?"s":""}</b>, partiendo de <b>${fmtCLP(v0)}</b>${st.contrib>0?(" más aportes de "+fmtCLP(st.contrib)+"/mes"):""} con μ ${mu.toFixed(1)}% y σ ${sg.toFixed(1)}% anual: la mitad de los escenarios termina entre <b>${fmtK(fin.p25)}</b> y <b>${fmtK(fin.p75)}</b>, con mediana <b>${fmtCLP(fin.p50)}</b>. En el 5% más adverso el capital cae a <b>${fmtK(fin.p5)}</b> o menos; hay <b>${(R.probLoss*100).toFixed(0)}%</b> de probabilidad de terminar bajo lo aportado. En el camino, la trayectoria típica sufre un retroceso máximo de <b>−${((dd.p50||0)*100).toFixed(0)}%</b>. La dispersión crece con el horizonte: a más tiempo, más rango entre el mejor y el peor escenario.${mu<=RF?" Con μ ≤ tasa libre de riesgo, esta proyección es muy conservadora.":""}`);
  return betaBanner+head+tiles+riskTiles+chart+hitos+note+guia;
}
