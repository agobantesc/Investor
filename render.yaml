# ═══════════════════════════════════════════════════════════════════
# Investor · Blueprint de Render
# En https://dashboard.render.com → New → Blueprint → conecta este repo.
# El disco persistente requiere un plan de pago (Starter, ~US$7/mes):
# ahí viven los respaldos, que sobreviven reinicios y deploys.
# Tras crear el servicio: Environment → SYNC_TOKEN → define tu token
# secreto (una frase larga), el mismo que pegarás en la app
# (⚙ Configuración → Respaldo → Nube).
# ═══════════════════════════════════════════════════════════════════
services:
  - type: web
    name: investor
    runtime: node
    # OJO con los nombres de Render: `plan` es el INSTANCE TYPE (el tamaño de la máquina),
    # NO el plan de tu cuenta/workspace (Hobby/Professional). Son independientes:
    #   · el disco persistente se habilita con cualquier instancia DE PAGO (starter en adelante);
    #     tener workspace Professional no lo hace gratis ni más rápido.
    #   · starter alcanza de sobra: servidor sin dependencias, un archivo de 1 MB, un solo usuario.
    #     Subir a standard/pro aquí es gasto puro. Cámbialo solo si Render reporta falta de recursos.
    # Límite que ningún plan levanta: un servicio CON DISCO no hace deploys sin downtime ni escala a
    # varias instancias (el disco se monta en una sola máquina). El reinicio breve de cada deploy es
    # esperado y los respaldos lo sobreviven — para eso está el disco.
    plan: starter
    # RAMA que se despliega. Debe ser la MISMA a la que el bot de cierres hace push,
    # para que la app publicada sirva siempre el closes.json más nuevo. Si algún día
    # mueves el trabajo a otra rama (p.ej. main), cámbiala aquí y en el panel de Render.
    branch: claude/inversor-2-design-upgrade-k864ts
    buildCommand: ""          # la app es un archivo y el servidor no tiene dependencias: nada que construir
    startCommand: node server.js
    autoDeploy: true          # cada push al repo (incluidos los cierres diarios del bot) redeploya solo
    healthCheckPath: /api/health
    disk:
      name: investor-datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      # TOKEN SECRETO de la API de respaldos. Render lo GENERA solo (aleatorio y fuerte) al crear el
      # servicio: no tienes que inventarlo. Lo copias una vez desde Environment y lo pegas en la app
      # (⚙ Configuración → Respaldo → Nube). Puedes reemplazarlo por uno propio cuando quieras.
      # Si tu versión de Render no aceptara `generateValue`, cámbialo por `sync: false` y escribe
      # tú una frase larga en el panel: el resto funciona igual.
      - key: SYNC_TOKEN
        generateValue: true
