# Cierres diarios del IPSA para Investor.
# - Corre de lunes a viernes tras el cierre de la Bolsa de Santiago y guarda data/closes.json (acumulativo).
# - Cada SÁBADO re-baja 2 años completos: la fuente automática re-afirma TODO el histórico (única fuente de
#   la verdad) y pisa cualquier valor manual desviado que hubiera entrado a la base de un navegador.
# - Para poblar/reparar a mano: pestaña Actions → Run workflow → range=2y.
# Investor lo lee desde (rama por defecto del repo):
# https://raw.githubusercontent.com/agobantesc/Investor/claude/inversor-2-design-upgrade-k864ts/data/closes.json
name: Actualizar cierres IPSA
on:
  schedule:
    - cron: "5 22 * * 1-5"   # 22:05 UTC ≈ 18:05/19:05 Chile (después del cierre ~16:00)
    - cron: "0 12 * * 6"     # sábado 12:00 UTC: backfill semanal de 2 años (re-afirma el histórico)
  workflow_dispatch:          # ejecución manual desde la pestaña Actions
    inputs:
      range:
        description: "Rango a bajar (10d para el día a día · 2y para poblar/reparar la base)"
        required: false
        default: "10d"
permissions:
  contents: write
jobs:
  closes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Obtener cierres (Yahoo Finance .SN)
        run: node automation/fetch-closes.mjs
        env:
          RANGE: ${{ github.event.schedule == '0 12 * * 6' && '2y' || github.event.inputs.range || '10d' }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}   # opcional: historia REAL del IPSA de respaldo (twelvedata.com, tier gratuito)
          EODHD_KEY: ${{ secrets.EODHD_KEY }}             # opcional (pagado ~US$20/mes): cierres OFICIALES de la Bolsa (eodhd.com) — pisan a Yahoo y cuadran con la cartola del corredor
      - name: Obtener fundamentos (P/U, P/B, dividendos, capitalización)
        run: node automation/fetch-fundamentals.mjs   # sale con 0 aunque falle: nunca rompe los cierres
        continue-on-error: true
      - name: Commit del JSON
        run: |
          git config user.name "closes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Sin cambios" || git commit -m "cierres: $(date -u +%F) (${RANGE:-10d})"
          git push
        env:
          RANGE: ${{ github.event.schedule == '0 12 * * 6' && '2y' || github.event.inputs.range || '10d' }}
