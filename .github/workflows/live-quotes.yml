# Cotizaciones EN VIVO (intradía ~15 min) para la vista "EN VIVO" de Investor.
# - Corre cada 15 min en horario bursátil (el corte fino L–V 09:25–17:20 Chile lo decide el script).
# - Publica data/live.json en la rama `live-data` con force-push: una sola punta, cero ruido en el historial.
# - SOLO VISUALIZACIÓN: nunca toca data/closes.json ni la historia; los cierres oficiales siguen siendo
#   la única fuente de la verdad del seguimiento (workflow update-closes).
# Investor lo lee desde:
# https://raw.githubusercontent.com/agobantesc/Investor/live-data/data/live.json
name: Cotizaciones en vivo
on:
  schedule:
    - cron: "*/15 12-22 * * 1-5"   # UTC, con margen para el cambio de hora chileno (UTC-3/UTC-4)
  workflow_dispatch: {}             # ejecución manual desde la pestaña Actions (FORCE ignora el horario)
    # sin inputs
permissions:
  contents: write
concurrency:
  group: live-quotes
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Obtener cotizaciones (Yahoo, diferido ~15 min)
        run: node automation/fetch-live.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      - name: Publicar en la rama live-data
        run: |
          if [ ! -s data/live.json ]; then echo "Sin live.json (mercado cerrado)"; exit 0; fi
          git config user.name "live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/live.json
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; } || true
          git commit -m "en vivo: $(date -u +%FT%H:%M)Z"
          git push --force origin HEAD:live-data
